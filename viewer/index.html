    const focusBtn = el(`<button class="btn" aria-pressed="${state.focus.has(id)}" title="Show only what is connected to this page">${FOCUS_ICON} Connected</button>`);
    focusBtn.addEventListener("click", () => { toggleFocus(id); if (state.focus.has(id)) location.hash = "#/"; });
    const prev = at > 0 ? el(`<a class="btn" href="${pageHref(order[at - 1].id)}" title="${esc(order[at - 1].id)}">←</a>`) : null;
    const next = at >= 0 && at < order.length - 1 ? el(`<a class="btn" href="${pageHref(order[at + 1].id)}" title="${esc(order[at + 1].id)}">→</a>`) : null;
    const playBtn = el('<button class="btn" title="Play this view through time">▶ Play</button>');
    header(page.id, `<a href="#/">Graph</a> › <a href="#/?section=${encodeURIComponent(page.section)}">${esc(page.section)}</a> › ${plural(page.views.length, "view")}`, [playBtn, focusBtn, prev, next].filter(Boolean),
      "<p>The tabs hold every view of this page: the page itself, its signed-out version where that differs, and each section, dialog and menu found on it. Pick one to see it across time. Snapshots where it looked the same as before, or where the view was not on the page, are folded into the small dashed cards. Click a screenshot to enlarge it and step through time with the arrow keys; the slider at the bottom compares any two snapshots, and Full screen gives it the whole window.</p>");
    const pad = el('<div class="pad"></div>');

    // Summary: when the page came and went, then its relations grouped by kind.
    const head = el('<div class="pagehead"></div>');
    const added = page.history.find((h) => h.kind === "added");
    const gone = page.life?.length && page.life[page.life.length - 1].to ? [...page.history].reverse().find((h) => h.kind === "deleted") : null;
    const life = el('<p class="life"></p>');
    life.innerHTML = added
      ? `Added on <b>${esc(added.date)}</b> <span class="muted">in <span class="mono">${esc(added.sha)}</span> · ${esc(added.subject)}</span>`
      : `First captured on <b>${esc(snaps.find((s) => page.presence[s.id])?.date ?? "–")}</b>`;
    if (gone) life.innerHTML += ` · <span class="pill gone">deleted</span> <b>${esc(gone.date)}</b> <span class="mono muted">${esc(gone.sha)}</span>`;
    head.append(life);
    const rels = H.edges.filter((e) => e.source !== "git" && (e.from === id || e.to === id));
    if (rels.length) {
      const groups = new Map();
      for (const e of rels) {
        const out = e.from === id;
        const text = (EDGE_TEXT[e.kind === "extract" ? "extract" : e.type] ?? ["Linked to", "Linked from"])[out ? 0 : 1];
        const cls = isOutOf(e) ? "new" : e.type === "merged" || e.type === "replaced" ? "gone" : "link";
        (groups.get(text) ?? groups.set(text, { cls, items: [] }).get(text)).items.push({ e, other: out ? e.to : e.from });
      }
      const dl = el('<dl class="rels"></dl>');
      for (const [text, { cls, items }] of groups) {
        const dates = [...new Set(items.map((x) => x.e.date))];
        dl.append(el(`<dt><span class="pill ${cls}">${esc(text)}</span></dt>`));
        const dd = el(`<dd><span class="relchips">${items.map(({ other }) => `<a class="chip" href="${pageHref(other)}" title="${esc(other)}">${routeHtml(other)}</a>`).join("")}</span><span class="muted reldate">${dates.map(esc).join(", ")}</span></dd>`);
        const notes = items.filter((x) => x.e.note);
        if (notes.length) {
          const why = el(`<details class="why"><summary>Why?</summary><ul>${notes.map(({ e, other }) => `<li><span class="mono">${esc(other)}</span>${e.confidence ? ` <span class="muted">· ${esc(e.confidence)} confidence</span>` : ""}<br>${esc(e.note)}</li>`).join("")}</ul></details>`);
          dd.append(why);
        }
        dl.append(dd);
      }
      head.append(dl);
    }
    pad.append(head);

    if (!page.views.length) {
      pad.append(el('<div class="empty">There are no screenshots of this page: it existed only between two snapshots, only ever redirected, or could not be captured.</div>'));
      content.replaceChildren(pad); return;
    }
    // The page's views as tabs: the page itself first, then sections, dialogs and menus.
    const view = page.views.find((v) => v.id === viewId) ?? mainView(page) ?? page.views[0];
    const wrap = el('<div class="pagewrap"><nav class="views" aria-label="Views of this page"></nav><div class="detail"></div></div>');
    const nav = wrap.querySelector(".views");
    for (const kind of ["page", "signed-out", "section", "dialog", "menu"]) {
      const group = page.views.filter((v) => v.kind === kind);
      if (!group.length) continue;
      const box = el(`<div class="vgroup">${kind === "page" || kind === "signed-out" ? "" : `<span class="vkind">${KIND_LABEL[kind]}</span>`}</div>`);
      for (const v of group) box.append(el(`<a href="${pageHref(page.id, v.id)}" aria-current="${v === view}" title="${esc(v.label)} · changed in ${plural(changesOf(v), "snapshot")}">${esc(kind === "page" ? "Whole page" : v.label)}</a>`));
      nav.append(box);
    }

    const detail = wrap.querySelector(".detail");

    const strip = el('<div class="strip"></div>');
    const series = seriesFor(`${page.id}${view.id === "page" ? "" : " · " + view.label}`, view);
    playBtn.addEventListener("click", () => { const first = series.frames.findIndex(Boolean); if (first >= 0) openLightbox(series, first, true); });
    let run = null;
    const flush = () => {
      if (!run) return;
      const parts = [];
      if (run.without) parts.push(`${plural(run.without, "snapshot")} without this view`);
      if (run.missing) parts.push(`${plural(run.missing, "snapshot")} where the page exists but could not be captured`);
      if (run.redirect) parts.push(`${plural(run.redirect, "snapshot")} redirecting to <a class="mono" href="${pageHref(run.redirectTo)}">${esc(run.redirectTo)}</a>`);
      if (run.same) parts.push(`${run.same} unchanged`);
      const card = el(`<div class="frame skip ${narrow() ? "narrow" : ""}"><header><b>${esc(run.from.slice(5))}</b>${run.from !== run.to ? `<span class="mono">→ ${esc(run.to.slice(5))}</span>` : ""}</header>
        <div class="gap">${parts.join("<br>")}${run.same ? '<br><button class="linkbtn">Show them</button>' : ""}</div></div>`);
      card.querySelector("button")?.addEventListener("click", () => { state.showSame = true; render(); });
      strip.append(card);
      run = null;
    };
    const skip = (s, kind, extra) => { run ??= { from: s.date, to: s.date, without: 0, same: 0, missing: 0, redirect: 0 }; run.to = s.date; run[kind]++; if (extra) run.redirectTo = extra; };
    snaps.forEach((s, i) => {
      const st = viewStatus(view, i);
      const ps = status(page, i);
      if (!st.shot && ps.kind === "absent") return;
      if (st.kind === "same" && !state.showSame) { skip(s, "same"); return; }
      if (!st.shot && view.id !== "page") { skip(s, "without"); return; }
      // A snapshot with nothing to show is noted in the small card, not given a frame of its own.
      if (!st.shot && ps.kind === "missing") { skip(s, "missing"); return; }
      if (!st.shot && ps.kind === "redirect") { skip(s, "redirect", ps.to); return; }
      flush();
      const frame = el(`<div class="frame ${narrow() ? "narrow" : ""}"><header><b>${esc(s.date)}</b><span class="mono">${esc(s.id)}</span>${pillFor(st)}</header></div>`);
      if (st.shot && img(st.shot)) {
        const b = el(`<button class="shot" title="Open full size"><img loading="lazy" src="${esc(img(st.shot).mid)}" alt="${esc(page.id)} on ${esc(s.date)}"></button>`);
        b.addEventListener("click", () => openLightbox(series, i));
        frame.append(b);
      } else {
        const ps = status(page, i);
        const why = ps.kind === "redirect" ? `Redirects to <a class="mono" href="${pageHref(ps.to)}">${esc(ps.to)}</a>` : ps.kind === "missing" ? "Exists, but could not be captured" : "Not found on the page at this point";
        frame.append(el(`<div class="gap">${why}</div>`));
      }
      frame.append(el(`<div class="caption" title="${esc(s.subject)}">${esc(s.subject)}</div>`));
      if (st.shot?.sources) {
        const src = st.shot.sources;
        const d = el(`<details class="sources"><summary>${plural(src.total, "source file")} changed in ${plural(src.commits, "commit")}</summary><ul>${src.changed.map((f) => `<li class="mono">${esc(f)}</li>`).join("")}${src.total > src.changed.length ? `<li class="muted">… and ${src.total - src.changed.length} more</li>` : ""}</ul></details>`);
        frame.append(d);
      }
      strip.append(frame);
    });
    flush();
    detail.append(strip);
    const withShots = snaps.filter((s, i) => img(view.shots[s.id]) && (state.showSame || viewStatus(view, i).kind !== "same"));
    if (withShots.length >= 2) {
      detail.append(compare(view, withShots));
    }
    pad.append(wrap);
    content.replaceChildren(pad);
  }

  function compare(view, withShots) {
    const options = (sel) => withShots.map((s) => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.date)} · ${esc(s.id)}</option>`).join("");
    const box = el(`<div class="compare"><div class="cmptitle"><h2 class="h2big">Compare two points in time</h2><span class="spacer"></span><button class="btn" data-full title="Fill the window (Esc to leave)">Full screen</button></div>
      <div class="controls"><select class="field">${options(withShots[0].id)}</select><span class="cmphint">Drag the line over the image</span><select class="field">${options(withShots[withShots.length - 1].id)}</select></div>
      <div class="stage"><img class="before" alt=""><img class="after" alt=""><canvas class="tintc"></canvas><div class="handle" role="slider" aria-label="Reveal" aria-valuemin="0" aria-valuemax="100" tabindex="0"><span class="grip">⟷</span></div></div></div>`);
    const [a, b] = box.querySelectorAll("select");
    const stage = box.querySelector(".stage"), before = box.querySelector(".before"), after = box.querySelector(".after"), handle = box.querySelector(".handle");
    let split = 50;
    const paint = () => { after.style.clipPath = `inset(0 0 0 ${split}%)`; handle.style.left = split + "%"; handle.setAttribute("aria-valuenow", Math.round(split)); };
    const tintc = box.querySelector(".tintc");
    // The tint for an arbitrary pair is computed here from the two images, with the same
    // block comparison the build uses.
    const retint = async () => {
      if (!state.tint) { tintc.style.display = "none"; return; }
      const loadImg = (src) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
      const [A, B] = await Promise.all([loadImg(before.src), loadImg(after.src)]);
      if (!A || !B) return;
      const W = 96, BL = 8, cols = W / BL;
      const sampleOf = (im) => { const h = Math.max(1, Math.round((im.naturalHeight * W) / im.naturalWidth)); const cv = document.createElement("canvas"); cv.width = W; cv.height = h; const g = cv.getContext("2d"); g.drawImage(im, 0, 0, W, h); return { d: g.getImageData(0, 0, W, h).data, h }; };
      const [x, y] = [sampleOf(A), sampleOf(B)];
      const rows = Math.ceil(Math.max(x.h, y.h) / BL), shared = Math.min(x.h, y.h);
      const runs = []; let current = 0, run = 0;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        let hit = r * BL >= shared;
        if (!hit) { let sum = 0, n = 0; for (let yy = r * BL; yy < Math.min((r + 1) * BL, shared); yy++) for (let xx = c * BL; xx < (c + 1) * BL; xx++) { const i = (yy * W + xx) * 4; sum += Math.abs(x.d[i] - y.d[i]) + Math.abs(x.d[i + 1] - y.d[i + 1]) + Math.abs(x.d[i + 2] - y.d[i + 2]); n += 3; } hit = sum / n > 10; }
        const bit = hit ? 1 : 0; if (bit === current) run++; else { runs.push(run); current = bit; run = 1; }
      }
      runs.push(run);
      drawMask(tintc, { cols, rows, runs });
      tintc.style.height = before.getBoundingClientRect().height + "px";
    };
    const load = () => { before.src = img(view.shots[a.value]).full; after.src = img(view.shots[b.value]).full; paint(); before.onload = retint; };
    [a, b].forEach((n) => n.addEventListener("input", load));
    const setFromPointer = (e) => { const r = stage.getBoundingClientRect(); split = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)); paint(); };
    stage.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      setFromPointer(e);
      const move = (ev) => setFromPointer(ev);
      const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
    const fullBtn = box.querySelector("[data-full]");
    const setFull = (on) => {
      state.compareFull = on;
      box.classList.toggle("full", on);
      fullBtn.textContent = on ? "Exit full screen" : "Full screen";
      if (on) { document.addEventListener("keydown", onEsc, true); stage.focus?.(); } else document.removeEventListener("keydown", onEsc, true);
      requestAnimationFrame(retint);
    };
    const onEsc = (e) => {
      if (!box.isConnected) { document.removeEventListener("keydown", onEsc, true); return; } // replaced by a re-render
      if (e.key === "Escape" && !lb.box.classList.contains("open")) { e.preventDefault(); e.stopPropagation(); setFull(false); }
    };
    fullBtn.addEventListener("click", () => setFull(!box.classList.contains("full")));
    if (state.compareFull) setFull(true); // kept across re-renders (a resize), dropped when leaving the page
    window.addEventListener("hashchange", () => setFull(false), { once: true });
    handle.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { split = Math.max(0, split - 2); paint(); } if (e.key === "ArrowRight") { split = Math.min(100, split + 2); paint(); } });
    load();
    return box;
  }

  // ---------- Story ----------
  function renderStory() {
    const entries = H.changelog ?? [];
    header("Story", `${plural(entries.length, "chapter")} · written from the snapshots and the commits`, [], "<p>A written account of how the UI evolved, one chapter per period. Each chapter links the pages and snapshots it talks about. The agent writes it from the lineage and the captured changes; edit <code>.ui-progress/changelog.json</code> to change it.</p>");
    const pad = el('<div class="pad"></div>');
    if (!entries.length) { pad.append(el('<div class="empty">No story yet. Ask the agent to write the changelog (<code>ui-progress changelog candidates</code> gives it the material).</div>')); content.replaceChildren(pad); return; }
    const list = el('<div class="story"></div>');
    for (const e of entries) {
      const snap = e.snapshot && snapIndex[e.snapshot] != null ? snaps[snapIndex[e.snapshot]] : null;
      const card = el(`<article class="chapter"><div class="when">${esc(e.from ?? e.date ?? "")}${e.to && e.to !== e.from ? ` → ${esc(e.to)}` : ""}</div><h2>${esc(e.title)}</h2><p>${esc(e.text)}</p><div class="refs"></div></article>`);
      const refs = card.querySelector(".refs");
      for (const id of e.pages ?? []) if (pageById[id]) refs.append(el(`<a class="chip" href="${pageHref(id)}">${esc(id)}</a>`));
      if (snap) refs.append(el(`<a class="btn" href="#/snapshot/${snap.id}">See the site on ${esc(snap.date)}</a>`));
      list.append(card);
    }
    pad.append(list);
    content.replaceChildren(pad);
  }

  // ---------- Runs ----------
  const dur = (sec) => {
    if (sec == null) return "?";
    const x = Math.round(sec);
    if (x < 60) return `${x}s`;
    if (x < 3600) return `${Math.floor(x / 60)}m ${String(x % 60).padStart(2, "0")}s`;
    return `${Math.floor(x / 3600)}h ${String(Math.floor((x % 3600) / 60)).padStart(2, "0")}m`;
  };
  const num = (n) => (n ?? 0).toLocaleString("en");
  function renderRuns() {
    const S = H.stats;
    const runs = S?.commits ?? [];
    header("Runs", runs.length ? `${plural(S.totals.attempts, "attempt")} on ${plural(runs.length, "commit")} · from <span class="mono">runs.jsonl</span>` : "", [],
      "<p>How the snapshots were made. Every <code>ui-progress snapshot</code> attempt is recorded in <code>.ui-progress/runs.jsonl</code>: how long each phase took, what was captured, why pages were recaptured instead of copied forward, and whether the adapter, config or screens changed since the attempt before (a setup fix). Tokens, tool calls and agent time are what the agent reported with <code>ui-progress stats note</code>; ui-progress cannot check them. The same data is in <code>ui-progress stats</code>.</p>");
    const pad = el('<div class="pad"></div>');
    if (!runs.length) { pad.append(el('<div class="empty">No runs recorded yet. Every <code>ui-progress snapshot</code> adds a line to <code>.ui-progress/runs.jsonl</code>; rebuild the viewer afterwards.</div>')); content.replaceChildren(pad); return; }
    const t = S.totals;
    const box = el('<div class="runs"></div>');
    const tile = (v, k, d = "") => `<div class="tile"><div class="v">${v}</div><div class="k">${esc(k)}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
    box.append(el(`<div class="tiles">
      ${tile(`${t.captured}<span class="muted" style="font-size:14px;font-weight:500"> / ${t.commits}</span>`, "commits captured", t.failed ? `${t.failed} without a snapshot` : t.standIns ? `${plural(t.standIns, "stand-in")}` : "")}
      ${tile(dur(t.finalSeconds), "capture time", "final runs")}
      ${tile(dur(t.attemptSeconds), "all attempts", `${plural(t.attempts, "attempt")}${t.failedAttempts ? `, ${t.failedAttempts} failed` : ""}`)}
      ${tile(num(t.pagesCaptured), "pages shot", t.reused ? `${num(t.reused)} copied forward` : "")}
      ${tile(num(t.shots), "screenshots", `${num(t.states)} states`)}
      ${tile(String(t.fixes), t.fixes === 1 ? "setup fix" : "setup fixes", `${t.firstTry} of ${t.commits - (t.imported ?? 0)} clean first try${t.imported ? ` · ${t.imported} imported` : ""}`)}
      ${tile(String(t.suspects), "suspect pages", t.skipped ? `${t.skipped} skipped` : "")}
      ${S.agent ? tile(S.agent.tokens != null ? num(S.agent.tokens) : dur(S.agent.seconds), S.agent.tokens != null ? "agent tokens" : "agent time", `reported by the agent${S.agent.toolCalls != null ? ` · ${num(S.agent.toolCalls)} tool calls` : ""}`) : ""}
    </div>`));
    if (S.conclusions?.length) box.append(el(`<section><div class="h2">What the numbers say</div><ul class="findings">${S.conclusions.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></section>`));

    // One row per commit; each attempt is a bar as long as it took, failed ones outlined.
    const withAgent = runs.some((c) => c.agent);
    const agentCell = (a) => (a ? [a.tokens != null && `${Math.round(a.tokens / 1000)}k tok`, a.seconds != null && dur(a.seconds)].filter(Boolean).join(" · ") : "");
    const longest = Math.max(1, ...runs.flatMap((c) => c.attempts.map((a) => a.seconds ?? 0)));
    const tip = document.getElementById("tip");
    const rows = runs.map((c, ci) => {
      const f = c.final;
      const known = snapIndex[c.sha] != null;
      const bars = c.attempts.map((a, ai) => `<span class="try ${a.ok ? "" : "fail"}" data-c="${ci}" data-a="${ai}" style="width:${Math.max(3, Math.round(((a.seconds ?? 0) / longest) * 120))}px"></span>`).join("");
      const last = c.attempts[c.attempts.length - 1];
      const result = c.ok ? (c.firstTry ? "ok, first try" : c.imported ? '<span title="Read back from the snapshot folder: made before run records existed">ok · imported</span>' : "ok") + (c.standsInFor.length ? ` · for ${esc(c.standsInFor.join(", "))}` : "") : `<span class="x">✗</span> failed in ${esc(last.phase ?? "?")}`;
      return `<tr>
        <td>${esc(c.date)}</td>
        <td>${known ? `<a class="mono" href="#/snapshot/${esc(c.sha)}">${esc(c.sha)}</a>` : `<span class="mono">${esc(c.sha)}</span>`}<span class="subj" title="${esc(c.subject)}">${esc(c.subject)}</span></td>
        <td><div class="tries">${bars}<span class="s">${dur(last.seconds)}${c.attempts.length > 1 ? ` · ${plural(c.attempts.length, "try", "tries")}` : ""}</span></div></td>
        <td class="num">${f ? `${f.captured}/${f.pages}` : ""}</td>
        <td class="num">${f?.reused ? f.reused : ""}</td>
        <td class="num">${f ? num(f.shots) : ""}</td>
        <td class="num">${f ? num(f.states) : ""}</td>
        <td class="num">${f?.skipped || ""}</td>
        <td class="num">${f?.suspects || ""}</td>
        <td class="num">${c.fixes || ""}</td>
        ${withAgent ? `<td class="num" title="Reported by the agent">${agentCell(c.agent)}</td>` : ""}
        <td>${result}</td>
      </tr>`;
    }).join("");
    const tableBox = el(`<section><div class="h2">Per commit</div><div class="scrollx"><table class="rtable">
      <thead><tr><th>Date</th><th>Commit</th><th>Attempts</th><th class="num">Pages</th><th class="num">Copied</th><th class="num">Shots</th><th class="num">States</th><th class="num">Skipped</th><th class="num">Suspects</th><th class="num">Fixes</th>${withAgent ? '<th class="num" title="Reported by the agent">Agent</th>' : ""}<th>Result</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`);
    tableBox.querySelectorAll(".try").forEach((bar) => {
      const c = runs[bar.dataset.c], a = c.attempts[bar.dataset.a];
      const f = a.ok && Number(bar.dataset.a) === c.attempts.length - 1 ? c.final : null;
      const phases = f?.timings ? Object.entries(f.timings).map(([k, v]) => `${esc(k)} ${dur(v)}`).join(" · ") : "";
      const why = f?.recapture?.reason && f.recapture.reason !== "incremental" ? `<br>everything recaptured: ${esc(f.recapture.reason)}${f.recapture.file ? ` (${esc(f.recapture.file)})` : ""}` : "";
      const html = `<b>${esc(c.sha)}</b> attempt ${Number(bar.dataset.a) + 1} of ${c.attempts.length}<br>${esc(String(a.at ?? "").replace("T", " ").slice(0, 16))} · ${dur(a.seconds)}${a.ok ? "" : `<br>✗ failed in ${esc(a.phase)}${a.error ? `: ${esc(a.error)}` : ""}`}${a.changed?.length ? `<br>after a change to ${esc(a.changed.join(", "))}` : ""}${phases ? `<br>${phases}` : ""}${why}`;
      bar.addEventListener("mousemove", (e) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tip.style.top = e.clientY + 16 + "px"; });
      bar.addEventListener("mouseleave", () => (tip.style.display = "none"));
    });
    box.append(tableBox);

    if (S.phases?.length) {
      const top = S.phases[0].seconds || 1;
      box.append(el(`<section><div class="h2">Where the time goes · final runs</div><div class="phases">${S.phases.map((x) => `<span>${esc(x.phase)}</span><span class="bar"><i style="width:${(x.seconds / top) * 100}%"></i></span><span class="n">${dur(x.seconds)} · ${Math.round(x.share * 100)}%</span>`).join("")}</div></section>`));
    }
    if (S.agent?.tasks?.length) {
      box.append(el(`<section><div class="h2">Other agent tasks · reported by the agent</div><div class="scrollx"><table class="rtable"><thead><tr><th>When</th><th>Task</th><th class="num">Tokens</th><th class="num">Tool calls</th><th class="num">Time</th><th>Model</th><th>Note</th></tr></thead><tbody>${S.agent.tasks.map((a) => `<tr><td>${esc(String(a.at ?? "").replace("T", " ").slice(0, 16))}</td><td>${esc(a.task)}${a.shas.length ? ` <span class="mono muted">${esc(a.shas.join(", "))}</span>` : ""}</td><td class="num">${a.tokens != null ? num(a.tokens) : ""}</td><td class="num">${a.toolCalls ?? ""}</td><td class="num">${a.seconds != null ? dur(a.seconds) : ""}</td><td>${esc(a.model ?? "")}</td><td class="muted">${esc(a.note ?? "")}</td></tr>`).join("")}</tbody></table></div></section>`));
    }
    const fails = Object.entries(S.failedByPhase ?? {});
    const full = (S.fullRecaptures ?? []).filter((r) => r.reason !== "no earlier snapshot");
    if (fails.length || full.length) {
      const parts = [];
      if (fails.length) parts.push(`<div><span class="pill gone">Failed attempts · ${t.failedAttempts}</span><ul>${fails.sort((a, b) => b[1] - a[1]).map(([ph, n]) => `<li>${n} in ${esc(ph)}</li>`).join("")}</ul></div>`);
      if (full.length) parts.push(`<div><span class="pill major">Recaptured everything · ${full.length}</span><ul>${full.map((r) => `<li><span class="mono">${esc(r.sha)}</span> ${esc(r.reason)}${r.file ? ` <span class="mono muted">${esc(r.file)}</span>` : ""}</li>`).join("")}</ul></div>`);
      box.append(el(`<section><div class="h2">Failures and full recaptures</div><div class="summary">${parts.join("")}</div></section>`));
    }
    if (S.machines?.length) box.append(el(`<p class="muted" style="margin:0;font-size:12px">Measured on ${S.machines.map(esc).join("; ")}. Times from different machines or concurrency are not directly comparable.</p>`));
    pad.append(box);
    content.replaceChildren(pad);
  }

  // ---------- Snapshots ----------
  function delta(i) {
    const here = H.pages.filter((p) => exists(p, i));
    return {
      here,
      added: i ? here.filter((p) => !exists(p, i - 1)) : [],
      removed: i ? H.pages.filter((p) => exists(p, i - 1) && !exists(p, i)) : [],
      folded: i ? here.filter((p) => p.presence[snaps[i].id].redirect && !p.presence[snaps[i - 1].id]?.redirect) : [],
      redesigned: here.filter((p) => status(p, i).kind === "major"),
      tweaked: here.filter((p) => status(p, i).kind === "minor"),
    };
  }
  const changedIn = (d) => d.added.length + d.redesigned.length + d.tweaked.length + d.removed.length + d.folded.length;
  /** "2 new · 1 redesigned", each with its change dot; empty when nothing visible changed. */
  const factsHtml = (d) => [[d.added, "new", "new"], [d.redesigned, "major", "redesigned"], [d.tweaked, "minor", "tweaked"], [d.removed, "gone", "removed"], [d.folded, "", "folded into another page"]]
    .filter(([list]) => list.length).map(([list, cls, word]) => `<span class="fact"><span class="cdot ${cls}"></span>${list.length} ${word}</span>`).join("");
  const dayMonth = (date) => new Date(date + "T00:00:00Z").toLocaleString("en", { day: "numeric", month: "short", timeZone: "UTC" });
  /** A screenshot that opens the lightbox; the top edge carries the change colour. */
  function shotButton(page, i, kind, size = "card") {
    const view = mainView(page), im = img(view?.shots[snaps[i].id]);
    if (!im) return el('<span class="shotbtn none"></span>');
    const b = el(`<button class="shotbtn ${kind ?? ""} ${narrow() ? "tall" : ""}" title="${esc(page.id)} on ${esc(snaps[i].date)}"><img loading="lazy" src="${esc(im[size] ?? im.card)}" alt=""></button>`);
    b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openLightbox(seriesFor(page.id, view), i); });
    return b;
  }
  /** The last earlier snapshot in which this page was captured. */
  const before = (page, i) => { for (let j = i - 1; j >= 0; j--) if (img(mainView(page)?.shots[snaps[j].id])) return j; return null; };

  function renderSnapshots() {
    header("Snapshots", `${plural(snaps.length, "snapshot")} of ${H.project.commits} commits · newest first`, [], "<p>Each snapshot is one commit that was built, seeded and screenshotted. The small pictures are the pages that changed in it. Open one to see what changed since the snapshot before, and the whole site as it was then.</p>");
    const pad = el('<div class="pad"><div class="log"></div></div>');
    const log = pad.querySelector(".log");
    let year = null, quiet = [];
    const flushQuiet = () => {
      if (!quiet.length) return;
      const [a, b] = [quiet[quiet.length - 1], quiet[0]];
      const range = a === b ? dayMonth(snaps[a].date) : `${dayMonth(snaps[a].date)} – ${dayMonth(snaps[b].date)}`;
      const row = el(`<details class="quiet"><summary><span></span><span class="rail"><i></i></span><span>${plural(quiet.length, "snapshot")} with no visible change · ${esc(range)}</span></summary><div class="quietlist"></div></details>`);
      for (const k of quiet) row.querySelector(".quietlist").append(el(`<a href="#/snapshot/${snaps[k].id}"><span class="faint">${esc(dayMonth(snaps[k].date))}</span> ${esc(snaps[k].subject)}</a>`));
      log.append(row);
      quiet = [];
    };
    for (let i = snaps.length - 1; i >= 0; i--) {
      const s = snaps[i], d = delta(i);
      const y = s.date.slice(0, 4);
      if (y !== year) { flushQuiet(); year = y; log.append(el(`<h2 class="logyear">${esc(y)}</h2>`)); }
      if (i > 0 && !changedIn(d)) { quiet.push(i); continue; }
      flushQuiet();
      const row = el(`<a class="logrow" href="#/snapshot/${s.id}"><span class="when"><b>${esc(dayMonth(s.date))}</b><span class="mono">${esc(s.id)}</span></span><span class="rail"><i class="knot"></i></span>
        <span class="what"><span class="subj">${esc(s.subject)}</span><span class="facts">${i === 0 ? '<span class="fact">The first snapshot</span>' : factsHtml(d)}<span class="fact faint">${plural(s.pages, "page")}</span></span></span><span class="thumbs"></span></a>`);
      const changed = i === 0 ? d.here.slice(0, 4).map((p) => [p, null]) : [...d.added.map((p) => [p, "new"]), ...d.redesigned.map((p) => [p, "major"]), ...d.tweaked.map((p) => [p, "minor"])].slice(0, 4);
      for (const [p, kind] of changed) row.querySelector(".thumbs").append(shotButton(p, i, kind));
      log.append(row);
    }
    flushQuiet();
    content.replaceChildren(pad);
  }

  /** Every snapshot as a small bar, as tall as what changed in it; the open one is marked. */
  function timeStrip(current) {
    const counts = snaps.map((_, i) => (i ? changedIn(delta(i)) : 0));
    const top = Math.max(1, ...counts);
    const strip = el('<nav class="timestrip" aria-label="All snapshots"></nav>');
    snaps.forEach((s, i) => {
      const d = i ? delta(i) : null;
      const kind = !d ? "base" : d.redesigned.length ? "major" : d.added.length ? "new" : d.removed.length || d.folded.length ? "gone" : d.tweaked.length ? "minor" : "none";
      strip.append(el(`<a href="#/snapshot/${s.id}" class="${i === current ? "on" : ""}" title="${esc(s.date)} · ${esc(s.subject)}${d ? ` · ${plural(counts[i], "change")}` : ""}" ${i === current ? 'aria-current="true"' : ""}><i class="${kind}" style="height:${Math.round(4 + (counts[i] / top) * 24)}px"></i></a>`));
    });
    return strip;
  }

  function renderSnapshot(id) {
    const i = snapIndex[id];
    if (i == null) { header("Unknown snapshot"); content.innerHTML = '<div class="empty">Unknown snapshot.</div>'; return; }
    const s = snaps[i], d = delta(i);
    const prev = i > 0 ? el(`<a class="btn" href="#/snapshot/${snaps[i - 1].id}" title="${esc(snaps[i - 1].subject)} (←)">← ${esc(dayMonth(snaps[i - 1].date))}</a>`) : null;
    const next = i < snaps.length - 1 ? el(`<a class="btn" href="#/snapshot/${snaps[i + 1].id}" title="${esc(snaps[i + 1].subject)} (→)">${esc(dayMonth(snaps[i + 1].date))} →</a>`) : null;
    header(s.subject, `<a href="#/snapshots">Snapshots</a> › ${esc(s.date)} · <span class="mono">${esc(s.id)}</span>`, [prev, next].filter(Boolean),
      "<p>What changed in this commit since the snapshot before, then every other page as it looked at that point. The bars at the top are all snapshots; ← and → step through them.</p>");
    const pad = el('<div class="pad report"></div>');
    pad.append(timeStrip(i));
    const same = d.here.filter((p) => ["same", "base"].includes(status(p, i).kind));
    const parts = [[d.added, "added"], [d.redesigned, "redesigned"], [d.tweaked, "tweaked"], [d.removed, "removed"], [d.folded, "folded into another page"]].filter(([l]) => l.length).map(([l, w]) => `${plural(l.length, "page")} ${w}`);
    pad.append(el(`<p class="lede">${i === 0 ? `The first snapshot: ${plural(d.here.length, "page")}.` : parts.length ? `Since ${esc(dayMonth(snaps[i - 1].date))}: <b>${esc(parts.join(", "))}.</b> ${plural(same.length, "page")} look the same.` : `Nothing visible changed since ${esc(dayMonth(snaps[i - 1].date))}.`}</p>`));

    const group = (kind, title, pages, body) => {
      if (!pages.length) return;
      const sec = el(`<section class="rgroup"><h2><span class="cdot ${kind}"></span>${title}<span class="cnt">${pages.length}</span></h2><div class="rgrid ${narrow() ? "narrow" : ""}"></div></section>`);
      for (const p of pages.sort((a, b) => a.id.localeCompare(b.id))) sec.querySelector(".rgrid").append(body(p));
      pad.append(sec);
    };
    const caption = (p, extra = "") => `<a class="route" href="${pageHref(p.id)}" title="${esc(p.id)}">${routeHtml(p.id)}</a>${extra ? `<span class="faint small">${extra}</span>` : ""}`;
    const origin = (p) => { const e = H.edges.find((x) => x.to === p.id && ["split", "clone", "branch"].includes(x.type) && x.date && x.date <= s.date); return e ? `${({ split: "Split off from", clone: "Built from a copy of", branch: "Added under" })[e.type]} ${esc(e.from)}` : ""; };
    const one = (p, kind, extra) => { const c = el(`<div class="rcard">${caption(p, extra)}</div>`); c.prepend(shotButton(p, i, kind)); return c; };
    if (i > 0) {
      group("new", "Added", d.added, (p) => one(p, "new", origin(p)));
      group("major", "Redesigned", d.redesigned, (p) => {
        const j = before(p, i), diff = status(p, i).diff;
        const c = el(`<div class="rcard wide"><div class="pair"></div>${caption(p, `before ${j != null ? esc(dayMonth(snaps[j].date)) : ""} · after${diff != null ? ` · ${Math.round(diff * 100)} % changed` : ""}`)}</div>`);
        c.querySelector(".pair").append(j != null ? shotButton(p, j, null) : el('<span class="shotbtn none"></span>'), shotButton(p, i, "major"));
        return c;
      });
      group("minor", "Tweaked", d.tweaked, (p) => { const diff = status(p, i).diff; return one(p, "minor", diff != null ? `${Math.round(diff * 100)} % changed` : ""); });
      group("gone", "Removed", d.removed, (p) => { const j = before(p, i); const c = el(`<div class="rcard">${caption(p, "last seen " + (j != null ? esc(dayMonth(snaps[j].date)) : ""))}</div>`); c.prepend(j != null ? shotButton(p, j, "gone") : el('<span class="shotbtn none"></span>')); return c; });
      group("", "Folded into another page", d.folded, (p) => { const c = el(`<div class="rcard">${caption(p, `now redirects to ${esc(p.presence[s.id].redirect)}`)}</div>`); const j = before(p, i); c.prepend(j != null ? shotButton(p, j, null) : el('<span class="shotbtn none"></span>')); return c; });
    }

    // Everything else, folded away by default: by section, narrowed by search and the page filter.
    const rest = (i === 0 ? d.here : same).filter(matches).filter((p) => img(mainView(p)?.shots[s.id]));
    const bySection = new Map();
    for (const p of rest) (bySection.get(p.section) ?? bySection.set(p.section, []).get(p.section)).push(p);
    const open = i === 0 || state.snapAll;
    const box = el(`<section class="rest"><div class="resthead"><h2><span class="cdot"></span>${i === 0 ? "All pages" : "Unchanged"}<span class="cnt">${plural(rest.length, "page")} in ${plural(bySection.size, "section")}</span></h2>${i === 0 ? "" : `<button class="btn">${open ? "Hide" : "Show all"}</button>`}</div></section>`);
    box.querySelector("button")?.addEventListener("click", () => { state.snapAll = !state.snapAll; render(); });
    if (open) for (const [section, pages] of [...bySection].sort((a, b) => a[0].localeCompare(b[0]))) {
      const g = el(`<div class="restgroup"><h3>${esc(section)} <span class="cnt">${pages.length}</span></h3><div class="rgrid small ${narrow() ? "narrow" : ""}"></div></div>`);
      for (const p of pages.sort((a, b) => a.id.localeCompare(b.id))) g.querySelector(".rgrid").append(one(p, null));
      box.append(g);
    }
    pad.append(box);
    content.replaceChildren(pad);
  }

  // ---------- Lightbox ----------
  // zoom: a share of the full width (0.1..1), or "page" to fit the whole screenshot. It is
  // kept across frames and across openings, so stepping through time compares like with like.
  const lb = { box: document.getElementById("lightbox"), series: null, index: 0, timer: null, zoom: 1 };
  const lbImg = document.getElementById("lbImg"), lbBody = lb.box.querySelector(".body");
  /** The width the screenshot gets at 100%: the space available, never more than its own pixels. */
  function lbFullWidth() {
    const cs = getComputedStyle(lbBody);
    return Math.min(lbImg.naturalWidth || Infinity, lbBody.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  }
  /** The zoom as a share of the full width; "page" resolves to whatever fits the whole image. */
  function lbScale() {
    if (lb.zoom !== "page") return lb.zoom;
    if (!lbImg.naturalWidth) return 1;
    const room = lbBody.clientHeight - parseFloat(getComputedStyle(lbBody).paddingBottom);
    return Math.min(1, (room * lbImg.naturalWidth / lbImg.naturalHeight) / lbFullWidth());
  }
  function applyZoom() {
    const scale = lbScale();
    document.getElementById("lbStack").style.width = lbImg.naturalWidth ? `${Math.round(lbFullWidth() * scale)}px` : "";
    document.getElementById("lbZoom").textContent = `${Math.round(scale * 100)}%`;
    document.getElementById("lbOut").disabled = scale <= 0.1;
    document.getElementById("lbIn").disabled = scale >= 1;
    document.getElementById("lbWidth").setAttribute("aria-pressed", String(lb.zoom === 1));
    document.getElementById("lbPage").setAttribute("aria-pressed", String(lb.zoom === "page"));
  }
  function setZoom(zoom) { lb.zoom = zoom === "page" ? zoom : Math.min(1, Math.max(0.1, zoom)); applyZoom(); }
  const zoomBy = (factor) => setZoom(Math.round(lbScale() * factor * 100) / 100);
  lbImg.addEventListener("load", applyZoom);
  function openLightbox(series, index, play = false) {
    lb.series = series; lb.index = index; lb.opener = document.activeElement;
    lb.box.classList.add("open");
    lbBody.focus({ preventScroll: true });
    paintLightbox(); if (play) setPlaying(true);
  }
  function setPlaying(on) {
    clearInterval(lb.timer); lb.timer = null;
    document.getElementById("lbPlay").setAttribute("aria-pressed", String(on));
    document.getElementById("lbPlay").textContent = on ? "❚❚ Pause" : "▶ Play";
    if (!on) return;
    lb.timer = setInterval(() => { const i = nextFrame(1); if (i == null) setPlaying(false); else { lb.index = i; paintLightbox(); } }, 1300);
  }
  /** Draw the changed blocks of a run-length mask onto a canvas laid over the image. */
  function drawMask(canvas, mask) {
    if (!mask) { canvas.style.display = "none"; return; }
    canvas.width = mask.cols; canvas.height = mask.rows;
    const g = canvas.getContext("2d");
    g.clearRect(0, 0, mask.cols, mask.rows);
    g.fillStyle = "rgba(255, 120, 0, 0.42)";
    let i = 0, on = false;
    for (const run of mask.runs) { if (on) for (let k = i; k < i + run; k++) g.fillRect(k % mask.cols, Math.floor(k / mask.cols), 1, 1); i += run; on = !on; }
    canvas.style.imageRendering = "pixelated";
    canvas.style.display = "";
  }
  const nextFrame = (dir) => { for (let i = lb.index + dir; i >= 0 && i < lb.series.frames.length; i += dir) { const f = lb.series.frames[i]; if (f && (state.showSame || !f.same)) return i; } return null; };
  function step(dir) { const i = nextFrame(dir); if (i != null) { lb.index = i; paintLightbox(); } }
  function paintLightbox() {
    const frame = lb.series.frames[lb.index];
    document.getElementById("lbWhere").textContent = lb.series.title;
    document.getElementById("lbWhen").textContent = `${frame.snap.date} · ${frame.snap.id}`;
    lbImg.src = frame.image.full;
    applyZoom();
    const tintCanvas = document.getElementById("lbTint");
    const prevIndex = nextFrame(-1);
    const mask = state.tint && prevIndex != null ? frame.mask : null;
    drawMask(tintCanvas, mask);
    document.getElementById("lbWhen").textContent += mask ? " · changes since the previous snapshot are tinted" : "";
    document.getElementById("lbSteps").innerHTML = lb.series.frames.map((f, i) => (f && (state.showSame || !f.same || i === lb.index) ? `<i class="${i === lb.index ? "on" : ""}"></i>` : "")).join("");
    document.getElementById("lbPrev").disabled = nextFrame(-1) == null;
    document.getElementById("lbNext").disabled = nextFrame(1) == null;
  }
  const closeLightbox = () => { setPlaying(false); lb.box.classList.remove("open"); lb.opener?.focus?.({ preventScroll: true }); };
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  document.getElementById("lbPlay").addEventListener("click", () => setPlaying(!lb.timer));
  document.getElementById("lbOut").addEventListener("click", () => zoomBy(1 / 1.25));
  document.getElementById("lbIn").addEventListener("click", () => zoomBy(1.25));
  document.getElementById("lbWidth").addEventListener("click", () => setZoom(1));
  document.getElementById("lbPage").addEventListener("click", () => setZoom("page"));
  // A pinch on a trackpad arrives as a wheel event with ctrlKey set.
  lbBody.addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(Math.exp(-e.deltaY / 100)); }, { passive: false });
  window.addEventListener("resize", () => { if (lb.box.classList.contains("open")) applyZoom(); });
  lb.box.addEventListener("click", (e) => { if (e.target === lb.box || e.target.classList.contains("body")) closeLightbox(); });
  // Captured before anything else: while the lightbox is open its keys belong to it, and
  // the page behind must neither scroll nor react.
  const lbKeys = {
    Escape: () => closeLightbox(),
    ArrowLeft: () => { setPlaying(false); step(-1); },
    ArrowRight: () => { setPlaying(false); step(1); },
    " ": () => setPlaying(!lb.timer),
    "-": () => zoomBy(1 / 1.25), _: () => zoomBy(1 / 1.25),
    "+": () => zoomBy(1.25), "=": () => zoomBy(1.25),
    0: () => setZoom(1),
    ArrowDown: () => lbBody.scrollBy({ top: 80 }), ArrowUp: () => lbBody.scrollBy({ top: -80 }),
    PageDown: () => lbBody.scrollBy({ top: lbBody.clientHeight * 0.9 }), PageUp: () => lbBody.scrollBy({ top: -lbBody.clientHeight * 0.9 }),
    Home: () => lbBody.scrollTo({ top: 0 }), End: () => lbBody.scrollTo({ top: lbBody.scrollHeight }),
  };
  document.addEventListener("keydown", (e) => {
    if (!lb.box.classList.contains("open") || e.metaKey || e.ctrlKey || e.altKey) return;
    const action = lbKeys[e.key];
    if (action) { e.preventDefault(); e.stopPropagation(); action(); }
  }, true);

  // ---------- Shell ----------
  function render() {
    let hash = location.hash || "#/";
    const sectionWanted = /\?section=([^&]+)/.exec(hash)?.[1];
    if (sectionWanted) { hash = hash.split("?")[0]; const d = document.querySelector(`#tree details[data-section="${CSS.escape(decodeURIComponent(sectionWanted))}"]`); if (d) d.open = true; }
    const keep = render.last === hash ? [content.scrollLeft, content.scrollTop] : null;
    render.last = hash;
    document.getElementById("tip").style.display = "none";
    document.body.classList.remove("side-open");
    state.focusSet = connected();
    renderFocusBar();
    document.body.classList.toggle("tinted", state.tint);
    let active = "graph", current = null;
    if (hash.startsWith("#/page/")) {
      const [id, view] = hash.slice(7).split("/").map(decodeURIComponent);
      current = id; active = null; renderPage(id, view);
    } else if (hash.startsWith("#/snapshot/")) { active = "snapshots"; renderSnapshot(hash.slice(11)); }
    else if (hash === "#/snapshots") { active = "snapshots"; renderSnapshots(); }
    else if (hash === "#/story") { active = "story"; renderStory(); }
    else if (hash === "#/runs") { active = "runs"; renderRuns(); }
    else if (hash === "#/timeline") { active = "timeline"; renderTimeline(); }
    else renderGraph();
    document.querySelectorAll("#nav a").forEach((a) => a.dataset.view === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    // The page list only where it helps pick a page; the other views get the full width.
    document.body.classList.toggle("no-side", !(current || active === "graph" || active === "timeline"));
    syncDisplay(current ? "page" : active === "snapshots" && hash.startsWith("#/snapshot/") ? "snapshot" : active);
    renderTree(current);
    if (keep) { content.scrollLeft = keep[0]; content.scrollTop = keep[1]; } else content.scrollTop = 0;
  }
  if (!(H.changelog ?? []).length) document.getElementById("navStory").style.display = "none";
  if (!(H.stats?.commits ?? []).length) document.getElementById("navRuns").style.display = "none";
  document.getElementById("project").textContent = H.project.name;
  document.title = `UI History · ${H.project.name}`;
  document.getElementById("search").addEventListener("input", (e) => { state.search = e.target.value; render(); e.target.focus(); });
  // ---------- Display options ----------
  // Which options each view uses; a view that uses none hides the button.
  const DISPLAY_ROWS = { graph: ["pages"], timeline: ["pages", "frames", "tint"], page: ["frames", "tint"], snapshot: ["pages", "tint"] };
  const displayPop = document.getElementById("displayPop"), displayBtn = document.getElementById("displayBtn");
  function syncDisplay(view = syncDisplay.view) {
    syncDisplay.view = view;
    const rows = DISPLAY_ROWS[view] ?? [];
    document.getElementById("display").hidden = !rows.length;
    if (!rows.length) setDisplayOpen(false);
    displayPop.querySelectorAll("[data-row]").forEach((r) => (r.hidden = !rows.includes(r.dataset.row)));
    displayPop.querySelectorAll("[data-set]").forEach((b) => b.setAttribute("aria-pressed", String(String(state[b.dataset.set]) === b.dataset.value)));
    document.getElementById("tint").checked = state.tint;
    const unchanged = H.pages.filter((p) => p.seen && !everChanged(p)).length;
    document.getElementById("pagesHint").textContent = unchanged ? `${plural(unchanged, "page")} never changed` : "Every page changed at some point";
    const on = [rows.includes("pages") && state.onlyChanged, rows.includes("frames") && state.showSame, rows.includes("tint") && state.tint].filter(Boolean).length;
    const badge = document.getElementById("displayBadge");
    badge.hidden = !on; badge.textContent = on;
  }
  function setDisplayOpen(open) {
    displayPop.hidden = !open;
    displayBtn.setAttribute("aria-expanded", String(open));
    if (open) displayPop.querySelector(".prow:not([hidden]) button, .prow:not([hidden]) input")?.focus();
  }
  displayBtn.addEventListener("click", (e) => { e.stopPropagation(); setDisplayOpen(displayPop.hidden); });
  displayPop.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => setDisplayOpen(false));
  displayPop.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); setDisplayOpen(false); displayBtn.focus(); }
    // Keep Tab inside the popover while it is open.
    if (e.key === "Tab") {
      const items = [...displayPop.querySelectorAll(".prow:not([hidden]) button, .prow:not([hidden]) input, .popfoot button")];
      const at = items.indexOf(document.activeElement);
      const next = e.shiftKey ? (at <= 0 ? items.length - 1 : at - 1) : (at === items.length - 1 ? 0 : at + 1);
      e.preventDefault(); items[next].focus();
    }
  });
  displayPop.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { state[b.dataset.set] = b.dataset.value === "true"; render(); b.focus(); }));
  document.getElementById("tint").addEventListener("change", (e) => { state.tint = e.target.checked; render(); if (lb.box.classList.contains("open")) paintLightbox(); });
  document.getElementById("displayReset").addEventListener("click", () => { state.onlyChanged = false; state.showSame = false; state.tint = false; render(); });
  document.getElementById("collapseAll").addEventListener("click", () => document.querySelectorAll("#tree details[open]").forEach((d) => (d.open = false)));
  document.getElementById("focusClear").addEventListener("click", () => { state.focus.clear(); render(); });
  document.getElementById("helpBtn").addEventListener("click", () => { state.help = !state.help; document.getElementById("help").classList.toggle("open", state.help); document.getElementById("helpBtn").setAttribute("aria-pressed", String(state.help)); });
  const seg = document.getElementById("viewports");
  viewportNames.forEach((name, i) => {
    const b = el(`<button data-viewport="${esc(name)}" aria-pressed="${i === 0}">${esc(name)}</button>`);
    b.addEventListener("click", () => {
      state.viewport = name;
      seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      document.documentElement.style.setProperty("--col-w", narrow() ? "72px" : "");
      render();
    });
    seg.append(b);
  });
  if (viewportNames.length < 2) seg.style.display = "none";
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  document.getElementById("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); document.body.classList.toggle("side-open"); });
  content.addEventListener("click", () => document.body.classList.remove("side-open"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/input|select|textarea/i.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); document.getElementById("search").focus(); }
    // On a snapshot, the arrow keys step to the one before or after.
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.metaKey && !e.ctrlKey && !e.altKey && location.hash.startsWith("#/snapshot/") && !/input|select|textarea/i.test(document.activeElement?.tagName ?? "")) {
      const at = snapIndex[location.hash.slice(11)], to = at == null ? null : snaps[at + (e.key === "ArrowLeft" ? -1 : 1)];
      if (to) { e.preventDefault(); location.hash = "#/snapshot/" + to.id; }
    }
  });
  window.addEventListener("hashchange", render);
  let resizeTimer; window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  render();
})();
</script>
</body>
</html>
