<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI History</title>
<style>
:root {
  --bg: #f3f3f0; --surface: #ffffff; --raised: #f6f6f3; --pick: #ffffff; --line: #e3e2dc; --line-strong: #cfcdc4;
  --text: #1c1d1a; --muted: #5f6059; --faint: #7f8079;
  --accent: #3b55e6; --accent-soft: #e9ecfc; --on-accent: #ffffff;
  --new: #178a47; --new-soft: #dff3e6; --major: #c2570a; --major-soft: #fdebd8; --minor: #8a7a1f; --minor-soft: #f6f0d2;
  --gone: #c0322b; --gone-soft: #fbe3e1; --lane: #aeb3cc; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 3px 10px rgba(0,0,0,.05);
  --side-w: 264px; --label-w: 250px; --col-w: 132px; --bar-h: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f11; --surface: #141518; --raised: #1c1d21; --pick: #2b2e36; --line: #24262b; --line-strong: #34373e;
    --text: #e8e8eb; --muted: #a2a4ac; --faint: #868991;
    --accent: #8f9fff; --accent-soft: #262c4e; --on-accent: #10122a;
    --new: #5fd08a; --new-soft: #17301f; --major: #f0a060; --major-soft: #3a2614; --minor: #d2c160; --minor-soft: #32301a;
    --gone: #f0776f; --gone-soft: #3a1b19; --lane: #5d6390; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f11; --surface: #141518; --raised: #1c1d21; --pick: #2b2e36; --line: #24262b; --line-strong: #34373e;
  --text: #e8e8eb; --muted: #a2a4ac; --faint: #868991;
  --accent: #8f9fff; --accent-soft: #262c4e; --on-accent: #10122a;
  --new: #5fd08a; --new-soft: #17301f; --major: #f0a060; --major-soft: #3a2614; --minor: #d2c160; --minor-soft: #32301a;
  --gone: #f0776f; --gone-soft: #3a1b19; --lane: #5d6390; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a, button, .thumb, .lrow, .tree .item, .nav a, .views a { transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out, opacity .15s ease-out; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.rp { color: var(--faint); font-weight: 400; }
a:hover .rp, [aria-current] .rp { color: inherit; opacity: .7; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .93em; }
.muted { color: var(--muted); }
.spacer { flex: 1; }

/* ---------- App bar ---------- */
.appbar { flex: 0 0 auto; min-height: 56px; display: flex; align-items: center; gap: 8px 20px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative; z-index: 20; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand small { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24ch; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 14px; }
.nav a:hover { background: var(--raised); color: var(--text); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.searchbox { position: relative; width: 240px; }
.searchbox svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
.searchbox .field { padding: 0 34px 0 32px; }
.searchbox .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.kbd { font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--faint); }
.field { width: 100%; height: 34px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); padding: 0 10px; }
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); }
.seg button { border: 0; border-radius: 7px; background: none; height: 28px; padding: 0 10px; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--pick); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
#viewports button { text-transform: capitalize; }

/* ---------- Display popover ---------- */
.display { position: relative; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; }
.badge[hidden] { display: none; }
.popover { position: absolute; right: 0; top: calc(100% + 6px); z-index: 35; width: 340px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.28); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.popover[hidden] { display: none; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.prow[hidden] { display: none; }
.prow .lbl { display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.35; }
.prow .lbl small { color: var(--faint); font-size: 12px; }
.prow + .prow.sep { border-top: 1px solid var(--line); padding-top: 14px; }
.sw { appearance: none; -webkit-appearance: none; width: 32px; height: 20px; border-radius: 10px; background: var(--line-strong); position: relative; margin: 0; flex: none; cursor: pointer; transition: background-color .15s ease-out; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s ease-out; }
.sw:checked { background: var(--accent); }
.sw:checked::after { transform: translateX(12px); }
.popfoot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--faint); }

/* ---------- Sidebar ---------- */
.shellrow { flex: 1; min-height: 0; display: flex; }
.side { width: var(--side-w); flex: 0 0 var(--side-w); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
body.no-side .side { display: none; }
.sidehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 6px; color: var(--faint); font-size: 12px; }
.tree { flex: 1; overflow: auto; padding: 0 8px 16px; }
.tree summary { cursor: pointer; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font-size: 13px; font-weight: 600; text-transform: capitalize; color: var(--text); margin-top: 6px; border-radius: 6px; list-style: none; user-select: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: ""; width: 6px; height: 6px; border: solid var(--faint); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin: 0 2px 0 1px; transition: transform .15s ease-out; }
.tree details[open] > summary::before { transform: rotate(45deg); margin-top: -3px; }
.tree summary:hover { background: var(--raised); }
.tree summary .n { margin-left: auto; font-weight: 400; color: var(--faint); font-size: 12px; }
.tree .item { display: flex; align-items: center; gap: 8px; height: 30px; border-radius: 6px; padding-left: 12px; }
.tree .item:hover { background: var(--raised); }
.tree .item a { flex: 1; min-width: 0; color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.tree .item a > span { direction: ltr; unicode-bidi: isolate; }
.tree .item a:hover { text-decoration: none; }
.tree .item[aria-current="page"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
.tree .item a.unseen { color: var(--faint); }
.tree .item .n { color: var(--faint); font-size: 12px; margin: 0 2px; font-variant-numeric: tabular-nums; }
.cdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line-strong); }
.cdot.new, .cdot.base { background: var(--new); }
.cdot.major { background: var(--major); }
.cdot.minor { background: var(--minor); }
.cdot.gone { background: var(--gone); }
.focus-btn { width: 26px; height: 26px; border: 0; background: none; border-radius: 5px; color: var(--faint); display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; opacity: 0; }
.focus-btn svg { width: 14px; height: 14px; }
.item:hover .focus-btn, .lrow:hover .focus-btn, .focus-btn[aria-pressed="true"], .focus-btn:focus-visible { opacity: 1; }
.focus-btn:hover { color: var(--accent); background: var(--accent-soft); }
.focus-btn[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top { flex: 0 0 auto; min-height: 64px; display: flex; align-items: center; gap: 8px 12px; padding: 10px 24px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; position: relative; z-index: 15; }
.top h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.top .sub { color: var(--faint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; margin-top: 2px; }
.top .sub a { color: var(--muted); }
.top .titles { min-width: 0; }
.top .actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.btn { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: 8px; color: var(--text); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); text-decoration: none; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn svg { width: 15px; height: 15px; }
.menu-btn { display: none; }
.help { display: none; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); color: var(--text); font-size: 13px; line-height: 1.5; }
.help.open { display: block; }
.help p { margin: 0 0 6px; max-width: 90ch; }
.help p:last-child { margin: 0; }
.focusbar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 12.5px; }
.focusbar[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 6px 0 9px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--gone); }
.content { flex: 1; min-height: 0; overflow: auto; }
.pad { padding: 16px; }
.empty { padding: 48px 16px; color: var(--muted); text-align: center; }
.h2 { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.pill { display: inline-flex; align-items: center; height: 18px; font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; padding: 0 6px; border-radius: 999px; white-space: nowrap; line-height: 1; }
.pill.new { background: var(--new-soft); color: var(--new); }
.pill.major { background: var(--major-soft); color: var(--major); }
.pill.minor { background: var(--minor-soft); color: var(--minor); }
.pill.gone { background: var(--gone-soft); color: var(--gone); }
.pill.link { background: var(--accent-soft); color: var(--accent); }
.pill.same { color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-strong); }
.legend { display: flex; gap: 14px; row-gap: 4px; color: var(--muted); font-size: 12px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend.links { gap: 4px; }
.lgtitle { color: var(--faint); font-size: 11.5px; margin-right: 4px; }
.lkey { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid transparent; border-radius: 999px; background: none; color: var(--muted); font-size: 12px; }
.lkey:hover { border-color: var(--line-strong); }
.lkey[aria-pressed="false"] { color: var(--faint); text-decoration: line-through; }
.lkey[aria-pressed="false"] .key { opacity: .3; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.key.new { border: 2.5px solid var(--new); }
.key.major { background: var(--major); }
.key.minor { border: 2px solid var(--minor); }
.key.same { width: 6px; height: 6px; background: var(--lane); }
.key.line { width: 18px; height: 2px; border-radius: 0; background: var(--lane); }
.key.split { width: 18px; height: 2px; border-radius: 0; background: var(--new); }
.key.merge { width: 18px; height: 2px; border-radius: 0; background: var(--gone); }
.key.move { width: 18px; height: 2px; border-radius: 0; background: var(--accent); }
.key.clone { width: 18px; height: 0; border-radius: 0; border-top: 2px dashed var(--accent); }

/* ---------- Graph ---------- */
.intro { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--accent); font-size: 13px; line-height: 1.5; color: var(--muted); }
.intro b { color: var(--text); }
.intro > div:first-child { max-width: 100ch; }
.introactions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.graphbar { display: flex; align-items: center; gap: 8px 24px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.zoom { display: flex; align-items: center; gap: 8px; }
.zoom .seg button { min-width: 32px; justify-content: center; }
.zoomlvl { color: var(--muted); font-size: 12px; min-width: 70px; }
.graph { height: 100%; overflow: auto; cursor: grab; }
.graph.panning { cursor: grabbing; user-select: none; }
.graph .gwrap { display: grid; grid-template-columns: var(--label-w) max-content; width: max-content; min-width: 100%; }
.graph .corner { position: sticky; left: 0; top: 0; z-index: 9; height: 44px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line-strong); display: flex; align-items: flex-end; padding: 0 12px 6px; font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }
.graph .axis { position: sticky; top: 0; z-index: 7; height: 44px; background: var(--surface); border-bottom: 1px solid var(--line-strong); line-height: 0; }
.graph .labels { position: sticky; left: 0; z-index: 8; background: var(--surface); border-right: 1px solid var(--line); }
.graph .body { line-height: 0; }
.lrow { height: 24px; display: flex; align-items: center; padding-left: 12px; padding-right: 4px; }
.lrow:hover, .lrow.hot { background: var(--accent-soft); }
.lrow a { flex: 1; min-width: 0; color: var(--text); font-weight: 500; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.lrow a > span { direction: ltr; unicode-bidi: isolate; }
.lrow a:hover { text-decoration: none; color: var(--accent); }
.lrow a.unseen { color: var(--faint); }
.gsection { height: 22px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 650; text-transform: capitalize; color: var(--text); background: var(--raised); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.graph svg { display: block; }
.graph text { font: 11px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
.graph text.month { font-weight: 650; fill: var(--text); }
.graph text.fine { fill: var(--faint); font-size: 10px; }
.graph text.count { font-size: 8.5px; font-weight: 700; fill: var(--text); pointer-events: none; }
.graph text.count.onfill { fill: var(--surface); }
.graph .axisbg { fill: var(--surface); }
.graph .guide { stroke: var(--line-strong); stroke-dasharray: 2 4; }
.graph .monthline { stroke: var(--line-strong); }
.graph .week { stroke: var(--line); }
.graph .day { stroke: var(--line); opacity: .5; }
.graph .band { fill: var(--raised); }
.graph .bandline { stroke: var(--line); }
.graph .lane { stroke: var(--lane); stroke-width: 2; }
.graph .lane.unseen { stroke-dasharray: 2 4; opacity: .7; }
.graph .lane, .graph .birth, .graph .death { pointer-events: none; }
.graph .rowhit { fill: transparent; cursor: pointer; }
.graph .rowhit:hover, .graph .rowhit.hot { fill: var(--accent-soft); }
.graph .node { cursor: pointer; }
.graph .node.same { fill: var(--lane); }
.graph .node.new, .graph .node.base { fill: var(--surface); stroke: var(--new); stroke-width: 2.5; }
.graph .node.major { fill: var(--major); stroke: var(--surface); stroke-width: 1.5; }
.graph .node.minor { fill: var(--surface); stroke: var(--minor); stroke-width: 2; }
.graph .node.missing { fill: var(--faint); }
.graph .birth { stroke: var(--new); stroke-width: 2; }
.graph .death { stroke: var(--gone); stroke-width: 2; }
.edge { fill: none; stroke-width: 1.5; }
.edge.branch { stroke: var(--lane); }
.edge.split { stroke: var(--new); stroke-width: 2; }
.edge.merged, .edge.replaced { stroke: var(--gone); stroke-width: 2; }
.edge.redirect, .edge.rename { stroke: var(--accent); stroke-width: 2; }
.edge.clone { stroke: var(--accent); stroke-dasharray: 4 3; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 7px; font-size: 12px; max-width: 340px; box-shadow: var(--shadow); display: none; line-height: 1.45; }
.tip b { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

/* ---------- Thumbnail timeline ---------- */
.grid { display: grid; position: relative; width: max-content; min-width: 100%; background: var(--surface); }
.head { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line); padding: 8px 10px; color: inherit; line-height: 1.25; }
a.head:hover { background: var(--accent-soft); text-decoration: none; }
.head .date { font-weight: 650; font-size: 13px; white-space: nowrap; }
.head .date small { color: var(--faint); font-weight: 500; font-size: 11px; margin-left: 4px; }
.head .meta { color: var(--faint); font-size: 11.5px; margin-top: 1px; white-space: nowrap; }
.corner { position: sticky; left: 0; top: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line-strong); padding: 8px 12px; color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: flex-end; }
.section { grid-column: 1 / -1; position: sticky; left: 0; background: var(--raised); border-bottom: 1px solid var(--line); height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 12.5px; font-weight: 650; text-transform: capitalize; color: var(--text); }
.label { position: sticky; left: 0; z-index: 4; min-height: 84px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 8px 0 12px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.label .route { flex: 1; min-width: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.label .route > span { direction: ltr; unicode-bidi: isolate; }
.label .route:hover { text-decoration: none; color: var(--accent); }
.label .focus-btn { margin-left: auto; }
.label:hover .focus-btn { opacity: 1; }
.grid .links { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.grid .links .edge { pointer-events: stroke; }
.screensbar { display: flex; align-items: center; gap: 8px 24px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; position: sticky; left: 0; }
.label .kind { color: var(--faint); font-size: 11px; white-space: nowrap; }
.expander { height: 22px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: 6px; padding: 0 7px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.expander:hover { border-color: var(--accent); color: var(--accent); }
.subrow .label { background: var(--raised); padding-left: 24px; }
.subrow .label .route { font-family: inherit; font-weight: 500; direction: ltr; }
.subrow .cell { background: var(--raised); }
.cell { position: relative; min-height: 84px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); display: flex; align-items: center; justify-content: center; background: var(--surface); }
.cell.outside { background: var(--bg); }
.cell.alive::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--lane); }
.cell.first::before { left: 50%; }
.cell.last::before { right: 50%; }
.cell.first.last::before { display: none; }
.thumb { position: relative; z-index: 1; display: block; border-radius: 5px; overflow: hidden; border: 1px solid var(--line-strong); background: var(--raised); cursor: zoom-in; padding: 0; line-height: 0; box-shadow: var(--shadow); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.thumb:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.thumb.same { opacity: .5; box-shadow: none; }
.thumb.same:hover { opacity: 1; }
.thumb .pill { position: absolute; top: 4px; left: 4px; z-index: 2; height: 16px; font-size: 9.5px; padding: 0 5px; }
.cell .dot { position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--lane); padding: 0; }
/* The dot stays small; its hit area does not. */
.cell .samedot { width: 28px; height: 28px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; }
.cell .samedot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--lane); box-sizing: border-box; }
.cell .samedot:hover::after { border-color: var(--accent); }
.cell .pill.gone, .cell .pill.link { position: relative; z-index: 1; }

/* ---------- Page ---------- */
.pagehead { margin: 0 0 16px; display: flex; flex-direction: column; gap: 10px; max-width: 1100px; }
.pagehead .life { margin: 0; font-size: 13px; color: var(--text); }
.rels { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; margin: 0; align-items: start; }
.rels dt { padding-top: 3px; }
.rels dd { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.relchips { display: flex; flex-wrap: wrap; gap: 4px; }
.relchips .chip { padding: 0 9px; color: var(--text); }
.relchips .chip:hover { border-color: var(--accent); text-decoration: none; }
.reldate { font-size: 12px; }
.why { font-size: 12.5px; }
.why[open] { flex-basis: 100%; }
.why summary { cursor: pointer; color: var(--muted); width: max-content; list-style: none; text-decoration: underline dotted; font-size: 12px; }
.why summary::-webkit-details-marker { display: none; }
.why ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); line-height: 1.5; max-width: 90ch; }
.why li + li { margin-top: 6px; }
.pagewrap { display: flex; flex-direction: column; gap: 14px; }
.views { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.vgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.vkind { color: var(--faint); font-size: 11.5px; margin-right: 2px; }
.views a { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line); font-size: 12.5px; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.views a:hover { color: var(--text); border-color: var(--line-strong); text-decoration: none; }
.views a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.strip { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 12px; align-items: stretch; }
.frame { flex: 0 0 auto; width: 300px; display: flex; flex-direction: column; }
.frame.narrow { width: 180px; }
.frame header { display: flex; align-items: center; gap: 6px; height: 24px; margin-bottom: 6px; white-space: nowrap; }
.frame header b { font-size: 12.5px; }
.frame header .mono { color: var(--faint); font-size: 11px; }
.frame .shot { display: block; height: 380px; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); cursor: zoom-in; padding: 0; line-height: 0; box-shadow: var(--shadow); }
.frame .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.frame .gap { height: 380px; border: 1px dashed var(--line-strong); border-radius: 8px; padding: 12px; color: var(--muted); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; line-height: 1.5; }
.frame.skip { width: 116px; }
.frame.skip .gap { font-size: 12px; padding: 10px 8px; border-style: dashed; background: none; }
.frame.skip header { color: var(--muted); }
.frame .caption { color: var(--faint); font-size: 11.5px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frame .sources { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.frame .sources summary { cursor: pointer; list-style: none; text-decoration: underline dotted; }
.frame .sources summary::-webkit-details-marker { display: none; }
.frame .sources ul { margin: 4px 0 0; padding-left: 14px; max-height: 160px; overflow: auto; line-height: 1.5; white-space: normal; }
.frame .sources li { overflow-wrap: anywhere; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; }
.compare { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-width: 1100px; margin-top: 8px; }
.cmptitle { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.compare.full { position: fixed; inset: 0; z-index: 45; max-width: none; margin: 0; border-radius: 0; border: 0; display: flex; flex-direction: column; }
.compare.full .stage { flex: 1; max-height: none; }
.compare .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.compare .controls .field { width: auto; }
.compare .cmphint { flex: 1; text-align: center; color: var(--faint); font-size: 12px; }
.compare .stage { position: relative; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden auto; max-height: 78vh; line-height: 0; background: var(--raised); cursor: col-resize; user-select: none; }
.compare .stage img { width: 100%; display: block; pointer-events: none; }
.compare .stage .after { position: absolute; inset: 0 0 auto 0; }
.compare .handle { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; }
.compare .handle .grip { position: sticky; top: 50%; left: 50%; display: block; width: 34px; height: 34px; margin: 0 0 0 -16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 17px; line-height: 34px; text-align: center; box-shadow: var(--shadow); }

/* ---------- Snapshots ---------- */
.story { display: flex; flex-direction: column; gap: 12px; max-width: 86ch; }
.chapter { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.chapter .when { color: var(--faint); font-size: 12px; letter-spacing: .04em; }
.chapter h2 { font-size: 16px; margin: 2px 0 6px; letter-spacing: -.01em; }
.chapter p { margin: 0 0 10px; line-height: 1.55; }
.chapter .refs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.faint { color: var(--faint); }
.h2big { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.small { font-size: 12px; }
.shotbtn { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--raised); cursor: zoom-in; box-shadow: 0 0 0 1px var(--line-strong); line-height: 0; }
.shotbtn.tall { aspect-ratio: 9 / 16; }
.shotbtn img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.shotbtn:hover { box-shadow: 0 0 0 2px var(--accent); }
.shotbtn.new { box-shadow: 0 -2px 0 var(--new), 0 0 0 1px var(--line-strong); }
.shotbtn.major { box-shadow: 0 -2px 0 var(--major), 0 0 0 1px var(--line-strong); }
.shotbtn.minor { box-shadow: 0 -2px 0 var(--minor), 0 0 0 1px var(--line-strong); }
.shotbtn.gone { box-shadow: 0 -2px 0 var(--gone), 0 0 0 1px var(--line-strong); opacity: .7; }
.shotbtn.none { cursor: default; border: 1px dashed var(--line-strong); box-shadow: none; background: none; }
/* Snapshot list: a commit log, newest first. */
.log { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; }
.logyear { font-size: 13px; font-weight: 500; color: var(--faint); margin: 20px 0 4px 12px; }
.logrow, .quiet summary { display: grid; grid-template-columns: 96px 24px minmax(0, 1fr) minmax(0, 380px); gap: 16px; align-items: start; padding: 14px 12px; border-radius: 12px; color: var(--text); }
.logrow:hover { background: var(--surface); text-decoration: none; }
.logrow .when { display: flex; flex-direction: column; line-height: 1.3; }
.logrow .when b { font-size: 17px; font-weight: 600; }
.logrow .when .mono { color: var(--faint); font-size: 11.5px; }
.rail { position: relative; align-self: stretch; display: flex; justify-content: center; }
.rail::before { content: ""; position: absolute; top: -14px; bottom: -14px; width: 2px; background: var(--line); }
.rail .knot { position: relative; margin-top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.logrow .what { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.logrow .subj { font-size: 15px; font-weight: 500; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.fact { display: inline-flex; align-items: center; gap: 6px; }
.logrow .thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.quiet summary { padding-top: 4px; padding-bottom: 4px; cursor: pointer; list-style: none; font-size: 13px; color: var(--faint); align-items: center; }
.quiet summary::-webkit-details-marker { display: none; }
.quiet summary:hover { color: var(--text); }
.quiet .rail i { position: relative; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); margin-top: 0; align-self: center; }
.quietlist { display: flex; flex-direction: column; gap: 2px; padding: 0 12px 8px 152px; font-size: 13px; }
.quietlist a { color: var(--muted); }
/* One snapshot: what changed, then everything else. */
.report { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; padding: 20px 24px 48px; }
.timestrip { display: flex; align-items: flex-end; gap: 2px; height: 36px; }
.timestrip a { flex: 1; max-width: 22px; height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px; padding: 0 2px; }
.timestrip a:hover, .timestrip a.on { background: var(--raised); }
.timestrip a.on { box-shadow: inset 0 -2px 0 var(--accent); }
.timestrip i { display: block; width: 100%; border-radius: 2px 2px 0 0; background: var(--line-strong); }
.timestrip i.new, .timestrip i.base { background: var(--new); }
.timestrip i.major { background: var(--major); }
.timestrip i.minor { background: var(--minor); opacity: .75; }
.timestrip i.gone { background: var(--gone); }
.lede { margin: -16px 0 0; font-size: 16px; color: var(--muted); max-width: 80ch; }
.lede b { color: var(--text); font-weight: 500; }
.rgroup h2, .resthead h2 { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; margin: 0 0 14px; }
.rgroup .cnt, .resthead .cnt, .restgroup .cnt { color: var(--faint); font-size: 13px; font-weight: 400; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
.rgrid.small { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
.rgrid.narrow { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.rcard { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rcard.wide { grid-column: span 2; }
.rcard .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rcard .route { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.rcard .route > span { direction: ltr; unicode-bidi: isolate; }
.rcard .small { margin-top: -6px; }
.rest { display: flex; flex-direction: column; gap: 20px; }
.resthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 12px; background: var(--surface); }
.resthead h2 { margin: 0; font-size: 15px; }
.restgroup h3 { font-size: 14px; font-weight: 600; margin: 0 0 12px; text-transform: capitalize; }
@media (max-width: 900px) {
  .logrow { grid-template-columns: 72px 16px minmax(0, 1fr); }
  .logrow .thumbs { grid-column: 3; }
  .quiet summary { grid-template-columns: 72px 16px minmax(0, 1fr); }
  .quietlist { padding-left: 12px; }
  .rcard.wide { grid-column: auto; }
}
.summary { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
.summary ul { margin: 6px 0 0; padding-left: 16px; line-height: 1.7; }

/* ---------- Runs ---------- */
.runs { display: flex; flex-direction: column; gap: 20px; }
.runs .tiles { max-width: 1240px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .v { font-size: 20px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .d { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.findings { margin: 0; padding-left: 18px; line-height: 1.6; max-width: 90ch; }
.findings li + li { margin-top: 4px; }
.scrollx { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.rtable { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.rtable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.rtable td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.rtable tr:last-child td { border-bottom: 0; }
.rtable td.num, .rtable th.num { text-align: right; }
.rtable .subj { color: var(--muted); max-width: 26ch; overflow: hidden; text-overflow: ellipsis; display: block; }
.tries { display: flex; gap: 2px; align-items: center; min-width: 180px; }
.try { height: 12px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 3px; }
.try.fail { background: var(--gone-soft); box-shadow: inset 0 0 0 1px var(--gone); }
.tries .s { margin-left: 6px; color: var(--muted); font-size: 11.5px; }
.tries .x { color: var(--gone); font-weight: 650; }
.phases { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 12px; align-items: center; max-width: 640px; font-size: 12.5px; }
.phases .bar { height: 10px; background: var(--raised); border-radius: 0 4px 4px 0; overflow: hidden; }
.phases .bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.phases .n { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Lightbox ---------- */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8, 9, 12, .94); display: none; flex-direction: column; color: #eee; }
.lightbox.open { display: flex; }
.lightbox .body:focus { outline: none; }
.lightbox .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.lightbox .where { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
.lightbox .when { color: #b9bac4; }
.lightbox button { height: 28px; border: 1px solid #555; background: #1d1e24; color: #eee; border-radius: 7px; padding: 0 11px; }
.lightbox button:disabled { opacity: .35; cursor: default; }
.lightbox .body { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 0 16px 24px; }
.lightbox .body img { width: 100%; border-radius: 6px; background: #fff; display: block; }
.lightbox .stack { position: relative; display: inline-block; flex: none; max-width: 100%; line-height: 0; }
.lightbox .lbzoom { display: flex; align-items: center; gap: 4px; }
.lightbox .lbzoom button { min-width: 28px; padding: 0 8px; }
.lightbox .lbzoom output { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; color: #b9bac4; font-size: 12px; }
.lightbox .stack canvas, .compare .stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
.tinted .lightbox .stack canvas, .tinted .compare .stage canvas { display: block; }
.lightbox button[aria-pressed="true"] { background: #fff; color: #111; }
.lightbox .steps { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 40vw; }
.lightbox .steps i { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.lightbox .steps i.on { background: #fff; }
.hint { color: #8f909a; font-size: 12px; }

@media (max-width: 900px) {
  .side { position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--shadow); max-width: 86vw; }
  body.side-open .side { transform: none; }
  .menu-btn { display: inline-flex; }
  body.no-side .menu-btn { display: none; }
  .appbar { gap: 8px 12px; }
  .brand small { display: none; }
  .searchbox { order: 9; width: 100%; }
  .top { padding: 10px 16px; }
  :root { --label-w: 150px; --col-w: 110px; }
  .hint { display: none; }
  .top .sub { display: none; }
  .pagehead .life .muted { display: none; }
  .rels { grid-template-columns: minmax(0, 1fr); }
  .frame { width: 240px; }
  .frame .shot, .frame .gap { height: 300px; }
}
</style>
</head>
<body>
<header class="appbar">
  <button class="btn icon menu-btn" id="menuBtn" aria-label="Pages" title="Pages"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
  <div class="brand"><b>UI History</b><small id="project"></small></div>
  <nav class="nav" id="nav" aria-label="Views">
    <a href="#/" data-view="graph" title="How pages were added, split off and merged, over time">Graph</a>
    <a href="#/timeline" data-view="timeline" title="Every page as thumbnails, snapshot by snapshot">Screens</a>
    <a href="#/snapshots" data-view="snapshots" title="The whole site at one point in time">Snapshots</a>
    <a href="#/story" data-view="story" id="navStory" title="The history as a written changelog">Story</a>
    <a href="#/runs" data-view="runs" id="navRuns" title="How the snapshots were made: time, attempts, fixes, failures">Runs</a>
  </nav>
  <span class="spacer"></span>
  <label class="searchbox"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input class="field" id="search" type="search" placeholder="Find a page" aria-label="Find a page"><span class="kbd">/</span></label>
  <div class="seg" role="group" aria-label="Device" id="viewports"></div>
  <button class="btn icon" id="helpBtn" title="What am I looking at?" aria-pressed="false">?</button>
  <button class="btn icon" id="theme" title="Switch light and dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/><circle cx="8" cy="8" r="2.6"/></svg></button>
</header>
<div class="shellrow">
<aside class="side" id="side" aria-label="Pages">
  <div class="sidehead"><span id="sidecount"></span><button class="linkbtn" id="collapseAll" style="color:var(--faint);font-size:12px">Collapse all</button></div>
  <div class="tree" id="tree"></div>
</aside>
<div class="main">
  <div class="top">
    <div class="titles"><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <div class="spacer"></div>
    <div class="actions" id="actions"></div>
    <div class="display" id="display">
      <button class="btn" id="displayBtn" aria-expanded="false" aria-controls="displayPop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h8M12 4h2M2 12h3M7 12h7"/><circle cx="11" cy="4" r="1.5"/><circle cx="6" cy="12" r="1.5"/></svg>Display <span class="badge" id="displayBadge" hidden></span></button>
      <div class="popover" id="displayPop" role="dialog" aria-label="Display options" hidden>
        <div class="prow" data-row="pages"><span class="lbl">Pages<small id="pagesHint"></small></span><div class="seg" role="group" aria-label="Pages"><button data-set="onlyChanged" data-value="false">All</button><button data-set="onlyChanged" data-value="true">Changed</button></div></div>
        <div class="prow" data-row="frames"><span class="lbl">Snapshots per page<small>Where it changed, or every one</small></span><div class="seg" role="group" aria-label="Snapshots per page"><button data-set="showSame" data-value="false">Changes</button><button data-set="showSame" data-value="true">All</button></div></div>
        <label class="prow sep" data-row="tint"><span class="lbl">Highlight changes<small>Tint what differs from the snapshot before</small></span><input class="sw" type="checkbox" id="tint"></label>
        <div class="popfoot"><button class="linkbtn" id="displayReset">Reset</button><span>Esc to close</span></div>
      </div>
    </div>
  </div>
  <div class="help" id="help"></div>
  <div class="focusbar" id="focusbar" hidden>
    <span class="muted" id="focuslabel"></span><span id="focuschips"></span>
    <button class="btn" id="focusClear">Show everything</button>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<div class="tip" id="tip"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot">
  <div class="bar">
    <span class="where" id="lbWhere"></span><span class="when" id="lbWhen"></span><span class="steps" id="lbSteps"></span>
    <span class="spacer"></span><span class="hint">← → through time · − + zoom · 0 full width · Esc to close</span>
    <span class="lbzoom"><button id="lbOut" title="Zoom out (−)">−</button><output id="lbZoom"></output><button id="lbIn" title="Zoom in (+)">+</button><button id="lbWidth" title="Fill the width (0)">Width</button><button id="lbPage" title="Show the whole screenshot">Whole</button></span>
    <button id="lbPlay" title="Step through time automatically">▶ Play</button><button id="lbPrev">← Older</button><button id="lbNext">Newer →</button><button id="lbClose">Close</button>
  </div>
  <div class="body" tabindex="-1"><div class="stack" id="lbStack"><img id="lbImg" alt=""><canvas id="lbTint"></canvas></div></div>
</div>

<script src="data/history.js"></script>
<script>
(() => {
  const H = window.UI_HISTORY;
  const content = document.getElementById("content");
  if (!H) { content.innerHTML = '<div class="empty">No data yet. Run <code>ui-progress build</code>.</div>'; return; }

  const MAJOR = H.thresholds?.redesign ?? 0.3, MINOR = H.thresholds?.tweak ?? 0.02;
  const snaps = H.snapshots;
  const snapIndex = Object.fromEntries(snaps.map((s, i) => [s.id, i]));
  const pageById = Object.fromEntries(H.pages.map((p) => [p.id, p]));
  const viewportNames = H.viewports ?? ["desktop", "mobile"];
  const state = { viewport: viewportNames[0], search: "", onlyChanged: false, showSame: false, tint: false, expanded: new Set(), zoom: 1, graphLeft: 0, focus: new Set(), help: false,
    // Which kinds of relation the graph draws and focus follows; toggled from the legend.
    links: { split: true, merge: true, move: true, clone: true, branch: true } };
  const LINK_GROUP = { split: "split", merged: "merge", replaced: "merge", rename: "move", redirect: "move", clone: "clone", branch: "branch" };
  const linkOn = (e) => state.links[LINK_GROUP[e.type] ?? "move"] !== false;
  const MAX_ZOOM = 80;
  const KIND_LABEL = { page: "Whole page", "signed-out": "Signed out", section: "Sections", dialog: "Dialogs", menu: "Menus" };
  const EDGE_TEXT = {
    branch: ["Later added under it", "Added under"], split: ["Split off", "Split off from"], extract: ["Part moved out to", "Moved out of"], merged: ["Folded into", "Absorbed"],
    replaced: ["Replaced by", "Replaced"], clone: ["Copied to make", "Built from a copy of"], rename: ["Renamed to", "Renamed from"], redirect: ["Redirects to", "Target of"],
  };
  const STATUS_TEXT = { new: "first seen", base: "first snapshot", major: "redesigned", minor: "small change", same: "unchanged", missing: "exists, not captured", absent: "does not exist" };
  const FOCUS_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>';

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const svgEl = (tag, attrs = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const pageHref = (id, view) => "#/page/" + encodeURIComponent(id) + (view && view !== "page" ? "/" + encodeURIComponent(view) : "");
  const img = (shot) => shot?.images?.[state.viewport] ?? Object.values(shot?.images ?? {})[0] ?? null;
  const narrow = () => state.viewport !== viewportNames[0] && /mobile|phone|narrow/i.test(state.viewport);
  const mainView = (page) => page.views.find((v) => v.id === "page");
  const extraViews = (page) => page.views.filter((v) => v.id !== "page");
  const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;
  /** A route with its parent path dimmed, so the page's own name is what the eye finds. */
  const routeHtml = (id) => {
    const cut = id.length > 1 ? id.lastIndexOf("/", id.length - 2) + 1 : 0;
    return `<span>${cut > 0 ? `<span class="rp">${esc(id.slice(0, cut))}</span>` : ""}${esc(id.slice(cut))}</span>`;
  };

  /** What a view looked like at a snapshot, relative to the last time it was captured. */
  function viewStatus(view, i) {
    const shot = view?.shots[snaps[i].id];
    if (!shot) return { kind: "absent" };
    const earlier = snaps.slice(0, i).some((s) => view.shots[s.id]);
    if (!earlier) return { kind: i === 0 ? "base" : "new", shot };
    const diff = shot.change?.[state.viewport] ?? Object.values(shot.change ?? {})[0];
    if (diff == null) return { kind: "same", shot };
    return { kind: diff >= MAJOR ? "major" : diff >= MINOR ? "minor" : "same", shot, diff };
  }
  /** The page as a whole at a snapshot. */
  function status(page, i) {
    const here = page.presence[snaps[i].id];
    if (!here) return { kind: "absent" };
    if (here.redirect) return { kind: "redirect", to: here.redirect };
    if (here.missing) return { kind: "missing", why: here.missing };
    return viewStatus(mainView(page), i);
  }
  const exists = (page, i) => Boolean(page.presence[snaps[i].id]);
  const lifespan = (page) => { const on = snaps.map((_, i) => i).filter((i) => exists(page, i)); return { first: on[0], last: on[on.length - 1] }; };
  const changesOf = (view) => snaps.reduce((n, _, i) => n + (["new", "major", "minor"].includes(viewStatus(view, i).kind) ? 1 : 0), 0);
  /** The latest thing that happened to a page: its last visible change, or its removal. */
  const lastChange = (page) => {
    const { last } = lifespan(page);
    if (last == null) return null;
    if (last < snaps.length - 1) return { kind: "gone", date: snaps[last + 1].date };
    for (let i = snaps.length - 1; i >= 0; i--) { const k = status(page, i).kind; if (["new", "base", "major", "minor"].includes(k)) return { kind: k, date: snaps[i].date }; }
    return null;
  };
  const everChanged = (page) => !page.seen || snaps.some((_, i) => ["new", "major", "minor", "redirect"].includes(status(page, i).kind)) || lifespan(page).last < snaps.length - 1;

  /**
   * Every page reachable from the focused ones through the relations switched on, in either
   * direction. "Added under" is followed one step only (the parent and the direct children):
   * followed further it would pull in the whole site.
   */
  function connected() {
    if (!state.focus.size) return null;
    const seen = new Set(state.focus);
    const queue = [...state.focus];
    const step = (e, id) => (e.from === id ? e.to : e.to === id ? e.from : null);
    while (queue.length) {
      const id = queue.shift();
      for (const e of H.edges) {
        if (e.type === "branch" || !linkOn(e)) continue;
        const other = step(e, id);
        if (other && !seen.has(other)) { seen.add(other); queue.push(other); }
      }
    }
    if (state.links.branch) for (const e of H.edges) if (e.type === "branch") for (const id of state.focus) { const other = step(e, id); if (other) seen.add(other); }
    return seen;
  }
  const matches = (page) => {
    const q = state.search.trim().toLowerCase();
    return (!state.focusSet || state.focusSet.has(page.id)) && (!q || page.id.toLowerCase().includes(q)) && (!state.onlyChanged || everChanged(page));
  };
  function toggleFocus(id) { state.focus.has(id) ? state.focus.delete(id) : state.focus.add(id); render(); }
  function focusButton(id) {
    const on = state.focus.has(id);
    const b = el(`<button class="focus-btn" aria-pressed="${on}" title="${on ? "Stop focusing on this page" : "Show only what is connected to this page"}">${FOCUS_ICON}</button>`);
    b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); toggleFocus(id); });
    return b;
  }
  function renderFocusBar() {
    const bar = document.getElementById("focusbar");
    bar.hidden = !state.focus.size;
    const chips = document.getElementById("focuschips");
    chips.innerHTML = "";
    for (const id of state.focus) {
      const chip = el(`<span class="chip"><a href="${pageHref(id)}">${esc(id)}</a><button title="Remove">×</button></span>`);
      chip.querySelector("button").addEventListener("click", () => toggleFocus(id));
      chips.append(chip);
    }
    document.getElementById("focuslabel").textContent = `${plural(state.focusSet?.size ?? 0, "connected page")} ·`;
  }

  const pillFor = (st) =>
    st.kind === "new" ? '<span class="pill new">new</span>'
    : st.kind === "major" ? '<span class="pill major">redesign</span>'
    : st.kind === "minor" ? '<span class="pill minor">tweak</span>'
    : st.kind === "same" ? '<span class="pill same">same</span>' : "";

  function thumb(image, series, index, st) {
    const size = narrow() ? "width:40px;height:70px" : "width:112px;height:70px";
    const b = el(`<button class="thumb ${st?.kind === "same" ? "same" : ""}" style="${size}"><img loading="lazy" src="${esc(image.card)}" alt=""></button>`);
    if (st && st.kind !== "same" && st.kind !== "base") b.prepend(el(pillFor(st)));
    b.addEventListener("click", () => openLightbox(series, index));
    return b;
  }
  /** One view across all snapshots, for stepping through time in the lightbox. */
  const seriesFor = (title, view) => ({ title, frames: snaps.map((s, i) => { const shot = view?.shots[s.id]; const im = img(shot); return im ? { snap: s, image: im, same: viewStatus(view, i).kind === "same", mask: shot.masks?.[state.viewport] ?? null } : null; }) });

  function emptyState() {
    const box = el('<div class="empty">No page matches the current search or filters.<br><button class="btn" style="margin-top:10px">Clear search and filters</button></div>');
    box.querySelector("button").addEventListener("click", () => { state.search = ""; document.getElementById("search").value = ""; state.onlyChanged = false; state.focus.clear(); render(); });
    return box;
  }
  function header(title, subtitle, actions = [], help = "") {
    document.getElementById("title").textContent = title;
    document.getElementById("subtitle").innerHTML = subtitle ?? "";
    document.getElementById("actions").replaceChildren(...actions);
    const h = document.getElementById("help");
    h.innerHTML = help;
    h.classList.toggle("open", state.help && Boolean(help));
    document.getElementById("helpBtn").style.display = help ? "" : "none";
    document.getElementById("helpBtn").setAttribute("aria-pressed", String(state.help));
  }

  // ---------- Sidebar ----------
  function renderTree(current) {
    const tree = document.getElementById("tree");
    const q = state.search.trim().toLowerCase();
    const bySection = new Map();
    for (const p of H.pages) if ((!q || p.id.toLowerCase().includes(q)) && (!state.focusSet || state.focusSet.has(p.id))) (bySection.get(p.section) ?? bySection.set(p.section, []).get(p.section)).push(p);
    const open = new Set([...tree.querySelectorAll("details[open]")].map((d) => d.dataset.section));
    tree.innerHTML = "";
    const currentSection = current ? pageById[current]?.section : null;
    for (const [section, pages] of bySection) {
      const isOpen = Boolean(q) || Boolean(state.focusSet) || section === currentSection || open.has(section) || bySection.size <= 4 || (tree.dataset.first !== "1" && [...bySection.keys()].indexOf(section) < 2);
      const d = el(`<details ${isOpen ? "open" : ""} data-section="${esc(section)}"><summary>${esc(section)}<span class="n">${pages.length}</span></summary></details>`);
      for (const p of pages) {
        const last = lastChange(p);
        const n = p.seen ? changesOf(mainView(p)) : 0;
        const dotTitle = last ? `${STATUS_TEXT[last.kind] ?? last.kind} on ${last.date}` : "never captured";
        const row = el(`<div class="item" ${p.id === current ? 'aria-current="page"' : ""}><span class="cdot ${last?.kind ?? ""}" title="Last change: ${esc(dotTitle)}"></span><a href="${pageHref(p.id)}" class="${p.seen ? "" : "unseen"}" title="${esc(p.id)}${p.seen ? "" : " — existed between snapshots, or was never captured"}">${routeHtml(p.id)}</a><span class="n" title="${plural(n, "snapshot")} with a visible change">${n || ""}</span></div>`);
        row.append(focusButton(p.id));
        d.append(row);
      }
      tree.append(d);
    }
    if (!bySection.size) tree.append(el('<div class="empty">No page matches.</div>'));
    tree.dataset.first = "1";
    const shown = [...bySection.values()].reduce((n, x) => n + x.length, 0);
    document.getElementById("sidecount").textContent = `${plural(shown, "page")} in ${plural(bySection.size, "section")}`;
  }

  // ---------- Relations, shared by the graph and the screens ----------
  /** The relation keys double as switches: off hides those curves, and focus stops following them. */
  function relationToggles() {
    const box = el(`<div class="legend links" role="group" aria-label="Relations to show"><span class="lgtitle">Relations</span>
      ${[["split", "split", "split off"], ["merge", "merge", "merged or replaced"], ["move", "move", "renamed or redirected"], ["clone", "clone", "built from a copy"], ["branch", "line", "added under"]]
        .map(([k, cls, text]) => `<button class="lkey" data-link="${k}" aria-pressed="${state.links[k]}" title="${state.links[k] ? "Hide" : "Show"} these relations${state.focus.size ? " and stop following them in focus" : ""}"><i class="key ${cls}"></i> ${text}</button>`).join("")}</div>`);
    box.querySelectorAll("[data-link]").forEach((b) => b.addEventListener("click", () => { state.links[b.dataset.link] = !state.links[b.dataset.link]; render(); }));
    return box;
  }
  const isOutOf = (e) => e.type === "branch" || e.type === "split" || e.type === "clone";
  /** One relation as a curve from row a to row b at x; with a hover text saying what happened. */
  function edgePath(e, ex, ay, by) {
    const path = svgEl("path", { class: `edge ${e.type}` });
    if (isOutOf(e)) path.setAttribute("d", `M${ex - 14} ${ay} C ${ex - 2} ${ay}, ${ex - 12} ${by}, ${ex} ${by}`);
    else { path.setAttribute("d", `M${ex} ${ay} C ${ex + 14} ${ay}, ${ex + 2} ${by}, ${ex + 16} ${by}`); path.setAttribute("marker-end", "url(#arrow)"); }
    const verb = { branch: "was added under", split: "was split off from", extract: "was moved out of", clone: "was built from a copy of", merged: "was folded into", replaced: "was replaced by", redirect: "now redirects to", rename: "was renamed to" }[e.kind === "extract" ? "extract" : e.type];
    const head = isOutOf(e) ? `<b>${esc(e.to)}</b> ${verb} <b>${esc(e.from)}</b>` : `<b>${esc(e.from)}</b> ${verb} <b>${esc(e.to)}</b>`;
    path.style.pointerEvents = "stroke";
    path.addEventListener("mousemove", (ev) => showTip(ev, `${head}<br>${esc(e.date)}${e.sha ? " · " + esc(e.sha) : ""}${e.note ? "<br>" + esc(e.note) : ""}`));
    path.addEventListener("mouseleave", hideTip);
    return path;
  }
  const arrowDefs = () => {
    const defs = svgEl("defs");
    const marker = svgEl("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto" });
    marker.append(svgEl("path", { d: "M0 0 L10 5 L0 10 z", fill: "context-stroke" }));
    defs.append(marker);
    return defs;
  };
  const tip = document.getElementById("tip");
  const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tip.style.top = e.clientY + 16 + "px"; };
  const hideTip = () => (tip.style.display = "none");

  // ---------- Graph ----------
  function renderGraph() {
    const zoomBar = el(`<div class="zoom"><span class="seg"><button data-zoom="out" title="Zoom out">−</button><button data-zoom="fit" title="Show the whole history">Fit</button><button data-zoom="in" title="Zoom in">+</button></span><span class="zoomlvl">${state.zoom === 1 ? "whole history" : "×" + (state.zoom < 10 ? state.zoom.toFixed(1) : Math.round(state.zoom))}</span></div>`);
    header("Graph", `${H.pages.length} pages · ${plural(snaps.length, "snapshot")} of ${H.project.commits} commits · ${esc(H.project.from)} to ${esc(H.project.to)}`, [zoomBar],
      `<p>Each line is one page, from the day it was added to the day it was removed. A line that curves <b>out of</b> another came from that page (split off, or built from a copy); a line that curves <b>into</b> another was folded into it. Dots are the snapshots where screenshots exist; a numbered dot stands for several snapshots too close together to show apart at this zoom.</p>
       <p>Hover a dot or a curve for details, click a line to open the page, and use the target icon next to a page to show only what is connected to it. Zoom the time axis with Ctrl or ⌘ + scroll (or pinch); drag to pan.</p>`);
    const pages = H.pages.filter(matches);
    const wrap = el('<div style="display:flex;flex-direction:column;height:100%"></div>');
    let seenIntro = false;
    try { seenIntro = localStorage.getItem("ui-history-intro") === "1"; } catch { /* storage unavailable */ }
    if (!seenIntro && !state.focusSet) {
      const latest = snaps[snaps.length - 1];
      const intro = el(`<div class="intro"><div><b>This is the UI history of ${esc(H.project.name)}</b>: ${H.pages.length} pages across ${plural(snaps.length, "snapshot")}, ${esc(H.project.from)} to ${esc(H.project.to)}.
        Each line below is one page through time; dots are the snapshots it was photographed in, curves show where pages came from or went. Three ways in:</div>
        <div class="introactions"><a class="btn" href="#/timeline">Browse the screenshots</a><a class="btn" href="#/snapshot/${latest.id}">See the whole site today</a><button class="btn" data-pick>Pick a page on the left</button><span class="spacer"></span><button class="btn" data-dismiss>Got it</button></div></div>`);
      intro.querySelector("[data-pick]").addEventListener("click", () => { document.getElementById("search").focus(); document.body.classList.add("side-open"); });
      intro.querySelector("[data-dismiss]").addEventListener("click", () => { try { localStorage.setItem("ui-history-intro", "1"); } catch { /* ignore */ } intro.remove(); });
      wrap.append(intro);
    }
    const bar = el(`<div class="graphbar"><div class="legend">
      <span><i class="key new"></i> first seen</span><span><i class="key major"></i> redesigned</span><span><i class="key minor"></i> small change</span><span><i class="key same"></i> unchanged</span></div></div>`);
    bar.append(relationToggles());
    wrap.append(bar);
    if (!pages.length) { wrap.append(emptyState()); content.replaceChildren(wrap); return; }

    const ROW = 24, SEC = 22, AXIS = 44, LEFT = 18, RIGHT = 28;
    const t0 = Date.parse(H.project.from), t1 = Math.max(Date.parse(H.project.to), t0 + 86400000);
    const labelW = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--label-w"));
    const fitWidth = Math.max(720, content.clientWidth - labelW - 2);
    const width = Math.round(fitWidth * state.zoom);
    const pxPerDay = (width - LEFT - RIGHT) / ((t1 - t0) / 86400000);
    const x = (date) => LEFT + ((Math.min(Math.max(Date.parse(date), t0), t1) - t0) / (t1 - t0)) * (width - LEFT - RIGHT);

    // One scroll container: the label column sticks to the left, the date axis to the top,
    // so the labels and the lines can never drift apart.
    const graph = el('<div class="graph"><div class="gwrap"><div class="corner">Page</div><div class="axis"></div><div class="labels"></div><div class="body"></div></div></div>');
    const labels = graph.querySelector(".labels");
    const rows = {};
    let y = 0, section = null;
    const bands = [];
    for (const p of pages) {
      if (p.section !== section) { section = p.section; labels.append(el(`<div class="gsection">${esc(section)}</div>`)); bands.push(y); y += SEC; }
      const a = el(`<a class="${p.seen ? "" : "unseen"}" href="${pageHref(p.id)}" title="${esc(p.id)}">${routeHtml(p.id)}</a>`);
      a.addEventListener("click", (e) => { if (state.dragged) e.preventDefault(); });
      const lrow = el('<div class="lrow"></div>');
      lrow.append(a, focusButton(p.id));
      labels.append(lrow);
      rows[p.id] = { y: y + ROW / 2, label: lrow };
      y += ROW;
    }
    const height = y + 8;
    labels.append(el('<div style="height:8px"></div>'));
    const svg = svgEl("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
    const axisSvg = svgEl("svg", { width, height: AXIS, viewBox: `0 0 ${width} ${AXIS}` });
    svg.append(arrowDefs());
    const layer = () => { const g = svgEl("g"); svg.append(g); return g; };
    const gBack = layer(), gHit = layer(), gLanes = layer(), gEdges = layer(), gNodes = layer();
    const gAxis = svgEl("g"); axisSvg.append(gAxis);

    for (const by of bands) { gBack.append(svgEl("rect", { class: "band", x: 0, y: by, width, height: SEC })); gBack.append(svgEl("line", { class: "bandline", x1: 0, x2: width, y1: by + SEC, y2: by + SEC })); }
    // Axis: months on top, snapshot dates below where there is room, finer ticks when zoomed.

    const first = new Date(t0);
    const mlabel = (d, withYear) => d.toLocaleString("en", { month: "short", timeZone: "UTC" }) + (withYear ? " " + d.getUTCFullYear() : "");
    { const t = svgEl("text", { class: "month", x: LEFT, y: 15 }); t.textContent = mlabel(first, true); gAxis.append(t); }
    const cursor = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 1));
    for (; cursor.getTime() < t1; cursor.setUTCMonth(cursor.getUTCMonth() + 1)) {
      const mx = x(cursor.toISOString().slice(0, 10));
      gBack.append(svgEl("line", { class: "monthline", x1: mx, x2: mx, y1: 0, y2: height }));
      gAxis.append(svgEl("line", { class: "monthline", x1: mx, x2: mx, y1: 0, y2: AXIS }));
      if (mx - LEFT > 64) { const t = svgEl("text", { class: "month", x: mx + 5, y: 15 }); t.textContent = mlabel(cursor, cursor.getUTCMonth() === 0); gAxis.append(t); }
    }
    if (pxPerDay >= 2.2) {
      const day = new Date(t0);
      for (; day.getTime() <= t1; day.setUTCDate(day.getUTCDate() + 1)) {
        const monday = day.getUTCDay() === 1, firstDay = day.getUTCDate() === 1;
        if (firstDay || (!monday && pxPerDay < 16)) continue;
        const dx = x(day.toISOString().slice(0, 10));
        gBack.append(svgEl("line", { class: monday ? "week" : "day", x1: dx, x2: dx, y1: 0, y2: height }));
        if (monday ? pxPerDay >= 4.5 : pxPerDay >= 22) { const t = svgEl("text", { class: "fine", x: dx + 3, y: 27 }); t.textContent = day.getUTCDate(); gAxis.append(t); }
      }
    }
    let lastLabel = -100;
    snaps.forEach((s) => {
      const sx = x(s.date);
      gBack.append(svgEl("line", { class: "guide", x1: sx, x2: sx, y1: 0, y2: height }));
      gAxis.append(svgEl("line", { class: "monthline", x1: sx, x2: sx, y1: AXIS - 6, y2: AXIS }));
      if (sx - lastLabel > 46) { const t = svgEl("text", { x: sx, y: 40, "text-anchor": "middle" }); t.textContent = s.date.slice(5); gAxis.append(t); lastLabel = sx; }
    });

    const ends = new Map(H.edges.filter((e) => ["merged", "redirect", "replaced", "rename"].includes(e.type)).map((e) => [e.from, e]));
    const RANK = { major: 5, new: 4, base: 4, minor: 3, missing: 2, same: 1 };

    for (const p of pages) {
      const row = rows[p.id];
      const hit = svgEl("rect", { class: "rowhit", x: 0, y: row.y - ROW / 2, width, height: ROW });
      hit.addEventListener("mouseenter", () => row.label.classList.add("hot"));
      hit.addEventListener("mouseleave", () => row.label.classList.remove("hot"));
      hit.addEventListener("click", () => { if (!state.dragged) location.hash = pageHref(p.id); });
      row.label.addEventListener("mouseenter", () => hit.classList.add("hot"));
      row.label.addEventListener("mouseleave", () => hit.classList.remove("hot"));
      gHit.append(hit);

      const end = ends.get(p.id);
      const { first: f0, last: l0 } = lifespan(p);
      const spans = p.life?.length ? p.life : f0 == null ? [] : [{ from: snaps[f0].date, to: l0 < snaps.length - 1 ? snaps[l0 + 1].date : null }];
      spans.forEach((span, k) => {
        const lastSpan = k === spans.length - 1;
        const stop = lastSpan && end && !span.to ? end.date : span.to ?? H.project.to;
        const x1 = x(span.from), x2 = Math.max(x(stop), x1 + 2);
        gLanes.append(svgEl("line", { class: `lane ${p.seen ? "" : "unseen"}`, x1, x2, y1: row.y, y2: row.y }));
        gLanes.append(svgEl("line", { class: "birth", x1, x2: x1, y1: row.y - 5, y2: row.y + 5 }));
        if (span.to && !(lastSpan && end)) {
          gLanes.append(svgEl("line", { class: "death", x1: x2 - 4, x2: x2 + 4, y1: row.y - 4, y2: row.y + 4 }));
          gLanes.append(svgEl("line", { class: "death", x1: x2 - 4, x2: x2 + 4, y1: row.y + 4, y2: row.y - 4 }));
        }
      });

      // Snapshots closer than a node's width are drawn as one numbered dot.
      const points = [];
      snaps.forEach((s, i) => {
        const st = status(p, i);
        if (st.kind === "absent" || st.kind === "redirect") return;
        points.push({ s, i, st, x: x(s.date) });
      });
      const groups = [];
      for (const pt of points) {
        const g = groups[groups.length - 1];
        if (g && pt.x - g.last < 7) { g.items.push(pt); g.last = pt.x; }
        else groups.push({ last: pt.x, items: [pt] });
      }
      for (const g of groups) {
        const top = g.items.reduce((a, b) => (RANK[b.st.kind] > RANK[a.st.kind] ? b : a));
        const cx = g.items.reduce((n, it) => n + it.x, 0) / g.items.length;
        // Several unchanged snapshots on top of each other are still just "unchanged";
        // a pile that contains a change shows the change, with the count inside.
        const cluster = g.items.length > 1 && top.st.kind !== "same";
        const r = cluster ? 6.5 : { major: 5.5, new: 5, base: 5, minor: 4, same: 2.5, missing: 2.5 }[top.st.kind];
        const node = svgEl("circle", { class: `node ${top.st.kind}`, cx, cy: row.y, r });
        const detail = g.items.map((it) => { const n = p.views.filter((v) => v.shots[it.s.id]).length; return `${esc(it.s.date)} · ${STATUS_TEXT[it.st.kind]}${n > 1 ? ` · ${plural(n, "view")}` : ""}`; }).join("<br>");
        node.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(p.id)}</b><br>${detail}`));
        node.addEventListener("mouseleave", hideTip);
        node.addEventListener("click", () => { if (!state.dragged) location.hash = pageHref(p.id); });
        gNodes.append(node);
        if (cluster) { const t = svgEl("text", { class: `count ${top.st.kind === "major" ? "onfill" : ""}`, x: cx, y: row.y + 3, "text-anchor": "middle" }); t.textContent = g.items.length; gNodes.append(t); }
      }
    }

    for (const e of H.edges) {
      const a = rows[e.from], b = rows[e.to];
      if (!a || !b || !e.date || !linkOn(e)) continue;
      gEdges.append(edgePath(e, x(e.date), a.y, b.y));
    }
    graph.querySelector(".axis").append(axisSvg);
    graph.querySelector(".body").append(svg);
    wrap.append(graph);
    content.replaceChildren(wrap);
    const plot = graph;
    plot.scrollLeft = state.graphLeft;
    plot.scrollTop = state.graphTop ?? 0;
    plot.addEventListener("scroll", () => { state.graphLeft = plot.scrollLeft; state.graphTop = plot.scrollTop; });

    // Zoom keeps the moment under the pointer (or the centre) where it is.
    // anchorX is measured from the left edge of the plot area (after the label column).
    const zoomTo = (next, anchorX = (plot.clientWidth - labelW) / 2) => {
      next = Math.min(MAX_ZOOM, Math.max(1, next));
      if (next === state.zoom) return;
      const at = (plot.scrollLeft + anchorX - LEFT) / (width - LEFT - RIGHT);
      state.zoom = next;
      state.graphLeft = Math.max(0, LEFT + at * (Math.round(fitWidth * next) - LEFT - RIGHT) - anchorX);
      render();
    };
    zoomBar.querySelectorAll("[data-zoom]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.zoom === "fit") { state.graphLeft = 0; zoomTo(1); if (state.zoom === 1) plot.scrollLeft = 0; }
      else zoomTo(state.zoom * (b.dataset.zoom === "in" ? 1.6 : 1 / 1.6));
    }));
    let pending = null;
    plot.addEventListener("wheel", (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const anchorX = e.clientX - plot.getBoundingClientRect().left - labelW;
      const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.04 : 0.006));
      pending = { zoom: (pending?.zoom ?? state.zoom) * factor, anchorX };
      if (!plot.dataset.frame) {
        plot.dataset.frame = "1";
        requestAnimationFrame(() => { const q = pending; pending = null; delete plot.dataset.frame; zoomTo(q.zoom, q.anchorX); });
      }
    }, { passive: false });
    plot.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("a, button")) return;
      const startX = e.clientX, startY = e.clientY, startLeft = plot.scrollLeft, startTop = plot.scrollTop;
      state.dragged = false;
      const move = (ev) => {
        if (Math.abs(ev.clientX - startX) > 4 || Math.abs(ev.clientY - startY) > 4) { state.dragged = true; plot.classList.add("panning"); }
        if (state.dragged) { plot.scrollLeft = startLeft - (ev.clientX - startX); plot.scrollTop = startTop - (ev.clientY - startY); }
      };
      const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); plot.classList.remove("panning"); setTimeout(() => (state.dragged = false), 0); };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
  }

  // ---------- Screens over time ----------
  function renderTimeline() {
    const pages = H.pages.filter((p) => p.seen && matches(p));
    header("Screens", `${pages.length} pages · ${plural(snaps.length, "snapshot")}`, [],
      "<p>One row per page, one column per snapshot. A thumbnail appears where the page first existed or changed; a small dot on the line means it looked the same as before, and the line shows how long the page existed. Click a thumbnail to enlarge it, then use the arrow keys to move through the changes. The \"views\" button opens the page's sections, dialogs and menus as extra rows.</p>");
    if (!pages.length) { content.replaceChildren(emptyState()); return; }
    const bar = el('<div class="screensbar"></div>');
    bar.append(relationToggles());
    const grid = el(`<div class="grid" style="grid-template-columns: var(--label-w) repeat(${snaps.length}, var(--col-w))"></div>`);
    grid.append(el('<div class="corner">Page</div>'));
    // "24 May", with the year only where it changes; the commit is in the tooltip.
    snaps.forEach((s, i) => {
      const d = new Date(s.date + "T00:00:00Z");
      const day = d.toLocaleString("en", { day: "numeric", month: "short", timeZone: "UTC" });
      const year = i === 0 || snaps[i - 1].date.slice(0, 4) !== s.date.slice(0, 4) ? `<small>${d.getUTCFullYear()}</small>` : "";
      grid.append(el(`<a class="head" href="#/snapshot/${s.id}" title="${esc(s.date)} · ${esc(s.id)}\n${esc(s.subject)}"><div class="date">${esc(day)}${year}</div><div class="meta">${plural(s.pages, "page")}</div></a>`));
    });

    let section = null;
    const cellFor = (st, i, first, last, series, inRange) => {
      const cell = el(`<div class="cell ${inRange ? "alive" : "outside"} ${i === first ? "first" : ""} ${i === last ? "last" : ""}"></div>`);
      if (st.shot && img(st.shot)) {
        if (st.kind === "same" && !state.showSame) {
          const same = el(`<button class="dot samedot" title="Unchanged on ${esc(snaps[i].date)}. Click to look anyway."></button>`);
          same.addEventListener("click", () => openLightbox(series, i));
          cell.append(same);
        } else cell.append(thumb(img(st.shot), series, i, st));
      } else if (st.kind === "redirect") {
        cell.append(el(`<a class="pill link" href="${pageHref(st.to)}" title="Redirects to ${esc(st.to)}">→ ${esc(st.to.length > 14 ? "…" + st.to.slice(-13) : st.to)}</a>`));
      } else if (st.kind === "missing") cell.append(el('<span class="dot" title="Exists, but could not be captured"></span>'));
      else if (st.kind === "gone") cell.append(el('<span class="pill gone">removed</span>'));
      return cell;
    };
    for (const page of pages) {
      if (page.section !== section) { section = page.section; grid.append(el(`<div class="section">${esc(section)}</div>`)); }
      const { first, last } = lifespan(page);
      const extras = extraViews(page);
      const label = el(`<div class="label" data-page="${esc(page.id)}"><a class="route" href="${pageHref(page.id)}" title="${esc(page.id)}">${routeHtml(page.id)}</a></div>`);
      if (extras.length) {
        const open = state.expanded.has(page.id);
        const ex = el(`<button class="expander" title="${open ? "Hide" : "Show"} this page's sections, dialogs and menus">${open ? "▾" : "▸"} ${plural(extras.length, "view")}</button>`);
        ex.addEventListener("click", () => { open ? state.expanded.delete(page.id) : state.expanded.add(page.id); render(); });
        label.append(ex);
      }
      label.append(focusButton(page.id));
      grid.append(label);
      const series = seriesFor(page.id, mainView(page));
      snaps.forEach((s, i) => {
        const st = i === last + 1 && last < snaps.length - 1 ? { kind: "gone" } : status(page, i);
        grid.append(cellFor(st, i, first, last, series, i >= first && i <= last));
      });
      if (state.expanded.has(page.id)) for (const view of extras) {
        const row = el('<div class="subrow" style="display:contents"></div>');
        row.append(el(`<div class="label"><a class="route" href="${pageHref(page.id, view.id)}" title="${esc(view.label)}">${esc(view.label)}</a><span class="kind">${esc((KIND_LABEL[view.kind] ?? view.kind).replace(/s$/, ""))}</span></div>`));
        const vSeries = seriesFor(`${page.id} · ${view.label}`, view);
        const on = snaps.map((_, i) => i).filter((i) => view.shots[snaps[i].id]);
        snaps.forEach((s, i) => row.append(cellFor(viewStatus(view, i), i, on[0], on[on.length - 1], vSeries, i >= on[0] && i <= on[on.length - 1])));
        grid.append(row);
      }
    }
    content.replaceChildren(bar, grid);
    drawScreenLinks(grid);
  }

  /**
   * The graph's relation curves, laid over the screens grid: each one runs between the two
   * pages' rows, at the first snapshot that shows the result.
   */
  function drawScreenLinks(grid) {
    const rowY = {};
    for (const label of grid.querySelectorAll(".label[data-page]")) rowY[label.dataset.page] = label.offsetTop + label.offsetHeight / 2;
    const labelW = grid.querySelector(".corner").offsetWidth;
    const colW = grid.querySelector(".head")?.offsetWidth ?? 132;
    const svg = svgEl("svg", { class: "links", width: grid.scrollWidth, height: grid.scrollHeight });
    svg.append(arrowDefs());
    for (const e of H.edges) {
      if (!e.date || !linkOn(e) || rowY[e.from] == null || rowY[e.to] == null) continue;
      let k = snaps.findIndex((s) => s.date >= e.date);
      if (k < 0) k = snaps.length - 1;
      // At the left edge of that snapshot's column, clear of its thumbnail.
      svg.append(edgePath(e, labelW + k * colW + 18, rowY[e.from], rowY[e.to]));
    }
    grid.append(svg);
  }

  // ---------- Page ----------
  function renderPage(id, viewId) {
    const page = pageById[id];
    if (!page) { header("Unknown page"); content.innerHTML = '<div class="empty">Unknown page.</div>'; return; }
    const order = H.pages.filter((p) => p.seen);
    const at = order.indexOf(page);
