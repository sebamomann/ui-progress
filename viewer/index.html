<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI History</title>
<style>
:root {
  --bg: #f4f4f1; --surface: #ffffff; --raised: #fafaf8; --line: #e1e0da; --line-strong: #c9c7be;
  --text: #1c1d1a; --muted: #6c6d66; --faint: #9a9b93;
  --accent: #3d5afe; --accent-soft: #e8ecff; --on-accent: #ffffff;
  --new: #1a8f4c; --new-soft: #dff3e6; --major: #c2570a; --major-soft: #fdebd8; --minor: #8a7a1f;
  --gone: #c0322b; --gone-soft: #fbe3e1; --lane: #a9aec9; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --side-w: 270px; --label-w: 230px; --col-w: 176px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131412; --surface: #1c1d1a; --raised: #222320; --line: #2e302b; --line-strong: #45473f;
    --text: #ecece6; --muted: #a2a39b; --faint: #74756d;
    --accent: #8c9eff; --accent-soft: #252b4d; --on-accent: #10122a;
    --new: #5fd08a; --new-soft: #17301f; --major: #f0a060; --major-soft: #3a2614; --minor: #c9b955;
    --gone: #f0776f; --gone-soft: #3a1b19; --lane: #565d87; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #131412; --surface: #1c1d1a; --raised: #222320; --line: #2e302b; --line-strong: #45473f;
  --text: #ecece6; --muted: #a2a39b; --faint: #74756d;
  --accent: #8c9eff; --accent-soft: #252b4d; --on-accent: #10122a;
  --new: #5fd08a; --new-soft: #17301f; --major: #f0a060; --major-soft: #3a2614; --minor: #c9b955;
  --gone: #f0776f; --gone-soft: #3a1b19; --lane: #565d87; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .92em; }

/* Sidebar */
.side { width: var(--side-w); flex: 0 0 var(--side-w); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 14px 16px 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 10px; }
.nav a { display: flex; flex-direction: column; padding: 7px 10px; border-radius: 8px; color: var(--text); }
.nav a small { color: var(--muted); font-size: 12px; }
.nav a:hover { background: var(--raised); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a[aria-current="page"] small { color: inherit; opacity: .8; font-weight: 400; }
.side .searchbox { padding: 10px 12px 8px; border-top: 1px solid var(--line); }
.field { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--raised); padding: 6px 10px; }
.tree { flex: 1; overflow: auto; padding: 0 8px 16px; }
.tree details { margin-top: 2px; }
.tree summary { cursor: pointer; padding: 5px 8px; font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-radius: 6px; list-style: none; display: flex; justify-content: space-between; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary:hover { background: var(--raised); }
.tree a { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px 4px 14px; border-radius: 6px; color: var(--text); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.tree a:hover { background: var(--raised); text-decoration: none; }
.tree a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tree a.unseen { color: var(--faint); }
.tree a span { color: var(--faint); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; white-space: nowrap; }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.top .sub { color: var(--muted); font-size: 12.5px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--raised); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; color: var(--muted); text-transform: capitalize; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
.ghost { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--text); }
.ghost:hover { border-color: var(--accent); text-decoration: none; }
.menu-btn { display: none; }
.content { flex: 1; min-height: 0; overflow: auto; }
.pad { padding: 16px 16px 48px; }
.lead { color: var(--muted); max-width: 78ch; margin: 0 0 12px; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; line-height: 1.5; white-space: nowrap; }
.pill.new { background: var(--new-soft); color: var(--new); }
.pill.major { background: var(--major-soft); color: var(--major); }
.pill.minor { color: var(--minor); box-shadow: inset 0 0 0 1px currentColor; }
.pill.gone { background: var(--gone-soft); color: var(--gone); }
.pill.link { background: var(--accent-soft); color: var(--accent); }
.pill.same { color: var(--faint); box-shadow: inset 0 0 0 1px var(--line-strong); }
.h2 { font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.empty { padding: 48px 16px; color: var(--muted); text-align: center; }

/* Graph */
.graph { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.graph .labels { flex: 0 0 var(--label-w); border-right: 1px solid var(--line); }
.graph .plot { flex: 1; overflow-x: auto; min-width: 0; }
.graph .axis-gap { height: 38px; border-bottom: 1px solid var(--line-strong); }
.grow { height: 26px; display: flex; align-items: center; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--text); }
a.grow:hover, a.grow.hot { background: var(--accent-soft); text-decoration: none; }
.grow.unseen { color: var(--faint); }
.gsection { height: 24px; display: flex; align-items: flex-end; padding: 0 10px 3px; font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--raised); border-top: 1px solid var(--line); }
.plot svg { display: block; }
.plot text { font: 11.5px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
.plot .guide { stroke: var(--line-strong); stroke-dasharray: 3 4; }
.plot .month { stroke: var(--line-strong); }
.plot .week { stroke: var(--line); }
.plot .day { stroke: var(--line); opacity: .55; }
.plot text.fine { fill: var(--faint); font-size: 10.5px; }
.graph .plot { cursor: grab; }
.graph .plot.panning { cursor: grabbing; user-select: none; }
.zoombar { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.zoombar .seg button { padding: 3px 12px; min-width: 34px; color: var(--text); text-transform: none; }
.zoombar .seg button + button { border-left: 1px solid var(--line-strong); }
.zoomhint { color: var(--faint); }
.plot .band { fill: var(--raised); }
.plot .lane { stroke: var(--lane); stroke-width: 2; }
.plot .lane, .plot .birth, .plot .death { pointer-events: none; }
.plot .lane.unseen { stroke-dasharray: 2 4; opacity: .7; }
.plot .rowhit { fill: transparent; cursor: pointer; }
.plot .rowhit:hover, .plot .rowhit.hot { fill: var(--accent-soft); }
.plot .node { cursor: pointer; }
.plot .node.same { fill: var(--lane); }
.plot .node.new, .plot .node.base { fill: var(--surface); stroke: var(--new); stroke-width: 2.5; }
.plot .node.major { fill: var(--major); stroke: var(--surface); stroke-width: 1.5; }
.plot .node.minor { fill: var(--surface); stroke: var(--minor); stroke-width: 2; }
.plot .node.missing { fill: var(--faint); }
.plot .birth { stroke: var(--new); stroke-width: 2; }
.plot .death { stroke: var(--gone); stroke-width: 2; }
.plot .edge { fill: none; stroke-width: 1.5; }
.plot .edge.branch { stroke: var(--lane); }
.plot .edge.split { stroke: var(--new); stroke-width: 2; }
.plot .edge.merged, .plot .edge.replaced { stroke: var(--gone); stroke-width: 2; }
.plot .edge.redirect, .plot .edge.rename { stroke: var(--accent); stroke-width: 2; }
.plot .edge.clone { stroke: var(--accent); stroke-dasharray: 4 3; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 7px; font-size: 12.5px; max-width: 340px; box-shadow: var(--shadow); display: none; }
.tip b { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.key { display: inline-block; width: 11px; height: 11px; border-radius: 50%; }
.key.new { border: 2.5px solid var(--new); }
.key.major { background: var(--major); }
.key.minor { border: 2px solid var(--minor); }
.key.same { width: 6px; height: 6px; background: var(--lane); }
.key.line { width: 20px; height: 2px; border-radius: 0; background: var(--lane); }
.key.split { width: 20px; height: 2px; border-radius: 0; background: var(--new); }
.key.merge { width: 20px; height: 2px; border-radius: 0; background: var(--gone); }
.key.move { width: 20px; height: 2px; border-radius: 0; background: var(--accent); }
.key.clone { width: 20px; height: 0; border-radius: 0; border-top: 2px dashed var(--accent); }

/* Thumbnail timeline */
.grid { display: grid; position: relative; width: max-content; }
.head { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line-strong); padding: 8px 10px; border-left: 1px solid var(--line); }
a.head { color: inherit; }
a.head:hover { background: var(--accent-soft); text-decoration: none; }
.head .date { font-weight: 650; }
.head .meta { color: var(--muted); font-size: 12px; }
.corner { position: sticky; left: 0; top: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line-strong); padding: 8px 12px; color: var(--muted); font-size: 12px; display: flex; align-items: flex-end; }
.section { grid-column: 1 / -1; background: var(--bg); padding: 12px 12px 5px; font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.section span { position: sticky; left: 12px; }
.label { position: sticky; left: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 10px 8px 12px; display: flex; flex-direction: column; gap: 3px; justify-content: center; min-width: 0; }
.label .route { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.label .sub { color: var(--faint); font-size: 11.5px; }
.expander { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 11.5px; text-align: left; }
.cell { position: relative; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; background: var(--surface); }
.cell.alive::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--lane); }
.cell.first::before { left: 50%; }
.cell.last::before { right: 50%; }
.cell.first.last::before { display: none; }
.thumb { position: relative; z-index: 1; display: block; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-strong); background: var(--raised); cursor: zoom-in; padding: 0; line-height: 0; box-shadow: var(--shadow); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.thumb:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.thumb.same { opacity: .5; box-shadow: none; }
.thumb.same:hover { opacity: 1; }
.tags { position: relative; z-index: 1; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.samedot { cursor: pointer; padding: 0; }
.samedot:hover { border-color: var(--accent); }
.dot { position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--lane); }
.subrow .label, .subrow .cell { background: var(--raised); }
.subrow .label { padding-left: 24px; }
.subrow .label .route { font-family: inherit; font-weight: 500; }

/* Page view */
.facts { color: var(--muted); display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px; }
.facts .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.facts .why { color: var(--faint); font-size: 12.5px; padding-left: 4px; max-width: 90ch; }
.pagewrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
.views { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; position: sticky; top: 0; max-height: calc(100vh - 90px); overflow: auto; }
.views .group { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 9px 8px 3px; }
.views a { display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border-radius: 7px; color: var(--text); }
.views a:hover { background: var(--raised); text-decoration: none; }
.views a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.ticks { display: flex; gap: 2px; flex-wrap: wrap; }
.ticks i { width: 8px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.ticks i.on { background: var(--lane); }
.ticks i.major { background: var(--major); }
.ticks i.new { background: var(--new); }
.strip { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 14px; align-items: flex-start; }
.frame { flex: 0 0 auto; width: 320px; }
.frame.narrow { width: 190px; }
.frame header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.frame .shot { display: block; width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); cursor: zoom-in; padding: 0; line-height: 0; box-shadow: var(--shadow); max-height: 560px; }
.frame .shot img { width: 100%; display: block; }
.frame .gap { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 26px 12px; color: var(--muted); text-align: center; }
.frame .caption { color: var(--faint); font-size: 12px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compare { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-width: 1100px; }
.compare .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.compare .controls .field { width: auto; }
.compare .stage { position: relative; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden auto; max-height: 78vh; line-height: 0; background: var(--raised); }
.compare .stage img { width: 100%; display: block; }
.compare .stage .after { position: absolute; inset: 0 0 auto 0; }
.compare .handle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
.compare input[type="range"] { flex: 1; min-width: 180px; accent-color: var(--accent); }

/* Snapshots */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.cards.narrow { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.card .thumb { width: 100%; aspect-ratio: 16 / 10; }
.cards.narrow .card .thumb { aspect-ratio: 15 / 26; }
.card .route { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.snaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.snap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; color: var(--text); display: flex; flex-direction: column; gap: 6px; }
.snap:hover { border-color: var(--accent); text-decoration: none; }
.snap b { font-size: 16px; }
.snap .counts { display: flex; gap: 6px; flex-wrap: wrap; }
.lists { display: flex; gap: 28px; flex-wrap: wrap; }
.lists ul { margin: 4px 0 0; padding-left: 18px; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8, 9, 12, .94); display: none; flex-direction: column; color: #eee; }
.lightbox.open { display: flex; }
.lightbox .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
.lightbox .where { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
.lightbox .when { color: #b9bac4; }
.lightbox button { border: 1px solid #555; background: #1d1e24; color: #eee; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.lightbox button:disabled { opacity: .35; cursor: default; }
.lightbox .body { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 0 16px 24px; }
.lightbox .body img { max-width: 100%; border-radius: 6px; background: #fff; }
.lightbox .steps { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 40vw; }
.lightbox .steps i { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.lightbox .steps i.on { background: #fff; }
.lightbox .steps i.off { background: transparent; box-shadow: inset 0 0 0 1px #555; }
.hint { color: #8f909a; font-size: 12px; }

@media (max-width: 900px) {
  .side { position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--shadow); max-width: 86vw; }
  body.side-open .side { transform: none; }
  .menu-btn { display: inline-block; }
  .pagewrap { grid-template-columns: minmax(0, 1fr); }
  .views { position: static; max-height: 260px; }
  :root { --label-w: 150px; --col-w: 140px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand">UI History<small id="project"></small></div>
  <nav class="nav" id="nav">
    <a href="#/" data-view="graph">Graph<small>How pages were added, split off and merged</small></a>
    <a href="#/timeline" data-view="timeline">Screens over time<small>Every page as thumbnails, snapshot by snapshot</small></a>
    <a href="#/snapshots" data-view="snapshots">Snapshots<small>The whole site at one point in time</small></a>
  </nav>
  <div class="searchbox"><input class="field" id="search" type="search" placeholder="Find a page…" aria-label="Find a page"></div>
  <div class="tree" id="tree"></div>
</aside>
<div class="main">
  <div class="top">
    <button class="ghost menu-btn" id="menuBtn">Pages</button>
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <div class="spacer"></div>
    <label class="check" title="Also show the snapshots in which a page looked the same as before"><input type="checkbox" id="showSame"> Show unchanged</label>
    <label class="check" title="Hide pages that never changed"><input type="checkbox" id="onlyChanged"> Changed pages only</label>
    <div class="seg" role="group" aria-label="Viewport" id="viewports"></div>
    <button class="ghost" id="theme" title="Switch light and dark">Theme</button>
  </div>
  <div class="content" id="content"></div>
</div>
<div class="tip" id="tip"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot">
  <div class="bar">
    <span class="where" id="lbWhere"></span><span class="when" id="lbWhen"></span><span class="steps" id="lbSteps"></span>
    <span class="spacer"></span><span class="hint">← → through time · Esc to close</span>
    <button id="lbPrev">← Older</button><button id="lbNext">Newer →</button><button id="lbClose">Close</button>
  </div>
  <div class="body"><img id="lbImg" alt=""></div>
</div>

<script src="data/history.js"></script>
<script>
(() => {
  const H = window.UI_HISTORY;
  const content = document.getElementById("content");
  if (!H) { content.innerHTML = '<div class="empty">No data yet. Run <code>ui-progress build</code>.</div>'; return; }

  const MAJOR = H.thresholds?.redesign ?? 0.3, MINOR = H.thresholds?.tweak ?? 0.02;
  const snaps = H.snapshots;
  const snapIndex = Object.fromEntries(snaps.map((s, i) => [s.id, i]));
  const pageById = Object.fromEntries(H.pages.map((p) => [p.id, p]));
  const viewportNames = H.viewports ?? ["desktop", "mobile"];
  const state = { viewport: viewportNames[0], search: "", onlyChanged: false, showSame: false, expanded: new Set(), zoom: 1, graphLeft: 0 };
  const MAX_ZOOM = 80;
  const KIND_LABEL = { page: "Whole page", "signed-out": "Signed out", section: "Sections", dialog: "Dialogs", menu: "Menus" };
  const EDGE_TEXT = {
    branch: ["Grew", "Grew out of"], split: ["Split off", "Split off from"], merged: ["Folded into", "Absorbed"],
    replaced: ["Replaced by", "Replaced"], clone: ["Copied to make", "Built from a copy of"], rename: ["Renamed to", "Renamed from"], redirect: ["Redirects to", "Target of"],
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const svgEl = (tag, attrs = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const pageHref = (id, view) => "#/page/" + encodeURIComponent(id) + (view && view !== "page" ? "/" + encodeURIComponent(view) : "");
  const img = (shot) => shot?.images?.[state.viewport] ?? Object.values(shot?.images ?? {})[0] ?? null;
  const narrow = () => state.viewport !== viewportNames[0] && /mobile|phone|narrow/i.test(state.viewport);
  const mainView = (page) => page.views.find((v) => v.id === "page");
  const extraViews = (page) => page.views.filter((v) => v.id !== "page");
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  /** What a view looked like at a snapshot, relative to the last time it was captured. */
  function viewStatus(view, i) {
    const shot = view?.shots[snaps[i].id];
    if (!shot) return { kind: "absent" };
    const earlier = snaps.slice(0, i).some((s) => view.shots[s.id]);
    if (!earlier) return { kind: i === 0 ? "base" : "new", shot };
    const diff = shot.change?.[state.viewport] ?? Object.values(shot.change ?? {})[0];
    if (diff == null) return { kind: "same", shot };
    return { kind: diff >= MAJOR ? "major" : diff >= MINOR ? "minor" : "same", shot, diff };
  }
  /** The page as a whole at a snapshot. */
  function status(page, i) {
    const here = page.presence[snaps[i].id];
    if (!here) return { kind: "absent" };
    if (here.redirect) return { kind: "redirect", to: here.redirect };
    if (here.missing) return { kind: "missing", why: here.missing };
    return viewStatus(mainView(page), i);
  }
  const exists = (page, i) => Boolean(page.presence[snaps[i].id]);
  const lifespan = (page) => { const on = snaps.map((_, i) => i).filter((i) => exists(page, i)); return { first: on[0], last: on[on.length - 1] }; };
  const everChanged = (page) => !page.seen || snaps.some((_, i) => ["new", "major", "minor", "redirect"].includes(status(page, i).kind)) || lifespan(page).last < snaps.length - 1;
  const matches = (page) => { const q = state.search.trim().toLowerCase(); return (!q || page.id.toLowerCase().includes(q)) && (!state.onlyChanged || everChanged(page)); };
  const STATUS_TEXT = { new: "new here", base: "first snapshot", major: "redesigned", minor: "small change", same: "unchanged", missing: "exists, not captured", absent: "does not exist" };

  const pillFor = (st) =>
    st.kind === "new" ? '<span class="pill new">new</span>'
    : st.kind === "major" ? '<span class="pill major">redesign</span>'
    : st.kind === "minor" ? '<span class="pill minor">tweak</span>'
    : st.kind === "same" ? '<span class="pill same">same</span>' : "";

  function thumb(image, series, index, cls = "") {
    const size = narrow() ? "width:60px;height:104px" : "width:144px;height:90px";
    const b = el(`<button class="thumb ${cls}" style="${size}"><img loading="lazy" src="${esc(image.card)}" alt=""></button>`);
    b.addEventListener("click", () => openLightbox(series, index));
    return b;
  }
  /** One view across all snapshots, for stepping through time in the lightbox. */
  const seriesFor = (title, view) => ({ title, frames: snaps.map((s, i) => { const im = img(view?.shots[s.id]); return im ? { snap: s, image: im, same: viewStatus(view, i).kind === "same" } : null; }) });

  function header(title, subtitle) {
    document.getElementById("title").textContent = title;
    document.getElementById("subtitle").innerHTML = subtitle ?? "";
  }

  // ---------- Sidebar ----------
  function renderTree(current) {
    const tree = document.getElementById("tree");
    const q = state.search.trim().toLowerCase();
    const bySection = new Map();
    for (const p of H.pages) if (!q || p.id.toLowerCase().includes(q)) (bySection.get(p.section) ?? bySection.set(p.section, []).get(p.section)).push(p);
    const wasOpen = new Set([...tree.querySelectorAll("details[open]")].map((d) => d.dataset.section));
    tree.innerHTML = "";
    for (const [section, pages] of bySection) {
      const open = q || pages.some((p) => p.id === current) || wasOpen.has(section) || bySection.size <= 6;
      const d = el(`<details ${open ? "open" : ""} data-section="${esc(section)}"><summary>${esc(section)}<span>${pages.length}</span></summary></details>`);
      for (const p of pages) {
        const extra = extraViews(p).length;
        d.append(el(`<a href="${pageHref(p.id)}" class="${p.seen ? "" : "unseen"}" ${p.id === current ? 'aria-current="page"' : ""} title="${p.seen ? "" : "Existed between snapshots, or was never captured"}">${esc(p.id)}<span>${p.seen ? (extra ? "+" + extra : "") : "no shots"}</span></a>`));
      }
      tree.append(d);
    }
    if (!bySection.size) tree.append(el('<div class="empty">No page matches.</div>'));
  }

  // ---------- Graph ----------
  function renderGraph() {
    header("Graph", `${H.pages.length} pages · ${H.project.commits} commits · ${esc(H.project.from)} to ${esc(H.project.to)}`);
    const pad = el('<div class="pad"></div>');
    pad.append(el('<p class="lead">Each line is one page, from the day it was added to the day it was removed. A line that curves out of another came from that page; a line that curves into another went into it. Dots are the snapshots where screenshots exist. Hover a curve for the evidence, click a line to open the page.</p>'));
    pad.append(el(`<div class="legend">
      <span><i class="key new"></i> first seen</span><span><i class="key major"></i> redesigned</span><span><i class="key minor"></i> small change</span><span><i class="key same"></i> unchanged</span>
      <span><i class="key split"></i> split off</span><span><i class="key merge"></i> merged or replaced</span><span><i class="key move"></i> renamed or redirected</span><span><i class="key clone"></i> built from a copy</span><span><i class="key line"></i> new under a parent</span></div>`));
    const zoomBar = el(`<div class="zoombar"><span class="seg"><button data-zoom="out" title="Zoom out">−</button><button data-zoom="fit" title="Show the whole history">Fit</button><button data-zoom="in" title="Zoom in">+</button></span>
      <span>${state.zoom === 1 ? "whole history" : "×" + (state.zoom < 10 ? state.zoom.toFixed(1) : Math.round(state.zoom))}</span><span class="zoomhint">Zoom the time axis: Ctrl or ⌘ + scroll, or pinch. Drag to pan.</span></div>`);
    pad.append(zoomBar);
    const pages = H.pages.filter(matches);
    if (!pages.length) { pad.append(el('<div class="empty">No pages match the filter.</div>')); content.replaceChildren(pad); return; }

    const ROW = 26, SEC = 24, AXIS = 38, LEFT = 16, RIGHT = 28;
    const t0 = Date.parse(H.project.from), t1 = Math.max(Date.parse(H.project.to), t0 + 86400000);
    const labelW = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--label-w"));
    const fitWidth = Math.max(720, content.clientWidth - 32 - labelW - 4);
    const width = Math.round(fitWidth * state.zoom);
    const pxPerDay = (width - LEFT - RIGHT) / ((t1 - t0) / 86400000);
    const x = (date) => LEFT + ((Math.min(Math.max(Date.parse(date), t0), t1) - t0) / (t1 - t0)) * (width - LEFT - RIGHT);

    const graph = el('<div class="graph"><div class="labels"><div class="axis-gap"></div></div><div class="plot"></div></div>');
    const labels = graph.querySelector(".labels");
    const rows = {};
    let y = AXIS, section = null;
    const bands = [];
    for (const p of pages) {
      if (p.section !== section) { section = p.section; labels.append(el(`<div class="gsection">${esc(section)}</div>`)); bands.push(y); y += SEC; }
      const a = el(`<a class="grow ${p.seen ? "" : "unseen"}" href="${pageHref(p.id)}" title="${esc(p.id)}">${esc(p.id)}</a>`);
      labels.append(a);
      rows[p.id] = { y: y + ROW / 2, label: a };
      y += ROW;
    }
    const height = y + 8;
    const svg = svgEl("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
    const defs = svgEl("defs");
    const marker = svgEl("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto" });
    marker.append(svgEl("path", { d: "M0 0 L10 5 L0 10 z", fill: "context-stroke" }));
    defs.append(marker); svg.append(defs);
    const layer = () => { const g = svgEl("g"); svg.append(g); return g; };
    const gBack = layer(), gHit = layer(), gLanes = layer(), gEdges = layer(), gNodes = layer();

    for (const by of bands) gBack.append(svgEl("rect", { class: "band", x: 0, y: by, width, height: SEC }));
    const cursor = new Date(t0); cursor.setUTCDate(1); cursor.setUTCMonth(cursor.getUTCMonth() + 1);
    for (; cursor.getTime() < t1; cursor.setUTCMonth(cursor.getUTCMonth() + 1)) {
      const mx = x(cursor.toISOString().slice(0, 10));
      gBack.append(svgEl("line", { class: "month", x1: mx, x2: mx, y1: 0, y2: height }));
      const t = svgEl("text", { x: mx + 4, y: 13 }); t.textContent = cursor.toLocaleString("en", { month: "short", timeZone: "UTC" }); gBack.append(t);
    }
    // Finer ticks appear as the axis is stretched: weeks first, then single days.
    if (pxPerDay >= 2.2) {
      const day = new Date(t0);
      for (; day.getTime() <= t1; day.setUTCDate(day.getUTCDate() + 1)) {
        const monday = day.getUTCDay() === 1, first = day.getUTCDate() === 1;
        if (first || (!monday && pxPerDay < 16)) continue;
        const dx = x(day.toISOString().slice(0, 10));
        gBack.append(svgEl("line", { class: monday ? "week" : "day", x1: dx, x2: dx, y1: AXIS - 4, y2: height }));
        if (monday ? pxPerDay >= 4.5 : pxPerDay >= 22) { const t = svgEl("text", { class: "fine", x: dx + 3, y: 13 }); t.textContent = day.getUTCDate(); gBack.append(t); }
      }
    }
    let lastLabel = -100;
    snaps.forEach((s) => {
      const sx = x(s.date);
      gBack.append(svgEl("line", { class: "guide", x1: sx, x2: sx, y1: AXIS - 8, y2: height }));
      if (sx - lastLabel > 36) { const t = svgEl("text", { x: sx, y: 28, "text-anchor": "middle" }); t.textContent = s.date.slice(5); gBack.append(t); lastLabel = sx; }
    });

    const tip = document.getElementById("tip");
    const showTip = (e, html) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tip.style.top = e.clientY + 16 + "px"; };
    const hideTip = () => (tip.style.display = "none");
    const ends = new Map(H.edges.filter((e) => ["merged", "redirect", "replaced", "rename"].includes(e.type)).map((e) => [e.from, e]));

    for (const p of pages) {
      const row = rows[p.id];
      const hit = svgEl("rect", { class: "rowhit", x: 0, y: row.y - ROW / 2, width, height: ROW });
      hit.addEventListener("mouseenter", () => row.label.classList.add("hot"));
      hit.addEventListener("mouseleave", () => row.label.classList.remove("hot"));
      hit.addEventListener("click", () => { if (!state.dragged) location.hash = pageHref(p.id); });
      row.label.addEventListener("mouseenter", () => hit.classList.add("hot"));
      row.label.addEventListener("mouseleave", () => hit.classList.remove("hot"));
      gHit.append(hit);

      const end = ends.get(p.id);
      const { first, last } = lifespan(p);
      const spans = p.life?.length ? p.life : first == null ? [] : [{ from: snaps[first].date, to: last < snaps.length - 1 ? snaps[last + 1].date : null }];
      spans.forEach((span, k) => {
        const lastSpan = k === spans.length - 1;
        const stop = lastSpan && end && !span.to ? end.date : span.to ?? H.project.to;
        const x1 = x(span.from), x2 = Math.max(x(stop), x1 + 2);
        gLanes.append(svgEl("line", { class: `lane ${p.seen ? "" : "unseen"}`, x1, x2, y1: row.y, y2: row.y }));
        gLanes.append(svgEl("line", { class: "birth", x1, x2: x1, y1: row.y - 5, y2: row.y + 5 }));
        if (span.to && !(lastSpan && end)) {
          gLanes.append(svgEl("line", { class: "death", x1: x2 - 4, x2: x2 + 4, y1: row.y - 4, y2: row.y + 4 }));
          gLanes.append(svgEl("line", { class: "death", x1: x2 - 4, x2: x2 + 4, y1: row.y + 4, y2: row.y - 4 }));
        }
      });
      snaps.forEach((s, i) => {
        const st = status(p, i);
        if (st.kind === "absent" || st.kind === "redirect") return;
        const r = { major: 5.5, new: 5, base: 5, minor: 4, same: 2.5, missing: 2.5 }[st.kind];
        const node = svgEl("circle", { class: `node ${st.kind}`, cx: x(s.date), cy: row.y, r });
        const views = p.views.filter((v) => v.shots[s.id]).length;
        node.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(p.id)}</b><br>${esc(s.date)} · ${STATUS_TEXT[st.kind]}${views > 1 ? ` · ${plural(views, "view")}` : ""}`));
        node.addEventListener("mouseleave", hideTip);
        node.addEventListener("click", () => { if (!state.dragged) location.hash = pageHref(p.id); });
        gNodes.append(node);
      });
    }

    for (const e of H.edges) {
      const a = rows[e.from], b = rows[e.to];
      if (!a || !b || !e.date) continue;
      const ex = x(e.date);
      const path = svgEl("path", { class: `edge ${e.type}` });
      const outOf = e.type === "branch" || e.type === "split" || e.type === "clone";
      if (outOf) path.setAttribute("d", `M${ex - 14} ${a.y} C ${ex - 2} ${a.y}, ${ex - 12} ${b.y}, ${ex} ${b.y}`);
      else { path.setAttribute("d", `M${ex} ${a.y} C ${ex + 14} ${a.y}, ${ex + 2} ${b.y}, ${ex + 16} ${b.y}`); path.setAttribute("marker-end", "url(#arrow)"); }
      const verb = { branch: "was added under", split: "was split off from", clone: "was built from a copy of", merged: "was folded into", replaced: "was replaced by", redirect: "now redirects to", rename: "was renamed to" }[e.type];
      const head = outOf ? `<b>${esc(e.to)}</b> ${verb} <b>${esc(e.from)}</b>` : `<b>${esc(e.from)}</b> ${verb} <b>${esc(e.to)}</b>`;
      path.style.pointerEvents = "stroke";
      path.addEventListener("mousemove", (ev) => showTip(ev, `${head}<br>${esc(e.date)}${e.sha ? " · " + esc(e.sha) : ""}${e.note ? "<br>" + esc(e.note) : ""}`));
      path.addEventListener("mouseleave", hideTip);
      gEdges.append(path);
    }
    const plot = graph.querySelector(".plot");
    plot.append(svg);
    pad.append(graph);
    content.replaceChildren(pad);
    plot.scrollLeft = state.graphLeft;
    plot.addEventListener("scroll", () => (state.graphLeft = plot.scrollLeft));

    // Zoom keeps the moment under the pointer (or the centre) where it is.
    const zoomTo = (next, anchorX = plot.clientWidth / 2) => {
      next = Math.min(MAX_ZOOM, Math.max(1, next));
      if (next === state.zoom) return;
      const at = (plot.scrollLeft + anchorX - LEFT) / (width - LEFT - RIGHT);
      state.zoom = next;
      state.graphLeft = Math.max(0, LEFT + at * (Math.round(fitWidth * next) - LEFT - RIGHT) - anchorX);
      render();
    };
    zoomBar.querySelectorAll("[data-zoom]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.zoom === "fit") { state.graphLeft = 0; zoomTo(1); if (state.zoom === 1) plot.scrollLeft = 0; }
      else zoomTo(state.zoom * (b.dataset.zoom === "in" ? 1.6 : 1 / 1.6));
    }));
    let pending = null;
    plot.addEventListener("wheel", (e) => {
      if (!e.ctrlKey && !e.metaKey) return; // plain scrolling pans and scrolls as usual
      e.preventDefault();
      const anchorX = e.clientX - plot.getBoundingClientRect().left;
      const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.04 : 0.006));
      pending = { zoom: (pending?.zoom ?? state.zoom) * factor, anchorX };
      if (!plot.dataset.frame) {
        plot.dataset.frame = "1";
        requestAnimationFrame(() => { const p = pending; pending = null; delete plot.dataset.frame; zoomTo(p.zoom, p.anchorX); });
      }
    }, { passive: false });
    // Drag to pan. A drag must not count as a click on a line.
    plot.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      const startX = e.clientX, startLeft = plot.scrollLeft;
      state.dragged = false;
      const move = (ev) => {
        if (Math.abs(ev.clientX - startX) > 4) { state.dragged = true; plot.classList.add("panning"); }
        if (state.dragged) plot.scrollLeft = startLeft - (ev.clientX - startX);
      };
      const up = () => {
        window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
        plot.classList.remove("panning");
        setTimeout(() => (state.dragged = false), 0);
      };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
  }

  // ---------- Screens over time ----------
  function renderTimeline() {
    const pages = H.pages.filter((p) => p.seen && matches(p));
    header("Screens over time", `${pages.length} pages · ${plural(snaps.length, "snapshot")}`);
    const pad = el('<div class="pad"></div>');
    pad.append(el('<p class="lead">One row per page, one column per snapshot. A thumbnail appears where the page first existed or changed; a small dot means it looked the same as before. Click a thumbnail to enlarge it, then use the arrow keys to move through the changes. Open a row to see its sections, dialogs and menus.</p>'));
    if (!pages.length) { pad.append(el('<div class="empty">No pages match the filter.</div>')); content.replaceChildren(pad); return; }
    const grid = el(`<div class="grid" style="grid-template-columns: var(--label-w) repeat(${snaps.length}, var(--col-w))"></div>`);
    grid.append(el('<div class="corner">Page ↓ · Time →</div>'));
    snaps.forEach((s) => grid.append(el(`<a class="head" href="#/snapshot/${s.id}" title="${esc(s.subject)}"><div class="date">${esc(s.date)}</div><div class="meta">${s.pages} pages</div></a>`)));

    let section = null;
    for (const page of pages) {
      if (page.section !== section) { section = page.section; grid.append(el(`<div class="section"><span>${esc(section)}</span></div>`)); }
      const { first, last } = lifespan(page);
      const extras = extraViews(page);
      const label = el(`<div class="label"><a class="route" href="${pageHref(page.id)}">${esc(page.id)}</a></div>`);
      if (extras.length) {
        const open = state.expanded.has(page.id);
        const ex = el(`<button class="expander">${open ? "▾ Hide" : "▸ Show"} ${plural(extras.length, "more view")}</button>`);
        ex.addEventListener("click", () => { open ? state.expanded.delete(page.id) : state.expanded.add(page.id); render(); });
        label.append(ex);
      }
      grid.append(label);
      const series = seriesFor(page.id, mainView(page));
      snaps.forEach((s, i) => {
        const st = status(page, i);
        const cell = el(`<div class="cell ${i >= first && i <= last ? "alive" : ""} ${i === first ? "first" : ""} ${i === last ? "last" : ""}"></div>`);
        if (st.shot && img(st.shot) && st.kind === "same" && !state.showSame) {
          const same = el(`<button class="dot samedot" title="Unchanged on ${esc(s.date)}. Click to look anyway."></button>`);
          same.addEventListener("click", () => openLightbox(series, i));
          cell.append(same);
        } else if (st.shot && img(st.shot)) {
          cell.append(thumb(img(st.shot), series, i, st.kind === "same" ? "same" : ""));
          if (st.kind !== "same" && st.kind !== "base") cell.append(el(`<div class="tags">${pillFor(st)}</div>`));
        } else if (st.kind === "redirect") {
          cell.append(el('<span class="dot"></span>'), el(`<a class="pill link" style="position:relative;z-index:1" href="${pageHref(st.to)}">→ ${esc(st.to)}</a>`));
        } else if (st.kind === "missing") cell.append(el('<span class="dot"></span>'));
        else if (i === last + 1) cell.append(el('<span class="pill gone">removed</span>'));
        grid.append(cell);
      });
      if (state.expanded.has(page.id)) for (const view of extras) {
        const row = el('<div class="subrow" style="display:contents"></div>');
        row.append(el(`<div class="label"><a class="route" href="${pageHref(page.id, view.id)}">${esc(view.label)}</a><div class="sub">${esc(KIND_LABEL[view.kind] ?? view.kind)}</div></div>`));
        const vSeries = seriesFor(`${page.id} · ${view.label}`, view);
        snaps.forEach((s, i) => {
          const cell = el('<div class="cell"></div>');
          const st = viewStatus(view, i);
          if (st.shot && img(st.shot) && st.kind === "same" && !state.showSame) {
            const same = el(`<button class="dot samedot" title="Unchanged on ${esc(s.date)}. Click to look anyway."></button>`);
            same.addEventListener("click", () => openLightbox(vSeries, i));
            cell.append(same);
          } else if (st.shot && img(st.shot)) cell.append(thumb(img(st.shot), vSeries, i, st.kind === "same" ? "same" : ""));
          row.append(cell);
        });
        grid.append(row);
      }
    }
    pad.append(grid);
    content.replaceChildren(pad);
  }

  // ---------- Page ----------
  function renderPage(id, viewId) {
    const page = pageById[id];
    if (!page) { header("Unknown page"); content.innerHTML = '<div class="empty">Unknown page.</div>'; return; }
    const order = H.pages.filter((p) => p.seen);
    const at = order.indexOf(page);
    header(page.id, `<a href="#/">Graph</a> › ${esc(page.section)}`);
    const pad = el('<div class="pad"></div>');

    const facts = el('<div class="facts"></div>');
    for (const h of page.history) {
      const text = { added: "Added", deleted: "Deleted", "renamed-to": "Renamed to", "renamed-from": "Renamed from" }[h.kind];
      const other = h.other ? ` <a class="mono" href="${pageHref(h.other)}">${esc(h.other)}</a>` : "";
      facts.append(el(`<div class="row"><span class="pill ${h.kind === "added" ? "new" : h.kind === "deleted" ? "gone" : "link"}">${text}</span>${other}<span>${esc(h.date)}</span><span class="mono">${esc(h.sha)}</span><span>${esc(h.subject)}</span></div>`));
    }
    for (const e of H.edges.filter((e) => e.source !== "git" && (e.from === id || e.to === id))) {
      const out = e.from === id;
      const text = (EDGE_TEXT[e.type] ?? ["Linked to", "Linked from"])[out ? 0 : 1];
      const cls = e.type === "split" || e.type === "branch" || e.type === "clone" ? "new" : e.type === "merged" || e.type === "replaced" ? "gone" : "link";
      facts.append(el(`<div class="row"><span class="pill ${cls}">${text}</span><a class="mono" href="${pageHref(out ? e.to : e.from)}">${esc(out ? e.to : e.from)}</a><span>${esc(e.date)}</span>${e.sha ? `<span class="mono">${esc(e.sha)}</span>` : ""}${e.confidence ? `<span>${esc(e.confidence)} confidence</span>` : ""}</div>`));
      if (e.note) facts.append(el(`<div class="why">${esc(e.note)}</div>`));
    }
    facts.append(el(`<div class="row" style="margin-top:4px">${at > 0 ? `<a class="ghost" href="${pageHref(order[at - 1].id)}">← ${esc(order[at - 1].id)}</a>` : ""}${at >= 0 && at < order.length - 1 ? `<a class="ghost" href="${pageHref(order[at + 1].id)}">${esc(order[at + 1].id)} →</a>` : ""}</div>`));
    pad.append(facts);

    if (!page.views.length) {
      pad.append(el('<div class="empty">There are no screenshots of this page: it existed only between two snapshots, only ever redirected, or could not be captured.</div>'));
      content.replaceChildren(pad); return;
    }
    const view = page.views.find((v) => v.id === viewId) ?? mainView(page) ?? page.views[0];
    const wrap = el('<div class="pagewrap"><nav class="views" aria-label="Views of this page"></nav><div class="detail"></div></div>');
    const nav = wrap.querySelector(".views");
    nav.append(el('<div class="group">Whole page</div>'));
    for (const kind of ["page", "signed-out", "section", "dialog", "menu"]) {
      const group = page.views.filter((v) => v.kind === kind);
      if (!group.length) continue;
      if (kind !== "page" && kind !== "signed-out") nav.append(el(`<div class="group">${KIND_LABEL[kind]} · ${group.length}</div>`));
      for (const v of group) {
        const ticks = snaps.map((s, i) => { const st = viewStatus(v, i); return `<i class="${st.kind === "absent" ? "" : st.kind === "major" ? "major" : st.kind === "new" || st.kind === "base" ? "new" : "on"}" title="${esc(s.date)}: ${STATUS_TEXT[st.kind]}"></i>`; }).join("");
        nav.append(el(`<a href="${pageHref(page.id, v.id)}" aria-current="${v === view}">${esc(v.label)}<span class="ticks">${ticks}</span></a>`));
      }
    }

    const detail = wrap.querySelector(".detail");
    detail.append(el(`<div class="h2" style="margin-top:0">${esc(view.label)} over time</div>`));
    const strip = el('<div class="strip"></div>');
    let hidden = 0;
    const series = seriesFor(`${page.id}${view.id === "page" ? "" : " · " + view.label}`, view);
    snaps.forEach((s, i) => {
      const st = viewStatus(view, i);
      if (st.kind === "same" && !state.showSame) { hidden++; return; }
      if (!st.shot && status(page, i).kind === "absent") return;
      const frame = el(`<div class="frame ${narrow() ? "narrow" : ""}"><header><b>${esc(s.date)}</b><span class="mono" style="color:var(--muted)">${esc(s.id)}</span>${pillFor(st)}</header></div>`);
      if (st.shot && img(st.shot)) {
        const b = el(`<button class="shot"><img loading="lazy" src="${esc(img(st.shot).mid)}" alt="${esc(page.id)} on ${esc(s.date)}"></button>`);
        b.addEventListener("click", () => openLightbox(series, i));
        frame.append(b);
      } else {
        const ps = status(page, i);
        const why = ps.kind === "redirect" ? `Redirects to <a class="mono" href="${pageHref(ps.to)}">${esc(ps.to)}</a>` : ps.kind === "missing" ? "Exists, but could not be captured" : "Not found on the page at this point";
        frame.append(el(`<div class="gap">${why}</div>`));
      }
      frame.append(el(`<div class="caption" title="${esc(s.subject)}">${esc(s.subject)}</div>`));
      strip.append(frame);
    });
    detail.append(strip);
    if (hidden) {
      const note = el(`<p class="lead" style="margin-top:-4px">${plural(hidden, "snapshot")} where this looked the same as before ${hidden === 1 ? "is" : "are"} hidden. <button class="expander">Show them</button></p>`);
      note.querySelector("button").addEventListener("click", () => { document.getElementById("showSame").checked = state.showSame = true; render(); });
      detail.append(note);
    }
    // The slider offers the snapshots where the view changed (all of them when shown).
    const withShots = snaps.filter((s, i) => img(view.shots[s.id]) && (state.showSame || viewStatus(view, i).kind !== "same"));
    if (withShots.length >= 2) {
      detail.append(el('<div class="h2">Compare two points in time</div>'));
      detail.append(compare(view, withShots));
    }
    pad.append(wrap);
    content.replaceChildren(pad);
  }

  function compare(view, withShots) {
    const options = (sel) => withShots.map((s) => `<option value="${s.id}" ${s.id === sel ? "selected" : ""}>${esc(s.date)} · ${esc(s.id)}</option>`).join("");
    const box = el(`<div class="compare"><div class="controls"><select class="field">${options(withShots[0].id)}</select>
      <input type="range" min="0" max="100" value="50" aria-label="Reveal"><select class="field">${options(withShots[withShots.length - 1].id)}</select></div>
      <div class="stage"><img class="before" alt=""><img class="after" alt=""><div class="handle"></div></div></div>`);
    const [a, b] = box.querySelectorAll("select");
    const range = box.querySelector("input"), before = box.querySelector(".before"), after = box.querySelector(".after"), handle = box.querySelector(".handle");
    const update = () => {
      before.src = img(view.shots[a.value]).full; after.src = img(view.shots[b.value]).full;
      after.style.clipPath = `inset(0 0 0 ${range.value}%)`; handle.style.left = range.value + "%";
    };
    [a, b, range].forEach((n) => n.addEventListener("input", update));
    update();
    return box;
  }

  // ---------- Snapshots ----------
  function delta(i) {
    const here = H.pages.filter((p) => exists(p, i));
    return {
      here,
      added: i ? here.filter((p) => !exists(p, i - 1)) : [],
      removed: i ? H.pages.filter((p) => exists(p, i - 1) && !exists(p, i)) : [],
      folded: i ? here.filter((p) => p.presence[snaps[i].id].redirect && !p.presence[snaps[i - 1].id]?.redirect) : [],
      redesigned: here.filter((p) => status(p, i).kind === "major"),
    };
  }
  function renderSnapshots() {
    header("Snapshots", `${plural(snaps.length, "snapshot")} of ${H.project.commits} commits`);
    const pad = el('<div class="pad"><p class="lead">Each snapshot is one commit that was built, seeded and screenshotted. Open one to see the whole site as it was then.</p><div class="snaps"></div></div>');
    snaps.forEach((s, i) => {
      const d = delta(i);
      pad.querySelector(".snaps").append(el(`<a class="snap" href="#/snapshot/${s.id}"><b>${esc(s.date)}</b><span class="mono" style="color:var(--muted)">${esc(s.id)}</span><span>${esc(s.subject)}</span>
        <span class="counts"><span class="pill same">${s.pages} pages</span><span class="pill same">${plural(s.views, "view")}</span>${d.added.length ? `<span class="pill new">+${d.added.length} new</span>` : ""}${d.redesigned.length ? `<span class="pill major">${d.redesigned.length} redesigned</span>` : ""}${d.removed.length ? `<span class="pill gone">−${d.removed.length}</span>` : ""}${d.folded.length ? `<span class="pill link">${d.folded.length} folded</span>` : ""}</span></a>`));
    });
    content.replaceChildren(pad);
  }
  function renderSnapshot(id) {
    const i = snapIndex[id];
    if (i == null) { header("Unknown snapshot"); content.innerHTML = '<div class="empty">Unknown snapshot.</div>'; return; }
    const s = snaps[i], d = delta(i);
    header(s.date, `<a href="#/snapshots">Snapshots</a> › <span class="mono">${esc(s.id)}</span> · ${esc(s.subject)}`);
    const pad = el('<div class="pad"></div>');
    pad.append(el(`<div class="facts"><div class="row">${s.pages} pages · ${s.captured} captured · ${plural(s.views, "view")}</div>
      <div class="row">${i > 0 ? `<a class="ghost" href="#/snapshot/${snaps[i - 1].id}">← ${esc(snaps[i - 1].date)}</a>` : ""}${i < snaps.length - 1 ? `<a class="ghost" href="#/snapshot/${snaps[i + 1].id}">${esc(snaps[i + 1].date)} →</a>` : ""}</div></div>`));
    if (i > 0) {
      const link = (p) => `<a class="mono" href="${pageHref(p.id)}">${esc(p.id)}</a>`;
      const list = (title, cls, items, fmt = link) => items.length ? `<div><span class="pill ${cls}">${title} · ${items.length}</span><ul>${items.map((p) => `<li>${fmt(p)}</li>`).join("")}</ul></div>` : "";
      const html = list("Added", "new", d.added) + list("Redesigned", "major", d.redesigned) + list("Removed", "gone", d.removed) + list("Folded", "link", d.folded, (p) => `${link(p)} → <span class="mono">${esc(p.presence[s.id].redirect)}</span>`);
      if (html) { pad.append(el(`<div class="h2">Since ${esc(snaps[i - 1].date)}</div>`)); pad.append(el(`<div class="lists">${html}</div>`)); }
    }
    pad.append(el('<div class="h2">All pages at this point</div>'));
    const cards = el(`<div class="cards ${narrow() ? "narrow" : ""}"></div>`);
    for (const page of d.here.filter(matches)) {
      const st = status(page, i);
      if (!st.shot || !img(st.shot)) continue;
      if (state.onlyChanged && !["new", "major", "minor"].includes(st.kind)) continue;
      const card = el(`<div class="card"><div style="display:flex;gap:6px;align-items:center;justify-content:space-between"><a class="route" href="${pageHref(page.id)}">${esc(page.id)}</a>${st.kind === "same" || st.kind === "base" ? "" : pillFor(st)}</div></div>`);
      const t = thumb(img(st.shot), seriesFor(page.id, mainView(page)), i);
      t.style.cssText = ""; card.prepend(t);
      cards.append(card);
    }
    pad.append(cards);
    content.replaceChildren(pad);
  }

  // ---------- Lightbox ----------
  const lb = { box: document.getElementById("lightbox"), series: null, index: 0 };
  function openLightbox(series, index) { lb.series = series; lb.index = index; lb.box.classList.add("open"); paintLightbox(); }
  // Stepping skips snapshots where nothing changed, unless they are being shown.
  const nextFrame = (dir) => { for (let i = lb.index + dir; i >= 0 && i < lb.series.frames.length; i += dir) { const f = lb.series.frames[i]; if (f && (state.showSame || !f.same)) return i; } return null; };
  function step(dir) { const i = nextFrame(dir); if (i != null) { lb.index = i; paintLightbox(); } }
  function paintLightbox() {
    const frame = lb.series.frames[lb.index];
    document.getElementById("lbWhere").textContent = lb.series.title;
    document.getElementById("lbWhen").textContent = `${frame.snap.date} · ${frame.snap.id}`;
    document.getElementById("lbImg").src = frame.image.full;
    document.getElementById("lbSteps").innerHTML = lb.series.frames.map((f, i) => (f && (state.showSame || !f.same || i === lb.index) ? `<i class="${i === lb.index ? "on" : ""}"></i>` : "")).join("");
    document.getElementById("lbPrev").disabled = nextFrame(-1) == null;
    document.getElementById("lbNext").disabled = nextFrame(1) == null;
  }
  const closeLightbox = () => lb.box.classList.remove("open");
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  lb.box.addEventListener("click", (e) => { if (e.target === lb.box || e.target.classList.contains("body")) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.box.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });

  // ---------- Shell ----------
  function render() {
    const hash = location.hash || "#/";
    const keep = render.last === hash ? [content.scrollLeft, content.scrollTop] : null;
    render.last = hash;
    document.getElementById("tip").style.display = "none";
    document.body.classList.remove("side-open");
    let active = "graph", current = null;
    if (hash.startsWith("#/page/")) {
      const [id, view] = hash.slice(7).split("/").map(decodeURIComponent);
      current = id; active = null; renderPage(id, view);
    } else if (hash.startsWith("#/snapshot/")) { active = "snapshots"; renderSnapshot(hash.slice(11)); }
    else if (hash === "#/snapshots") { active = "snapshots"; renderSnapshots(); }
    else if (hash === "#/timeline") { active = "timeline"; renderTimeline(); }
    else renderGraph();
    document.querySelectorAll("#nav a").forEach((a) => a.dataset.view === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    renderTree(current);
    if (keep) { content.scrollLeft = keep[0]; content.scrollTop = keep[1]; } else content.scrollTop = 0;
  }
  document.getElementById("project").textContent = H.project.name;
  document.title = `UI History · ${H.project.name}`;
  document.getElementById("search").addEventListener("input", (e) => { state.search = e.target.value; render(); e.target.focus(); });
  document.getElementById("onlyChanged").addEventListener("change", (e) => { state.onlyChanged = e.target.checked; render(); });
  document.getElementById("showSame").addEventListener("change", (e) => { state.showSame = e.target.checked; render(); });
  const seg = document.getElementById("viewports");
  viewportNames.forEach((name, i) => {
    const b = el(`<button data-viewport="${esc(name)}" aria-pressed="${i === 0}">${esc(name)}</button>`);
    b.addEventListener("click", () => {
      state.viewport = name;
      seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      document.documentElement.style.setProperty("--col-w", narrow() ? "112px" : "");
      render();
    });
    seg.append(b);
  });
  if (viewportNames.length < 2) seg.style.display = "none";
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  document.getElementById("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); document.body.classList.toggle("side-open"); });
  content.addEventListener("click", () => document.body.classList.remove("side-open"));
  window.addEventListener("hashchange", render);
  let resizeTimer; window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  render();
})();
</script>
</body>
</html>
