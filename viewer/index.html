        const cx = g.items.reduce((n, it) => n + it.x, 0) / g.items.length;
        // Several unchanged snapshots on top of each other are still just "unchanged";
        // a pile that contains a change shows the change, with the count inside.
        const cluster = g.items.length > 1 && top.st.kind !== "same";
        const r = cluster ? 6.5 : { major: 5.5, new: 5, base: 5, minor: 4, same: 2.5, missing: 2.5 }[top.st.kind];
        const node = svgEl("circle", { class: `node ${top.st.kind}`, cx, cy: row.y, r });
        const detail = g.items.map((it) => { const n = p.views.filter((v) => v.shots[it.s.id]).length; return `${esc(it.s.date)} · ${STATUS_TEXT[it.st.kind]}${n > 1 ? ` · ${plural(n, "view")}` : ""}`; }).join("<br>");
        node.addEventListener("mousemove", (e) => showTip(e, `<b>${esc(p.id)}</b><br>${detail}`));
        node.addEventListener("mouseleave", hideTip);
        node.addEventListener("click", () => { if (!state.dragged) pick(p.id); });
        node.addEventListener("dblclick", () => { location.hash = pageHref(p.id); });
        gNodes.append(node);
        if (cluster) { const t = svgEl("text", { class: `count ${top.st.kind === "major" ? "onfill" : ""}`, x: cx, y: row.y + 3, "text-anchor": "middle" }); t.textContent = g.items.length; gNodes.append(t); }
      }
    }

    for (const e of H.edges) {
      const a = rows[e.from], b = rows[e.to];
      if (!a || !b || !e.date || !linkOn(e)) continue;
      const path = edgePath(e, x(e.date), a.y, b.y);
      if (sel && (e.from === sel || e.to === sel)) path.classList.add("sel");
      gEdges.append(path);
    }
    graph.querySelector(".axis").append(axisSvg);
    graph.querySelector(".body").append(svg);
    const row = el('<div class="graphrow"></div>');
    row.append(graph);
    if (inspectorW) row.append(inspector(sel));
    wrap.append(row);
    content.replaceChildren(wrap);
    const plot = graph;
    plot.scrollLeft = state.graphLeft;
    plot.scrollTop = state.graphTop ?? 0;
    plot.addEventListener("scroll", () => { state.graphLeft = plot.scrollLeft; state.graphTop = plot.scrollTop; });

    // Zoom keeps the moment under the pointer (or the centre) where it is.
    // anchorX is measured from the left edge of the plot area (after the label column).
    const zoomTo = (next, anchorX = (plot.clientWidth - labelW) / 2) => {
      next = Math.min(MAX_ZOOM, Math.max(1, next));
      if (next === state.zoom) return;
      const at = (plot.scrollLeft + anchorX - LEFT) / (width - LEFT - RIGHT);
      state.zoom = next;

    };
    zoomBar.querySelectorAll("[data-zoom]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.zoom === "fit") { state.graphLeft = 0; zoomTo(1); if (state.zoom === 1) plot.scrollLeft = 0; }
      else zoomTo(state.zoom * (b.dataset.zoom === "in" ? 1.6 : 1 / 1.6));
    }));
    let pending = null;
    plot.addEventListener("wheel", (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const anchorX = e.clientX - plot.getBoundingClientRect().left - labelW;
      const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.04 : 0.006));
      pending = { zoom: (pending?.zoom ?? state.zoom) * factor, anchorX };
      if (!plot.dataset.frame) {
        plot.dataset.frame = "1";
        requestAnimationFrame(() => { const q = pending; pending = null; delete plot.dataset.frame; zoomTo(q.zoom, q.anchorX); });
      }
    }, { passive: false });
    plot.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      if (e.target.closest("a, button")) return;
      const startX = e.clientX, startY = e.clientY, startLeft = plot.scrollLeft, startTop = plot.scrollTop;
      state.dragged = false;
      const move = (ev) => {
        if (Math.abs(ev.clientX - startX) > 4 || Math.abs(ev.clientY - startY) > 4) { state.dragged = true; plot.classList.add("panning"); }
        if (state.dragged) { plot.scrollLeft = startLeft - (ev.clientX - startX); plot.scrollTop = startTop - (ev.clientY - startY); }
      };
      const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); plot.classList.remove("panning"); setTimeout(() => (state.dragged = false), 0); };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
  }

  /** The panel beside the graph: the picked page in a picture and a few sentences. */
  function inspector(id) {
    const box = el('<aside class="inspector" aria-label="Selected page"></aside>');
    if (!id) { box.append(el('<div class="inspempty"><b>Pick a line</b><span>Click a page or its line to see it here. Double-click opens it.</span></div>')); return box; }
    const page = pageById[id], view = mainView(page);
    box.append(el(`<div class="insphead"><span class="faint small">${esc(page.section)}</span><span class="mono insproute">${routeHtml(page.id)}</span></div>`));
    const lastShot = view ? [...snaps.keys()].reverse().find((i) => img(view.shots[snaps[i].id])) : undefined;
    if (lastShot != null) box.append(shotButton(page, lastShot, null));
    const lines = [];
    const added = page.history.find((h) => h.kind === "added");
    if (added) lines.push(`Added on <b>${esc(added.date)}</b>.`);
    // Relations of one kind share a sentence: "Split off: a, b and c · 2026-09-20".
    const groups = new Map();
    for (const e of H.edges.filter((x) => x.source !== "git" && (x.from === id || x.to === id))) {
      const out = e.from === id;
      const text = (EDGE_TEXT[e.kind === "extract" ? "extract" : e.type] ?? ["Linked to", "Linked from"])[out ? 0 : 1];
      (groups.get(text) ?? groups.set(text, []).get(text)).push({ other: out ? e.to : e.from, date: e.date });
    }
    for (const [text, items] of groups) {
      const dates = [...new Set(items.map((x) => x.date).filter(Boolean))];
      lines.push(`${esc(text)} ${items.map(({ other }) => `<a class="mono" href="${pageHref(other)}">${esc(other)}</a>`).join(", ")}${dates.length ? ` <span class="faint">· ${dates.map(esc).join(", ")}</span>` : ""}`);
    }
    const last = lastChange(page);
    if (last?.kind === "gone") lines.push(`Removed on <b>${esc(last.date)}</b>.`);
    box.append(el(`<div class="insplines">${lines.map((l) => `<p>${l}</p>`).join("")}</div>`));
    const note = H.edges.find((x) => x.note && (x.from === id || x.to === id));
    if (note) box.append(el(`<blockquote class="inspnote">${esc(note.note)}${note.confidence ? ` <span class="faint">· ${esc(note.confidence)} confidence</span>` : ""}</blockquote>`));
    const changes = view ? snaps.map((s, i) => ({ s, k: viewStatus(view, i).kind })).filter((c) => ["new", "base", "major", "minor"].includes(c.k)).reverse() : [];
    if (changes.length) {
      const list = el(`<div class="inspchanges"><div class="faint small">Changes · ${changes.length}</div></div>`);
      for (const c of changes.slice(0, 8)) list.append(el(`<a href="#/snapshot/${c.s.id}"><span class="cdot ${c.k}"></span>${esc({ new: "Added", base: "First snapshot", major: "Redesigned", minor: "Tweaked" }[c.k])}<span class="faint">${esc(c.s.date)}</span></a>`));
      if (changes.length > 8) list.append(el(`<span class="faint small">and ${changes.length - 8} earlier</span>`));
      box.append(list);
    }
    const actions = el(`<div class="inspactions"><a class="btn primary" href="${pageHref(id)}">Open page</a></div>`);
    const focus = el(`<button class="btn" aria-pressed="${state.focus.has(id)}">${state.focus.has(id) ? "Show everything" : "Only connected"}</button>`);
    focus.addEventListener("click", () => toggleFocus(id));
    actions.append(focus);
    box.append(actions);
    return box;
  }

  // ---------- Screens over time ----------
  function renderTimeline() {
    const pages = H.pages.filter((p) => p.seen && matches(p));
    const heat = state.screenMode === "heat";
    header("Screens", `${plural(pages.length, "page")} · ${plural(snaps.length, "snapshot")}`, [],
      "<p>One row per page, one column per snapshot. A picture appears where the page was added or changed; the line shows how long it existed. Snapshots where none of the pages shown changed shrink to a striped sliver. Heatmap swaps the pictures for small squares, to see the whole history at once. Click a picture to enlarge it and step through the changes with the arrow keys. The number next to a page opens its sections, dialogs and menus as extra rows.</p>");
    if (!pages.length) { content.replaceChildren(emptyState()); return; }
    const bar = el(`<div class="screensbar"><div class="seg" role="group" aria-label="Show as"><button data-mode="thumbs" aria-pressed="${!heat}">Pictures</button><button data-mode="heat" aria-pressed="${heat}">Heatmap</button></div></div>`);
    bar.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.screenMode = b.dataset.mode; render(); }));
    bar.append(relationToggles());

    // Each visible row, with its status per snapshot, so the columns can be sized by what is in them.
    const rows = [];
    for (const page of pages) {
      const { first, last } = lifespan(page);
      rows.push({ page, first, last, series: seriesFor(page.id, mainView(page)), st: snaps.map((_, i) => (i === last + 1 && last < snaps.length - 1 ? { kind: "gone" } : status(page, i))) });
      if (state.expanded.has(page.id)) for (const view of extraViews(page)) {
        const on = snaps.map((_, i) => i).filter((i) => view.shots[snaps[i].id]);
        rows.push({ page, view, first: on[0], last: on[on.length - 1], series: seriesFor(`${page.id} · ${view.label}`, view), st: snaps.map((_, i) => viewStatus(view, i)) });
      }
    }
    const LOUD = ["new", "base", "major", "minor", "redirect", "gone", "missing"];
    const busy = snaps.map((_, i) => state.showSame || rows.some((r) => LOUD.includes(r.st[i].kind)));
    const colW = (i) => (heat ? 22 : !busy[i] ? 24 : narrow() ? 72 : 132);
    const grid = el(`<div class="grid ${heat ? "heat" : ""}" style="grid-template-columns: var(--label-w) ${snaps.map((_, i) => colW(i) + "px").join(" ")}"></div>`);
    grid.append(el('<div class="corner">Page</div>'));
    // "24 May", with the year only where it changes; the commit is in the tooltip.
    snaps.forEach((s, i) => {
      const d = new Date(s.date + "T00:00:00Z");
      const day = d.toLocaleString("en", { day: "numeric", month: "short", timeZone: "UTC" });
      const year = i === 0 || snaps[i - 1].date.slice(0, 4) !== s.date.slice(0, 4) ? `<small>${d.getUTCFullYear()}</small>` : "";
      const tip = `${esc(s.date)} · ${esc(s.id)}\n${esc(s.subject)}${busy[i] ? "" : "\nNone of these pages changed"}`;
      // In the heatmap the columns are too narrow for dates: each month is named where it starts.
      const month = i === 0 || snaps[i - 1].date.slice(0, 7) !== s.date.slice(0, 7) ? d.toLocaleString("en", { month: "short", timeZone: "UTC" }) + (year ? " " + d.getUTCFullYear() : "") : "";
      grid.append(el(heat || !busy[i] ? `<a class="head slim ${busy[i] ? "" : "quiet"}" href="#/snapshot/${s.id}" title="${tip}">${heat && month ? `<span class="mlabel">${esc(month)}</span>` : ""}</a>`
        : `<a class="head" href="#/snapshot/${s.id}" title="${tip}"><div class="date">${esc(day)}${year}</div><div class="meta">${plural(s.pages, "page")}</div></a>`));
    });

    let section = null;
    const cellFor = (r, i) => {
      const st = r.st[i], inRange = r.first != null && i >= r.first && i <= r.last;
      const cell = el(`<div class="cell ${inRange ? "alive" : "outside"} ${i === r.first ? "first" : ""} ${i === r.last ? "last" : ""} ${busy[i] ? "" : "quiet"}"></div>`);
      const shot = st.shot && img(st.shot);
      const loud = ["new", "base", "major", "minor"].includes(st.kind) || (st.kind === "same" && state.showSame);
      if (shot && loud) {
        if (heat) {
          const b = el(`<button class="hm ${st.kind}" title="${esc(snaps[i].date)} · ${esc(STATUS_TEXT[st.kind] ?? st.kind)}" aria-label="${esc(snaps[i].date)}"></button>`);
          b.addEventListener("click", () => openLightbox(r.series, i));
          cell.append(b);
        } else cell.append(thumb(shot, r.series, i, st));
      } else if (st.kind === "redirect") {
        cell.append(heat ? el(`<a class="hm link" href="${pageHref(st.to)}" title="Redirects to ${esc(st.to)}"></a>`) : el(`<a class="redir" href="${pageHref(st.to)}" title="Redirects to ${esc(st.to)}">→ ${routeHtml(st.to)}</a>`));
      } else if (st.kind === "missing") cell.append(el('<span class="dot" title="Exists, but could not be captured"></span>'));
      else if (st.kind === "gone") cell.append(el(heat ? '<span class="hm gone" title="Removed"></span>' : '<span class="gonemark" title="Removed">removed</span>'));
      return cell;
    };
    for (const r of rows) {
      const { page, view } = r;
      if (!view && page.section !== section) { section = page.section; grid.append(el(`<div class="section">${esc(section)}</div>`)); }
      let label;
      if (view) label = el(`<div class="label sub"><a class="route" href="${pageHref(page.id, view.id)}" title="${esc(view.label)}">${esc(view.label)}</a><span class="kind">${esc((KIND_LABEL[view.kind] ?? view.kind).replace(/s$/, ""))}</span></div>`);
      else {
        label = el(`<div class="label" data-page="${esc(page.id)}"><a class="route" href="${pageHref(page.id)}" title="${esc(page.id)}">${routeHtml(page.id)}</a></div>`);
        const extras = extraViews(page);
        if (extras.length) {
          const open = state.expanded.has(page.id);
          const ex = el(`<button class="expander" aria-expanded="${open}" title="${open ? "Hide" : "Show"} this page's sections, dialogs and menus">${extras.length}</button>`);
          ex.addEventListener("click", () => { open ? state.expanded.delete(page.id) : state.expanded.add(page.id); render(); });
          label.append(ex);
        }
        label.append(focusButton(page.id));
      }
      const row = el(`<div class="${view ? "subrow" : "prow"}" style="display:contents"></div>`);
      row.append(label);
      snaps.forEach((_, i) => row.append(cellFor(r, i)));
      grid.append(row);
    }
    content.replaceChildren(bar, grid);
    drawScreenLinks(grid);
  }

  /**
   * The graph's relation curves, laid over the screens grid: each one runs between the two
   * pages' rows, at the first snapshot that shows the result.
   */
  function drawScreenLinks(grid) {
    const rowY = {};
    for (const label of grid.querySelectorAll(".label[data-page]")) rowY[label.dataset.page] = label.offsetTop + label.offsetHeight / 2;
    const heads = [...grid.querySelectorAll(".head")];
    const svg = svgEl("svg", { class: "links", width: grid.scrollWidth, height: grid.scrollHeight });
    svg.append(arrowDefs());
    for (const e of H.edges) {
      if (!e.date || !linkOn(e) || rowY[e.from] == null || rowY[e.to] == null) continue;
      let k = snaps.findIndex((s) => s.date >= e.date);
      if (k < 0) k = snaps.length - 1;
      // At the left edge of that snapshot's column, clear of its picture.
      svg.append(edgePath(e, heads[k].offsetLeft + Math.min(18, heads[k].offsetWidth / 2), rowY[e.from], rowY[e.to]));
    }
    grid.append(svg);
  }

  // ---------- Page ----------
  function renderPage(id, viewId) {
    const page = pageById[id];
    if (!page) { header("Unknown page"); content.innerHTML = '<div class="empty">Unknown page.</div>'; return; }
    const order = H.pages.filter((p) => p.seen);
    const at = order.indexOf(page);
    const view = page.views.find((v) => v.id === viewId) ?? mainView(page) ?? page.views[0];
    const focusBtn = el(`<button class="btn" aria-pressed="${state.focus.has(id)}" title="Show only what is connected to this page">${FOCUS_ICON} Connected</button>`);
    focusBtn.addEventListener("click", () => { toggleFocus(id); if (state.focus.has(id)) location.hash = "#/"; });
    const prev = at > 0 ? el(`<a class="btn icon" href="${pageHref(order[at - 1].id)}" title="Previous page: ${esc(order[at - 1].id)}" aria-label="Previous page">←</a>`) : null;
    const next = at >= 0 && at < order.length - 1 ? el(`<a class="btn icon" href="${pageHref(order[at + 1].id)}" title="Next page: ${esc(order[at + 1].id)}" aria-label="Next page">→</a>`) : null;
    const playBtn = el('<button class="btn" title="Play this view through time">▶ Play</button>');
    const cmpBtn = el(`<button class="btn" aria-pressed="${state.compare}" title="Compare two snapshots (C)">Compare</button>`);
    cmpBtn.addEventListener("click", () => { state.compare = !state.compare; render(); });
    header(page.id, `<a href="#/timeline">Screens</a> › ${esc(page.section)}`, [playBtn, cmpBtn, focusBtn, prev, next].filter(Boolean),
      "<p>The tabs hold every view of this page: the page itself, its signed-out version where that differs, and each section, dialog and menu found on it. The list on the right has every version of the selected view; pick one to see it large, or press ← and →. Compare puts any two versions next to each other, over each other, or as a difference.</p>");
    const pad = el('<div class="pad pagepad"></div>');

    // One or two sentences: when the page came and went, how often it changed, where it came from.
    const added = page.history.find((h) => h.kind === "added");
    const gone = page.life?.length && page.life[page.life.length - 1].to ? [...page.history].reverse().find((h) => h.kind === "deleted") : null;
    const changes = view ? changesOf(mainView(page) ?? view) : 0;
    const last = lastChange(page);
    const lede = el('<p class="lede"></p>');
    lede.innerHTML = (added ? `Added on <b>${esc(added.date)}</b> <span class="faint">· ${esc(added.subject)}</span>.` : `First captured on <b>${esc(snaps.find((s) => page.presence[s.id])?.date ?? "–")}</b>.`)
      + (gone ? ` Removed on <b>${esc(gone.date)}</b>.` : "")
      + (changes > 1 ? ` Changed ${plural(changes, "time")}${last && last.kind !== "gone" ? `, last on ${esc(last.date)}` : ""}.` : "");
    pad.append(lede);
    const rels = H.edges.filter((e) => e.source !== "git" && (e.from === id || e.to === id));
    if (rels.length) {
      const groups = new Map();
      for (const e of rels) {
        const out = e.from === id;
        const text = (EDGE_TEXT[e.kind === "extract" ? "extract" : e.type] ?? ["Linked to", "Linked from"])[out ? 0 : 1];
        (groups.get(text) ?? groups.set(text, []).get(text)).push({ e, other: out ? e.to : e.from });
      }
      const box = el('<div class="rels"></div>');
      for (const [text, items] of groups) {
        const dates = [...new Set(items.map((x) => x.e.date))];
        const row = el(`<div class="rel"><span class="relkind">${esc(text)}</span><span class="relchips">${items.map(({ other }) => `<a class="chip" href="${pageHref(other)}" title="${esc(other)}">${routeHtml(other)}</a>`).join("")}</span><span class="faint small">${dates.map(esc).join(", ")}</span></div>`);
        const notes = items.filter((x) => x.e.note);
        if (notes.length) row.append(el(`<details class="why"><summary>Why?</summary><ul>${notes.map(({ e, other }) => `<li><span class="mono">${esc(other)}</span>${e.confidence ? ` <span class="faint">· ${esc(e.confidence)} confidence</span>` : ""}<br>${esc(e.note)}</li>`).join("")}</ul></details>`));
        box.append(row);
      }
      pad.append(box);
    }

    if (!view) {
      pad.append(el('<div class="empty">There are no screenshots of this page: it existed only between two snapshots, only ever redirected, or could not be captured.</div>'));
      content.replaceChildren(pad); return;
    }

    // Views: one tab per kind, then the views of the chosen kind when there are several.
    const kinds = ["page", "signed-out", "section", "dialog", "menu"].filter((k) => page.views.some((v) => v.kind === k));
    const tabs = el('<div class="vtabs"><nav class="vkinds" aria-label="Views of this page"></nav></div>');
    for (const k of kinds) {
      const group = page.views.filter((v) => v.kind === k);
      const label = k === "page" ? "Whole page" : k === "signed-out" ? "Signed out" : KIND_LABEL[k];
      tabs.firstElementChild.append(el(`<a href="${pageHref(page.id, group.includes(view) ? view.id : group[0].id)}" aria-current="${group.includes(view)}">${esc(label)}${group.length > 1 || !["page", "signed-out"].includes(k) ? ` <span class="cnt">${group.length}</span>` : ""}</a>`));
    }
    const siblings = page.views.filter((v) => v.kind === view.kind);
    if (siblings.length > 1) {
      const sub = el('<nav class="vsub" aria-label="Which one"></nav>');
      for (const v of siblings) sub.append(el(`<a href="${pageHref(page.id, v.id)}" aria-current="${v === view}" title="${esc(v.label)} · changed in ${plural(changesOf(v), "snapshot")}">${esc(v.label)}</a>`));
      tabs.append(sub);
    }
    pad.append(tabs);

    // Every snapshot of this view, newest first: versions to pick, and folded runs between them.
    const series = seriesFor(`${page.id}${view.id === "page" ? "" : " · " + view.label}`, view);
    playBtn.addEventListener("click", () => { const first = series.frames.findIndex(Boolean); if (first >= 0) openLightbox(series, first, true); });
    const shown = [];
    const rail = el('<aside class="versions" aria-label="Versions"></aside>');
    let run = null;
    const flush = () => {
      if (!run) return;
      const parts = [];
      if (run.same) parts.push(`${plural(run.same, "snapshot")}, no change`);
      if (run.without) parts.push(`${plural(run.without, "snapshot")} without this view`);
      if (run.missing) parts.push(`${plural(run.missing, "snapshot")} not captured`);
      if (run.redirect) parts.push(`redirects to <a class="mono" href="${pageHref(run.redirectTo)}">${esc(run.redirectTo)}</a>`);
      rail.append(el(`<div class="vfold"><i></i>${parts.join(" · ")}</div>`));
      run = null;
    };
    const skip = (kind, extra) => { run ??= { without: 0, same: 0, missing: 0, redirect: 0 }; run[kind]++; if (extra) run.redirectTo = extra; };
    const rows = [];
    for (let i = snaps.length - 1; i >= 0; i--) {
      const s = snaps[i], st = viewStatus(view, i), ps = status(page, i);
      if (!st.shot && ps.kind === "absent") continue;
      if (st.kind === "same" && !state.showSame) { skip("same"); continue; }
      if (!st.shot) { skip(ps.kind === "redirect" ? "redirect" : ps.kind === "missing" ? "missing" : "without", ps.to); continue; }
      if (!img(st.shot)) continue;
      flush();
      shown.unshift(i);
      const kind = st.kind === "base" ? "new" : st.kind;
      const row = el(`<button class="vrow" data-i="${i}"><span class="vthumb"><img loading="lazy" src="${esc(img(st.shot).card)}" alt=""></span><span class="vmeta"><span class="vdate"><span class="cdot ${kind === "same" ? "" : kind}"></span>${esc(s.date)}</span><span class="faint small" title="${esc(s.subject)}">${esc(s.subject)}</span></span></button>`);
      rows.push(row);
      rail.append(row);
    }
    flush();
    if (!shown.length) { pad.append(el('<div class="empty">No screenshot of this view matches the current display options.</div>')); content.replaceChildren(pad); return; }

    const key = `${page.id}|${view.id}`;
    const picked = state.pageAt[key];
    const b = shown.includes(picked) ? picked : shown[shown.length - 1];
    const earlier = shown.filter((i) => i < b);
    const a = shown.includes(state.cmpA[key]) && state.cmpA[key] !== b ? state.cmpA[key] : earlier[earlier.length - 1] ?? shown.find((i) => i !== b);
    for (const row of rows) {
      const i = Number(row.dataset.i);
      if (i === b) row.setAttribute("aria-current", "true");
      if (state.compare && i === a) row.classList.add("isA");
      row.addEventListener("click", () => { state.pageAt[key] = i; delete state.cmpA[key]; render(); });
    }

    const body = el('<div class="pagebody"><main class="hero"></main></div>');
    body.append(rail);
    const hero = body.querySelector(".hero");
    if (state.compare && a != null) {
      hero.append(compareTool(series, a, b, { onPick: (na, nb) => { state.cmpA[key] = na; state.pageAt[key] = nb; render(); } }));
    } else {
      const st = viewStatus(view, b), s = snaps[b];
      const what = st.content ? "Content changed" : { new: "Added", base: "First snapshot", major: "Redesigned", minor: "Tweaked", same: "Unchanged" }[st.kind] ?? "";
      const pixels = st.diff != null && st.kind !== "same" ? `${Math.round(st.diff * 100)} % of pixels · ` : st.content ? `${Math.round(st.diff * 100)} % of pixels, same design · ` : "";
      hero.append(el(`<div class="herohead"><span class="cdot ${st.kind === "same" ? "" : st.kind}"></span><span>${what} on <b>${esc(s.date)}</b></span><span class="faint">${pixels}${esc(s.subject)} · <span class="mono">${esc(s.id)}</span></span></div>`));
      const frame = el(`<div class="heroframe ${narrow() ? "narrow" : ""}"><button class="herostack" title="Open full size"><img src="${esc(img(st.shot).mid)}" alt="${esc(page.id)} on ${esc(s.date)}"><canvas></canvas></button></div>`);
      frame.querySelector("button").addEventListener("click", () => openLightbox(series, b));
      const prevShown = earlier.length ? earlier[earlier.length - 1] : null;
      drawMask(frame.querySelector("canvas"), state.tint && prevShown != null ? st.shot.masks?.[state.viewport] ?? null : null);
      hero.append(frame);
      if (st.shot.sources) {
        const src = st.shot.sources;
        hero.append(el(`<details class="sources"><summary>${plural(src.total, "source file")} changed in ${plural(src.commits, "commit")}</summary><ul>${src.changed.map((f) => `<li class="mono">${esc(f)}</li>`).join("")}${src.total > src.changed.length ? `<li class="faint">… and ${src.total - src.changed.length} more</li>` : ""}</ul></details>`));
      }
      const looks = st.kind !== "same" ? st.shot.styles : null;
      if (looks && (looks.added.length || looks.removed.length)) {
        const items = [...looks.added.map((n) => `<li><span class="faint">new</span> <span class="mono">${esc(n)}</span></li>`), ...looks.removed.map((n) => `<li><span class="faint">gone</span> <span class="mono">${esc(n)}</span></li>`)];
        hero.append(el(`<details class="sources"><summary>Design: ${[looks.added.length && `${plural(looks.added.length, "element look")} new`, looks.removed.length && `${looks.removed.length} gone`].filter(Boolean).join(", ")}</summary><ul>${items.join("")}</ul></details>`));
      }
    }
    pad.append(body);
    content.replaceChildren(pad);
    rail.querySelector('[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
  }
  /** Step the selected version of the page on screen: dir -1 is older, 1 newer. */
  function stepVersion(dir) {
    const rows = [...document.querySelectorAll(".versions .vrow")].map((r) => Number(r.dataset.i)).sort((x, y) => x - y);
    const cur = Number(document.querySelector('.versions .vrow[aria-current="true"]')?.dataset.i);
    const to = rows[rows.indexOf(cur) + dir];
    if (to == null) return;
    const [id, view] = location.hash.slice(7).split("/").map(decodeURIComponent);
    const page = pageById[id];
    const v = page?.views.find((x) => x.id === view) ?? mainView(page) ?? page?.views[0];
    if (!v) return;
    state.pageAt[`${id}|${v.id}`] = to;
    render();
  }

  // ---------- Compare ----------
  const CMP_MODES = [["side", "Side by side"], ["slider", "Slider"], ["onion", "Onion skin"], ["diff", "Difference"]];
  /**
   * Two snapshots of one view, in one of four modes. Used inline on a page and full screen
   * from the lightbox; series is the view's frames by snapshot index, a and b the two picked.
   */
  function compareTool(series, a, b, { onPick, standalone = false, onClose } = {}) {
    const avail = series.frames.map((f, i) => (f ? i : null)).filter((i) => i != null);
    const options = (sel) => avail.map((i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${esc(snaps[i].date)} · ${esc(snaps[i].subject.slice(0, 60))}</option>`).join("");
    const box = el(`<div class="cmp ${standalone ? "full" : ""}" role="${standalone ? "dialog" : "region"}" aria-label="Compare two snapshots">
      <div class="cmpbar">
        ${standalone ? `<span class="where mono">${esc(series.title)}</span>` : ""}
        <div class="seg" role="group" aria-label="Compare mode">${CMP_MODES.map(([k, t]) => `<button data-mode="${k}" aria-pressed="${state.cmpMode === k}">${t}</button>`).join("")}</div>
        <label class="onion" ${state.cmpMode === "onion" ? "" : "hidden"}>A <input type="range" min="0" max="100" value="50" aria-label="Blend"> B</label>
        <span class="spacer"></span>
        <label class="pick"><span>A</span><select class="field">${options(a)}</select></label>
        <button class="btn icon" data-swap title="Swap A and B" aria-label="Swap A and B">⇄</button>
        <label class="pick"><span>B</span><select class="field">${options(b)}</select></label>
        <button class="btn" data-full>${standalone ? "Close" : "Full screen"}</button>
      </div>
      <div class="cmpstage"></div></div>`);
    const [selA, selB] = box.querySelectorAll("select");
    const stage = box.querySelector(".cmpstage");
    const src = (i) => series.frames[i].image.full;
    const cap = (i, label) => `<figcaption><b>${label} · ${esc(snaps[i].date)}</b> <span class="faint">${esc(snaps[i].subject)}</span></figcaption>`;
    let split = 50, blend = 50;
    const paint = () => {
      const A = Number(selA.value), B = Number(selB.value), mode = state.cmpMode;
      box.querySelector(".onion").hidden = mode !== "onion";
      if (mode === "side") {
        stage.className = "cmpstage sbs";
        stage.innerHTML = `<figure>${cap(A, "A")}<img src="${esc(src(A))}" alt=""></figure><figure>${cap(B, "B")}<img src="${esc(src(B))}" alt=""></figure>`;
        return;
      }
      stage.className = `cmpstage layered ${mode}`;
      stage.innerHTML = `<div class="caps">${cap(A, "A")}${cap(B, "B")}</div><div class="layers"><img class="under" src="${esc(src(A))}" alt=""><img class="over" src="${esc(src(B))}" alt="">${mode === "slider" ? '<div class="handle" role="slider" aria-label="Divider between A and B" aria-valuemin="0" aria-valuemax="100" tabindex="0"><span class="grip">⟷</span></div>' : ""}</div>`;
      const over = stage.querySelector(".over"), layers = stage.querySelector(".layers");
      if (mode === "onion") over.style.opacity = blend / 100;
      if (mode === "slider") {
        const handle = stage.querySelector(".handle");
        const set = () => { over.style.clipPath = `inset(0 0 0 ${split}%)`; handle.style.left = split + "%"; handle.setAttribute("aria-valuenow", Math.round(split)); };
        const fromPointer = (e) => { const r = layers.getBoundingClientRect(); split = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)); set(); };
        layers.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.preventDefault(); fromPointer(e);
          const move = (ev) => fromPointer(ev);
          const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
          window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
        });
        handle.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); e.stopPropagation(); split = Math.min(100, Math.max(0, split + (e.key === "ArrowLeft" ? -2 : 2))); set(); } });
        set();
      }
    };
    box.querySelectorAll("[data-mode]").forEach((btn) => btn.addEventListener("click", () => {
      state.cmpMode = btn.dataset.mode;
      box.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      paint();
    }));
    box.querySelector(".onion input").addEventListener("input", (e) => { blend = Number(e.target.value); const over = stage.querySelector(".over"); if (over) over.style.opacity = blend / 100; });
    const picked = () => { if (onPick) onPick(Number(selA.value), Number(selB.value)); else paint(); };
    [selA, selB].forEach((s) => s.addEventListener("input", picked));
    box.querySelector("[data-swap]").addEventListener("click", () => { [selA.value, selB.value] = [selB.value, selA.value]; picked(); });
    const close = () => { document.removeEventListener("keydown", onEsc, true); if (standalone) { box.remove(); onClose?.(); } else { state.cmpFull = false; box.classList.remove("full"); fullBtn.textContent = "Full screen"; } };
    const onEsc = (e) => {
      if (!box.isConnected) { document.removeEventListener("keydown", onEsc, true); return; }
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); }
    };
    const fullBtn = box.querySelector("[data-full]");
    fullBtn.addEventListener("click", () => {
      if (standalone || box.classList.contains("full")) { close(); return; }
      state.cmpFull = true; box.classList.add("full"); fullBtn.textContent = "Exit full screen";
      document.addEventListener("keydown", onEsc, true);
    });
    if (standalone) document.addEventListener("keydown", onEsc, true);
    // Full screen survives a re-render after picking another snapshot.
    if (!standalone && state.cmpFull) { box.classList.add("full"); fullBtn.textContent = "Exit full screen"; document.addEventListener("keydown", onEsc, true); }
    paint();
    return box;
  }

  // ---------- Story ----------
  /** The last snapshot at or before index i in which the page was captured. */
  const shotAtOrBefore = (page, i) => { for (let j = i; j >= 0; j--) if (img(mainView(page)?.shots[snaps[j].id])) return j; return null; };
  function renderStory(n) {
    const entries = H.changelog ?? [];
    header("Story", `${plural(entries.length, "chapter")} · written from the snapshots and the commits`, [], "<p>A written account of how the UI evolved, one chapter per period. Pick a chapter on the left. Each one shows the pages it talks about before and after the period, and links the snapshots. The agent writes it from the lineage and the captured changes; edit <code>.ui-progress/changelog.json</code> to change it.</p>");
    if (!entries.length) { content.replaceChildren(el('<div class="empty">No story yet. Ask the agent to write the changelog (<code>ui-progress changelog candidates</code> gives it the material).</div>')); return; }
    const at = Number.isInteger(n) && entries[n] ? n : entries.length - 1;
    const e = entries[at];
    const from = e.from ?? e.date ?? "", to = e.to ?? from;
    const wrap = el('<div class="storywrap"><nav class="chapters" aria-label="Chapters"></nav><article class="chapterview"></article></div>');
    const nav = wrap.querySelector(".chapters");
    let year = null;
    const span = (x) => { const a = x.from ?? x.date ?? "", b = x.to ?? a; return a.slice(0, 7) === b.slice(0, 7) ? dayMonth(a).replace(/^\d+ /, "") : `${dayMonth(a)} – ${dayMonth(b)}`; };
    for (let k = entries.length - 1; k >= 0; k--) {
      const y = (entries[k].from ?? entries[k].date ?? "").slice(0, 4);
      if (y !== year) { year = y; nav.append(el(`<div class="chyear">${esc(y)}</div>`)); }
      nav.append(el(`<a href="#/story/${k}" ${k === at ? 'aria-current="true"' : ""}><span>${esc(entries[k].title)}</span><span class="faint small">${esc(span(entries[k]))}</span></a>`));
    }

    // What the period holds: its snapshots, and what they changed.
    const inside = snaps.map((s, i) => i).filter((i) => snaps[i].date >= from && snaps[i].date <= to);
    const first = inside[0], last = inside[inside.length - 1];
    const beforeI = first != null && first > 0 ? first - 1 : null;
    const added = new Set(), redesigned = new Set();
    for (const i of inside) { const d = delta(i); d.added.forEach((p) => added.add(p.id)); d.redesigned.forEach((p) => redesigned.add(p.id)); }
    const splits = H.edges.filter((x) => x.type === "split" && x.date && x.date >= from && x.date <= to).length;
    const view = wrap.querySelector(".chapterview");
    view.append(el(`<div class="faint">${esc(from === to ? from : `${from} – ${to}`)} · ${plural(inside.length, "snapshot")}</div>`));
    view.append(el(`<h2>${esc(e.title)}</h2>`));
    const stats = [[added.size, "pages added"], [redesigned.size, "pages redesigned"], [splits, splits === 1 ? "split" : "splits"]].filter(([v]) => v);
    if (stats.length) view.append(el(`<div class="chstats">${stats.map(([v, k]) => `<div><b>${v}</b><span>${k}</span></div>`).join("")}</div>`));
    view.append(el(`<p class="chtext">${esc(e.text)}</p>`));

    // The pages the chapter names, as they looked before the period and at its end.
    const pages = (e.pages ?? []).map((id) => pageById[id]).filter((p) => p && last != null && shotAtOrBefore(p, last) != null);
    if (pages.length) {
      const figs = el('<div class="chfigs"></div>');
      for (const p of pages.slice(0, 6)) {
        const a = beforeI != null ? shotAtOrBefore(p, beforeI) : null, b = shotAtOrBefore(p, last);
        const fig = el(`<figure class="chfig"><div class="pair ${a == null ? "single" : ""}"></div><figcaption><a class="route" href="${pageHref(p.id)}">${routeHtml(p.id)}</a><span class="faint small">${a == null ? "new in this period" : `${esc(dayMonth(snaps[a].date))} → ${esc(dayMonth(snaps[b].date))}`}</span></figcaption></figure>`);
        if (a != null && a !== b) fig.querySelector(".pair").append(shotButton(p, a, null));
        fig.querySelector(".pair").append(shotButton(p, b, a == null ? "new" : null));
        figs.append(fig);
      }
      view.append(figs);
      if (pages.length > 6) view.append(el(`<div class="faint small">and ${plural(pages.length - 6, "more page")}: ${pages.slice(6).map((p) => `<a class="mono" href="${pageHref(p.id)}">${esc(p.id)}</a>`).join(", ")}</div>`));
    }
    const snap = e.snapshot && snapIndex[e.snapshot] != null ? snaps[snapIndex[e.snapshot]] : last != null ? snaps[last] : null;
    const foot = el(`<div class="chfoot">${at > 0 ? `<a href="#/story/${at - 1}">← ${esc(entries[at - 1].title)}</a>` : "<span></span>"}${snap ? `<a class="btn" href="#/snapshot/${snap.id}">The site on ${esc(snap.date)}</a>` : ""}${at < entries.length - 1 ? `<a href="#/story/${at + 1}">${esc(entries[at + 1].title)} →</a>` : "<span></span>"}</div>`);
    view.append(foot);
    content.replaceChildren(wrap);
  }

  // ---------- Runs ----------
  const dur = (sec) => {
    if (sec == null) return "?";
    const x = Math.round(sec);
    if (x < 60) return `${x}s`;
    if (x < 3600) return `${Math.floor(x / 60)}m ${String(x % 60).padStart(2, "0")}s`;
    return `${Math.floor(x / 3600)}h ${String(Math.floor((x % 3600) / 60)).padStart(2, "0")}m`;
  };
  const num = (n) => (n ?? 0).toLocaleString("en");
  function renderRuns() {
    const S = H.stats;
    const runs = S?.commits ?? [];
    header("Runs", runs.length ? `${plural(S.totals.attempts, "attempt")} on ${plural(runs.length, "commit")} · from <span class="mono">runs.jsonl</span>` : "", [],
      "<p>How the snapshots were made. Every <code>ui-progress snapshot</code> attempt is recorded in <code>.ui-progress/runs.jsonl</code>: how long each phase took, what was captured, why pages were recaptured instead of copied forward, and whether the adapter, config or screens changed since the attempt before (a setup fix). Tokens, tool calls and agent time are what the agent reported with <code>ui-progress stats note</code>; ui-progress cannot check them. The same data is in <code>ui-progress stats</code>.</p>");
    if (!runs.length) { content.replaceChildren(el('<div class="empty">No runs recorded yet. Every <code>ui-progress snapshot</code> adds a line to <code>.ui-progress/runs.jsonl</code>; rebuild the viewer afterwards.</div>')); return; }
    const t = S.totals;
    const box = el('<div class="runs"></div>');

    // First what needs a look, then the numbers.
    const failed = runs.filter((c) => !c.ok);
    const suspect = runs.filter((c) => c.ok && c.final?.suspects);
    const full = (S.fullRecaptures ?? []).filter((r) => r.reason !== "no earlier snapshot");
    const issues = failed.length + (suspect.length ? 1 : 0) + (full.length ? 1 : 0);
    box.append(el(`<div class="runshead"><h2>${t.captured} of ${plural(t.commits, "commit")} captured${issues ? `, ${issues === 1 ? "1 thing needs" : `${issues} things need`} a look` : ""}</h2>
      <p>${dur(t.finalSeconds)} of capture time over ${plural(t.attempts, "attempt")}${t.failedAttempts ? `, ${t.failedAttempts} failed` : ""}. ${t.firstTry} of ${t.commits - (t.imported ?? 0)} worked on the first try${t.imported ? ` (${t.imported} imported from before run records existed)` : ""}.</p></div>`));
    const issueBox = el('<section class="issues" aria-label="Needs a look"></section>');
    for (const c of failed) {
      const lastTry = c.attempts[c.attempts.length - 1];
      issueBox.append(el(`<div class="issue bad"><span class="ico">!</span><div><b>No snapshot for <span class="mono">${esc(c.sha)}</span> · ${esc(c.subject)}</b><p>Failed ${plural(c.attempts.length, "time")} in ${esc(lastTry.phase ?? "?")}${lastTry.error ? `: ${esc(lastTry.error)}` : ""}.${c.standsInFor?.length ? "" : ""}</p></div></div>`));
    }
    if (suspect.length) {
      const n = suspect.reduce((k, c) => k + c.final.suspects, 0);
      issueBox.append(el(`<div class="issue warn"><span class="ico">?</span><div><b>${plural(n, "suspect page")} in ${plural(suspect.length, "snapshot")}</b><p>Captured, but they look like an error page, a login wall or a blank screen. Most in ${suspect.sort((a, b) => b.final.suspects - a.final.suspects).slice(0, 3).map((c) => `<a href="#/snapshot/${esc(c.sha)}">${esc(c.date)}</a> (${c.final.suspects})`).join(", ")}.</p></div></div>`));
    }
    if (full.length) issueBox.append(el(`<div class="issue warn"><span class="ico">↻</span><div><b>Everything recaptured ${plural(full.length, "time")}</b><p>${full.slice(0, 4).map((r) => `<span class="mono">${esc(r.sha)}</span> ${esc(r.reason)}${r.file ? ` <span class="mono faint">${esc(r.file)}</span>` : ""}`).join("<br>")}</p></div></div>`));
    if (issueBox.children.length) box.append(issueBox);

    const kpi = (v, k) => `<div><b>${v}</b><span>${k}</span></div>`;
    box.append(el(`<section class="kpis">
      ${kpi(dur(t.finalSeconds), "capture time")}
      ${kpi(num(t.pagesCaptured), t.reused ? `pages shot · ${num(t.reused)} copied forward` : "pages shot")}
      ${kpi(num(t.shots), `screenshots · ${num(t.states)} states`)}
      ${kpi(String(t.fixes), t.fixes === 1 ? "setup fix" : "setup fixes")}
      ${S.agent ? kpi(S.agent.tokens != null ? num(S.agent.tokens) : dur(S.agent.seconds), S.agent.tokens != null ? "agent tokens · reported" : "agent time · reported") : ""}
    </section>`));
    if (S.conclusions?.length) box.append(el(`<section><h3>What the numbers say</h3><ul class="findings">${S.conclusions.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></section>`));

    // One row per commit; each attempt is a bar as long as it took, failed ones outlined.
    const all = state.runsAll;
    const withAgent = all && runs.some((c) => c.agent);
    const agentCell = (a) => (a ? [a.tokens != null && `${Math.round(a.tokens / 1000)}k tok`, a.seconds != null && dur(a.seconds)].filter(Boolean).join(" · ") : "");
    const longest = Math.max(1, ...runs.flatMap((c) => c.attempts.map((a) => a.seconds ?? 0)));
    const tip = document.getElementById("tip");
    const rows = [...runs].reverse().map((c) => {
      const ci = runs.indexOf(c);
      const f = c.final;
      const known = snapIndex[c.sha] != null;
      const bars = c.attempts.map((a, ai) => `<span class="try ${a.ok ? "" : "fail"}" data-c="${ci}" data-a="${ai}" style="width:${Math.max(3, Math.round(((a.seconds ?? 0) / longest) * 120))}px"></span>`).join("");
      const last = c.attempts[c.attempts.length - 1];
      const result = c.ok
        ? f?.suspects ? `<span class="rwarn">${plural(f.suspects, "suspect")}</span>` : c.firstTry ? "OK" : c.imported ? '<span class="faint" title="Read back from the snapshot folder: made before run records existed">imported</span>' : "OK after a fix"
        : `<span class="rbad">Failed in ${esc(last.phase ?? "?")}</span>`;
      return `<tr>
        <td><div class="rsubj" title="${esc(c.subject)}">${known ? `<a href="#/snapshot/${esc(c.sha)}">${esc(c.subject)}</a>` : esc(c.subject)}</div><div class="faint small">${esc(c.date)} · <span class="mono">${esc(c.sha)}</span>${c.standsInFor.length ? ` · stands in for ${esc(c.standsInFor.join(", "))}` : ""}</div></td>
        <td><div class="tries">${bars}</div></td>
        <td class="num">${dur(last.seconds)}</td>
        <td class="num">${f ? `${f.captured}/${f.pages}` : ""}</td>
        ${all ? `<td class="num">${f?.reused || ""}</td>` : ""}
        <td class="num">${f ? num(f.shots) : ""}</td>
        ${all ? `<td class="num">${f ? num(f.states) : ""}</td><td class="num">${f?.skipped || ""}</td><td class="num">${f?.suspects || ""}</td><td class="num">${c.fixes || ""}</td>` : ""}
        ${withAgent ? `<td class="num" title="Reported by the agent">${agentCell(c.agent)}</td>` : ""}
        <td>${result}</td>
      </tr>`;
    }).join("");
    const tableBox = el(`<section><div class="sechead"><h3>Per commit <span class="faint">newest first</span></h3><button class="linkbtn">${all ? "Fewer columns" : "All columns"}</button></div><div class="scrollx"><table class="rtable">
      <thead><tr><th>Commit</th><th>Attempts</th><th class="num">Time</th><th class="num">Pages</th>${all ? '<th class="num">Copied</th>' : ""}<th class="num">Shots</th>${all ? '<th class="num">States</th><th class="num">Skipped</th><th class="num">Suspects</th><th class="num">Fixes</th>' : ""}${withAgent ? '<th class="num" title="Reported by the agent">Agent</th>' : ""}<th>Result</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`);
    tableBox.querySelector(".linkbtn").addEventListener("click", () => { state.runsAll = !state.runsAll; render(); });
    tableBox.querySelectorAll(".try").forEach((bar) => {
      const c = runs[bar.dataset.c], a = c.attempts[bar.dataset.a];
      const f = a.ok && Number(bar.dataset.a) === c.attempts.length - 1 ? c.final : null;
      const phases = f?.timings ? Object.entries(f.timings).map(([k, v]) => `${esc(k)} ${dur(v)}`).join(" · ") : "";
      const why = f?.recapture?.reason && f.recapture.reason !== "incremental" ? `<br>everything recaptured: ${esc(f.recapture.reason)}${f.recapture.file ? ` (${esc(f.recapture.file)})` : ""}` : "";
      const html = `<b>${esc(c.sha)}</b> attempt ${Number(bar.dataset.a) + 1} of ${c.attempts.length}<br>${esc(String(a.at ?? "").replace("T", " ").slice(0, 16))} · ${dur(a.seconds)}${a.ok ? "" : `<br>✗ failed in ${esc(a.phase)}${a.error ? `: ${esc(a.error)}` : ""}`}${a.changed?.length ? `<br>after a change to ${esc(a.changed.join(", "))}` : ""}${phases ? `<br>${phases}` : ""}${why}`;
      bar.addEventListener("mousemove", (e) => { tip.innerHTML = html; tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tip.style.top = e.clientY + 16 + "px"; });
      bar.addEventListener("mouseleave", () => (tip.style.display = "none"));
    });
    box.append(tableBox);

    if (S.phases?.length) {
      const top = S.phases[0].seconds || 1;
      box.append(el(`<section><h3>Where the time goes <span class="faint">final runs</span></h3><div class="phases">${S.phases.map((x) => `<span>${esc(x.phase)}</span><span class="bar"><i style="width:${(x.seconds / top) * 100}%"></i></span><span class="n">${dur(x.seconds)} · ${Math.round(x.share * 100)}%</span>`).join("")}</div></section>`));
    }
    if (S.agent?.tasks?.length) {
      box.append(el(`<section><h3>Other agent tasks <span class="faint">reported by the agent</span></h3><div class="scrollx"><table class="rtable"><thead><tr><th>When</th><th>Task</th><th class="num">Tokens</th><th class="num">Tool calls</th><th class="num">Time</th><th>Model</th><th>Note</th></tr></thead><tbody>${S.agent.tasks.map((a) => `<tr><td>${esc(String(a.at ?? "").replace("T", " ").slice(0, 16))}</td><td>${esc(a.task)}${a.shas.length ? ` <span class="mono faint">${esc(a.shas.join(", "))}</span>` : ""}</td><td class="num">${a.tokens != null ? num(a.tokens) : ""}</td><td class="num">${a.toolCalls ?? ""}</td><td class="num">${a.seconds != null ? dur(a.seconds) : ""}</td><td>${esc(a.model ?? "")}</td><td class="faint">${esc(a.note ?? "")}</td></tr>`).join("")}</tbody></table></div></section>`));
    }
    const fails = Object.entries(S.failedByPhase ?? {});
    if (fails.length) box.append(el(`<section><h3>Failed attempts by phase</h3><ul class="findings">${fails.sort((a, b) => b[1] - a[1]).map(([ph, n]) => `<li>${n} in ${esc(ph)}</li>`).join("")}</ul></section>`));
    if (S.machines?.length) box.append(el(`<p class="faint small" style="margin:0">Measured on ${S.machines.map(esc).join("; ")}. Times from different machines or concurrency are not directly comparable.</p>`));
    const pad = el('<div class="pad runspad"></div>');
    pad.append(box);
    content.replaceChildren(pad);
  }

  // ---------- Snapshots ----------
  function delta(i) {
    const here = H.pages.filter((p) => exists(p, i));
    return {
      here,
      added: i ? here.filter((p) => !exists(p, i - 1)) : [],
      removed: i ? H.pages.filter((p) => exists(p, i - 1) && !exists(p, i)) : [],
      folded: i ? here.filter((p) => p.presence[snaps[i].id].redirect && !p.presence[snaps[i - 1].id]?.redirect) : [],
      redesigned: here.filter((p) => status(p, i).kind === "major"),
      tweaked: here.filter((p) => status(p, i).kind === "minor"),
    };
  }
  const changedIn = (d) => d.added.length + d.redesigned.length + d.tweaked.length + d.removed.length + d.folded.length;
  /** "2 new · 1 redesigned", each with its change dot; empty when nothing visible changed. */
  const factsHtml = (d) => [[d.added, "new", "new"], [d.redesigned, "major", "redesigned"], [d.tweaked, "minor", "tweaked"], [d.removed, "gone", "removed"], [d.folded, "", "folded into another page"]]
    .filter(([list]) => list.length).map(([list, cls, word]) => `<span class="fact"><span class="cdot ${cls}"></span>${list.length} ${word}</span>`).join("");
  const dayMonth = (date) => new Date(date + "T00:00:00Z").toLocaleString("en", { day: "numeric", month: "short", timeZone: "UTC" });
  /** A screenshot that opens the lightbox; the top edge carries the change colour. */
  function shotButton(page, i, kind, size = "card") {
    const view = mainView(page), im = img(view?.shots[snaps[i].id]);
    if (!im) return el('<span class="shotbtn none"></span>');
    const b = el(`<button class="shotbtn ${kind ?? ""} ${narrow() ? "tall" : ""}" title="${esc(page.id)} on ${esc(snaps[i].date)}"><img loading="lazy" src="${esc(im[size] ?? im.card)}" alt=""></button>`);
    b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openLightbox(seriesFor(page.id, view), i); });
    return b;
  }
  /** The last earlier snapshot in which this page was captured. */
  const before = (page, i) => { for (let j = i - 1; j >= 0; j--) if (img(mainView(page)?.shots[snaps[j].id])) return j; return null; };

  function renderSnapshots() {
    header("Snapshots", `${plural(snaps.length, "snapshot")} of ${H.project.commits} commits · newest first`, [], "<p>Each snapshot is one commit that was built, seeded and screenshotted. The small pictures are the pages that changed in it. Open one to see what changed since the snapshot before, and the whole site as it was then.</p>");
    const pad = el('<div class="pad"><div class="log"></div></div>');
    const log = pad.querySelector(".log");
    let year = null, quiet = [];
    const flushQuiet = () => {
      if (!quiet.length) return;
      const [a, b] = [quiet[quiet.length - 1], quiet[0]];
      const range = a === b ? dayMonth(snaps[a].date) : `${dayMonth(snaps[a].date)} – ${dayMonth(snaps[b].date)}`;
      const row = el(`<details class="quiet"><summary><span></span><span class="rail"><i></i></span><span>${plural(quiet.length, "snapshot")} with no visible change · ${esc(range)}</span></summary><div class="quietlist"></div></details>`);
      for (const k of quiet) row.querySelector(".quietlist").append(el(`<a href="#/snapshot/${snaps[k].id}"><span class="faint">${esc(dayMonth(snaps[k].date))}</span> ${esc(snaps[k].subject)}</a>`));
      log.append(row);
      quiet = [];
    };
    for (let i = snaps.length - 1; i >= 0; i--) {
      const s = snaps[i], d = delta(i);
      const y = s.date.slice(0, 4);
      if (y !== year) { flushQuiet(); year = y; log.append(el(`<h2 class="logyear">${esc(y)}</h2>`)); }
      if (i > 0 && !changedIn(d)) { quiet.push(i); continue; }
      flushQuiet();
      const row = el(`<a class="logrow" href="#/snapshot/${s.id}"><span class="when"><b>${esc(dayMonth(s.date))}</b><span class="mono">${esc(s.id)}</span></span><span class="rail"><i class="knot"></i></span>
        <span class="what"><span class="subj">${esc(s.subject)}${s.covers?.length ? ` <span class="faint small">· combines ${s.covers.length + 1}</span>` : ""}</span><span class="facts">${i === 0 ? '<span class="fact">The first snapshot</span>' : factsHtml(d)}<span class="fact faint">${plural(s.pages, "page")}</span></span></span><span class="thumbs"></span></a>`);
      const changed = i === 0 ? d.here.slice(0, 4).map((p) => [p, null]) : [...d.added.map((p) => [p, "new"]), ...d.redesigned.map((p) => [p, "major"]), ...d.tweaked.map((p) => [p, "minor"])].slice(0, 4);
      for (const [p, kind] of changed) row.querySelector(".thumbs").append(shotButton(p, i, kind));
      log.append(row);
    }
    flushQuiet();
    content.replaceChildren(pad);
  }

  /** Every snapshot as a small bar, as tall as what changed in it; the open one is marked. */
  function timeStrip(current) {
    const counts = snaps.map((_, i) => (i ? changedIn(delta(i)) : 0));
    const top = Math.max(1, ...counts);
    const strip = el('<nav class="timestrip" aria-label="All snapshots"></nav>');
    snaps.forEach((s, i) => {
      const d = i ? delta(i) : null;
      const kind = !d ? "base" : d.redesigned.length ? "major" : d.added.length ? "new" : d.removed.length || d.folded.length ? "gone" : d.tweaked.length ? "minor" : "none";
      strip.append(el(`<a href="#/snapshot/${s.id}" class="${i === current ? "on" : ""}" title="${esc(s.date)} · ${esc(s.subject)}${d ? ` · ${plural(counts[i], "change")}` : ""}" ${i === current ? 'aria-current="true"' : ""}><i class="${kind}" style="height:${Math.round(4 + (counts[i] / top) * 24)}px"></i></a>`));
    });
    return strip;
  }

  function renderSnapshot(id) {
    const i = snapIndex[id];
    if (i == null) { header("Unknown snapshot"); content.innerHTML = '<div class="empty">Unknown snapshot.</div>'; return; }
    const s = snaps[i], d = delta(i);
    const prev = i > 0 ? el(`<a class="btn" href="#/snapshot/${snaps[i - 1].id}" title="${esc(snaps[i - 1].subject)} (←)">← ${esc(dayMonth(snaps[i - 1].date))}</a>`) : null;
    const next = i < snaps.length - 1 ? el(`<a class="btn" href="#/snapshot/${snaps[i + 1].id}" title="${esc(snaps[i + 1].subject)} (→)">${esc(dayMonth(snaps[i + 1].date))} →</a>`) : null;
    // Named after its newest UI commit; the captured commit is said where it differs.
    const captured = s.commitSubject ? ` · newest UI commit <span class="mono">${esc(s.uiCommit)}</span>, captured at <span class="mono">${esc(s.id)}</span> <span class="faint">(${esc(s.commitSubject)})</span>` : ` · <span class="mono">${esc(s.id)}</span>`;
    header(s.subject, `<a href="#/snapshots">Snapshots</a> › ${esc(s.date)}${captured}`, [prev, next].filter(Boolean),
      "<p>What changed in this commit since the snapshot before, then every other page as it looked at that point. The bars at the top are all snapshots; ← and → step through them.</p>");
    const pad = el('<div class="pad report"></div>');
    // Snapshots folded into this one (ui-progress combine): their commits, oldest first.
    if (s.covers?.length) pad.append(el(`<details class="sources"><summary>Combines ${plural(s.covers.length + 1, "snapshot")}: ${plural(s.covers.length, "earlier one")} of this period folded in</summary><ul>${s.covers.map((c) => `<li><span class="faint">${esc(c.date)}</span> <span class="mono">${esc(c.short)}</span> ${esc(c.subject)}</li>`).join("")}</ul></details>`));
    pad.append(timeStrip(i));
    const same = d.here.filter((p) => ["same", "base"].includes(status(p, i).kind));
    const parts = [[d.added, "added"], [d.redesigned, "redesigned"], [d.tweaked, "tweaked"], [d.removed, "removed"], [d.folded, "folded into another page"]].filter(([l]) => l.length).map(([l, w]) => `${plural(l.length, "page")} ${w}`);
    pad.append(el(`<p class="lede">${i === 0 ? `The first snapshot: ${plural(d.here.length, "page")}.` : parts.length ? `Since ${esc(dayMonth(snaps[i - 1].date))}: <b>${esc(parts.join(", "))}.</b> ${plural(same.length, "page")} look the same.` : `Nothing visible changed since ${esc(dayMonth(snaps[i - 1].date))}.`}</p>`));

    const group = (kind, title, pages, body) => {
      if (!pages.length) return;
      const sec = el(`<section class="rgroup"><h2><span class="cdot ${kind}"></span>${title}<span class="cnt">${pages.length}</span></h2><div class="rgrid ${narrow() ? "narrow" : ""}"></div></section>`);
      for (const p of pages.sort((a, b) => a.id.localeCompare(b.id))) sec.querySelector(".rgrid").append(body(p));
      pad.append(sec);
    };
    const caption = (p, extra = "") => `<a class="route" href="${pageHref(p.id)}" title="${esc(p.id)}">${routeHtml(p.id)}</a>${extra ? `<span class="faint small">${extra}</span>` : ""}`;
    const origin = (p) => { const e = H.edges.find((x) => x.to === p.id && ["split", "clone", "branch"].includes(x.type) && x.date && x.date <= s.date); return e ? `${({ split: "Split off from", clone: "Built from a copy of", branch: "Added under" })[e.type]} ${esc(e.from)}` : ""; };
    const one = (p, kind, extra) => { const c = el(`<div class="rcard">${caption(p, extra)}</div>`); c.prepend(shotButton(p, i, kind)); return c; };
    if (i > 0) {
      group("new", "Added", d.added, (p) => one(p, "new", origin(p)));
      group("major", "Redesigned", d.redesigned, (p) => {
        const j = before(p, i), diff = status(p, i).diff;
        const c = el(`<div class="rcard wide"><div class="pair"></div>${caption(p, `before ${j != null ? esc(dayMonth(snaps[j].date)) : ""} · after${diff != null ? ` · ${Math.round(diff * 100)} % changed` : ""}`)}</div>`);
        c.querySelector(".pair").append(j != null ? shotButton(p, j, null) : el('<span class="shotbtn none"></span>'), shotButton(p, i, "major"));
        return c;
      });
      group("minor", "Tweaked", d.tweaked, (p) => { const diff = status(p, i).diff; return one(p, "minor", diff != null ? `${Math.round(diff * 100)} % changed` : ""); });
      group("gone", "Removed", d.removed, (p) => { const j = before(p, i); const c = el(`<div class="rcard">${caption(p, "last seen " + (j != null ? esc(dayMonth(snaps[j].date)) : ""))}</div>`); c.prepend(j != null ? shotButton(p, j, "gone") : el('<span class="shotbtn none"></span>')); return c; });
      group("", "Folded into another page", d.folded, (p) => { const c = el(`<div class="rcard">${caption(p, `now redirects to ${esc(p.presence[s.id].redirect)}`)}</div>`); const j = before(p, i); c.prepend(j != null ? shotButton(p, j, null) : el('<span class="shotbtn none"></span>')); return c; });
    }

    // Everything else, folded away by default: by section, narrowed by search and the page filter.
    const rest = (i === 0 ? d.here : same).filter(matches).filter((p) => img(mainView(p)?.shots[s.id]));
    const bySection = new Map();
    for (const p of rest) (bySection.get(p.section) ?? bySection.set(p.section, []).get(p.section)).push(p);
    const open = i === 0 || state.snapAll;
    const box = el(`<section class="rest"><div class="resthead"><h2><span class="cdot"></span>${i === 0 ? "All pages" : "Unchanged"}<span class="cnt">${plural(rest.length, "page")} in ${plural(bySection.size, "section")}</span></h2>${i === 0 ? "" : `<button class="btn">${open ? "Hide" : "Show all"}</button>`}</div></section>`);
    box.querySelector("button")?.addEventListener("click", () => { state.snapAll = !state.snapAll; render(); });
    if (open) for (const [section, pages] of [...bySection].sort((a, b) => a[0].localeCompare(b[0]))) {
      const g = el(`<div class="restgroup"><h3>${esc(section)} <span class="cnt">${pages.length}</span></h3><div class="rgrid small ${narrow() ? "narrow" : ""}"></div></div>`);
      for (const p of pages.sort((a, b) => a.id.localeCompare(b.id))) g.querySelector(".rgrid").append(one(p, null));
      box.append(g);
    }
    pad.append(box);
    content.replaceChildren(pad);
  }

  // ---------- Lightbox ----------
  // zoom: a share of the full width (0.1..1), or "page" to fit the whole screenshot. It is
  // kept across frames and across openings, so stepping through time compares like with like.
  const lb = { box: document.getElementById("lightbox"), series: null, index: 0, timer: null, zoom: 1 };
  const lbImg = document.getElementById("lbImg"), lbBody = lb.box.querySelector(".body");
  /** The width the screenshot gets at 100%: the space available, never more than its own pixels. */
  function lbFullWidth() {
    const cs = getComputedStyle(lbBody);
    return Math.min(lbImg.naturalWidth || Infinity, lbBody.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  }
  /** The zoom as a share of the full width; "page" resolves to whatever fits the whole image. */
  function lbScale() {
    if (lb.zoom !== "page") return lb.zoom;
    if (!lbImg.naturalWidth) return 1;
    const room = lbBody.clientHeight - parseFloat(getComputedStyle(lbBody).paddingBottom);
    return Math.min(1, (room * lbImg.naturalWidth / lbImg.naturalHeight) / lbFullWidth());
  }
  function applyZoom() {
    const scale = lbScale();
    document.getElementById("lbStack").style.width = lbImg.naturalWidth ? `${Math.round(lbFullWidth() * scale)}px` : "";
    document.getElementById("lbZoom").textContent = `${Math.round(scale * 100)}%`;
    document.getElementById("lbOut").disabled = scale <= 0.1;
    document.getElementById("lbIn").disabled = scale >= 1;
    document.getElementById("lbWidth").setAttribute("aria-pressed", String(lb.zoom === 1));
    document.getElementById("lbPage").setAttribute("aria-pressed", String(lb.zoom === "page"));
  }
  function setZoom(zoom) { lb.zoom = zoom === "page" ? zoom : Math.min(1, Math.max(0.1, zoom)); applyZoom(); }
  const zoomBy = (factor) => setZoom(Math.round(lbScale() * factor * 100) / 100);
  lbImg.addEventListener("load", applyZoom);
  function openLightbox(series, index, play = false) {
    lb.series = series; lb.index = index; lb.opener = document.activeElement;
    lb.box.classList.add("open");
    lbBody.focus({ preventScroll: true });
    paintLightbox(); if (play) setPlaying(true);
  }
  function setPlaying(on) {
    clearInterval(lb.timer); lb.timer = null;
    document.getElementById("lbPlay").setAttribute("aria-pressed", String(on));
    document.getElementById("lbPlay").textContent = on ? "❚❚ Pause" : "▶ Play";
    if (!on) return;
    lb.timer = setInterval(() => { const i = nextFrame(1); if (i == null) setPlaying(false); else { lb.index = i; paintLightbox(); } }, 1300);
  }
  /** Draw the changed blocks of a run-length mask onto a canvas laid over the image. */
  function drawMask(canvas, mask) {
    if (!mask) { canvas.style.display = "none"; return; }
    canvas.width = mask.cols; canvas.height = mask.rows;
    const g = canvas.getContext("2d");
    g.clearRect(0, 0, mask.cols, mask.rows);
    g.fillStyle = "rgba(255, 120, 0, 0.42)";
    let i = 0, on = false;
    for (const run of mask.runs) { if (on) for (let k = i; k < i + run; k++) g.fillRect(k % mask.cols, Math.floor(k / mask.cols), 1, 1); i += run; on = !on; }
    canvas.style.imageRendering = "pixelated";
    canvas.style.display = "";
  }
  const nextFrame = (dir) => { for (let i = lb.index + dir; i >= 0 && i < lb.series.frames.length; i += dir) { const f = lb.series.frames[i]; if (f && (state.showSame || !f.same)) return i; } return null; };
  function step(dir) { const i = nextFrame(dir); if (i != null) { lb.index = i; paintLightbox(); } }
  function paintLightbox() {
    const frame = lb.series.frames[lb.index];
    document.getElementById("lbWhere").textContent = lb.series.title;
    document.getElementById("lbWhen").textContent = `${frame.snap.date} · ${frame.snap.id}`;
    lbImg.src = frame.image.full;
    applyZoom();
    const tintCanvas = document.getElementById("lbTint");
    const prevIndex = nextFrame(-1);
    const mask = state.tint && prevIndex != null ? frame.mask : null;
    drawMask(tintCanvas, mask);
    document.getElementById("lbWhen").textContent += mask ? " · changes since the previous snapshot are tinted" : "";
    const stripEl = document.getElementById("lbStrip");
    stripEl.replaceChildren(...lb.series.frames.map((f, i) => {
      if (!f || (f.same && !state.showSame && i !== lb.index)) return null;
      const b = el(`<button class="${i === lb.index ? "on" : ""}" title="${esc(f.snap.date)} · ${esc(f.snap.subject)}"><img loading="lazy" src="${esc(f.image.card)}" alt=""><span>${esc(dayMonth(f.snap.date))}</span></button>`);
      b.addEventListener("click", () => { setPlaying(false); lb.index = i; paintLightbox(); });
      return b;
    }).filter(Boolean));
    stripEl.querySelector(".on")?.scrollIntoView({ block: "nearest", inline: "center" });
    document.getElementById("lbCompare").disabled = prevIndex == null;
    document.getElementById("lbPrev").disabled = nextFrame(-1) == null;
    document.getElementById("lbNext").disabled = nextFrame(1) == null;
  }
  const closeLightbox = () => { setPlaying(false); lb.box.classList.remove("open"); lb.opener?.focus?.({ preventScroll: true }); };
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  document.getElementById("lbClose").addEventListener("click", closeLightbox);
  // Compare opens full screen over the lightbox, with the version before as A; closing it returns here.
  document.getElementById("lbCompare").addEventListener("click", () => {
    const a = nextFrame(-1);
    if (a == null) return;
    setPlaying(false);
    lb.box.classList.add("behind");
    document.body.append(compareTool(lb.series, a, lb.index, { standalone: true, onClose: () => { lb.box.classList.remove("behind"); lbBody.focus({ preventScroll: true }); } }));
  });
  document.getElementById("lbPlay").addEventListener("click", () => setPlaying(!lb.timer));
  document.getElementById("lbOut").addEventListener("click", () => zoomBy(1 / 1.25));
  document.getElementById("lbIn").addEventListener("click", () => zoomBy(1.25));
  document.getElementById("lbWidth").addEventListener("click", () => setZoom(1));
  document.getElementById("lbPage").addEventListener("click", () => setZoom("page"));
  // A pinch on a trackpad arrives as a wheel event with ctrlKey set.
  lbBody.addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(Math.exp(-e.deltaY / 100)); }, { passive: false });
  window.addEventListener("resize", () => { if (lb.box.classList.contains("open")) applyZoom(); });
  lb.box.addEventListener("click", (e) => { if (e.target === lb.box || e.target.classList.contains("body")) closeLightbox(); });
  // Captured before anything else: while the lightbox is open its keys belong to it, and
  // the page behind must neither scroll nor react.
  const lbKeys = {
    Escape: () => closeLightbox(),
    ArrowLeft: () => { setPlaying(false); step(-1); },
    ArrowRight: () => { setPlaying(false); step(1); },
    " ": () => setPlaying(!lb.timer),
    "-": () => zoomBy(1 / 1.25), _: () => zoomBy(1 / 1.25),
    "+": () => zoomBy(1.25), "=": () => zoomBy(1.25),
    0: () => setZoom(1),
    ArrowDown: () => lbBody.scrollBy({ top: 80 }), ArrowUp: () => lbBody.scrollBy({ top: -80 }),
    PageDown: () => lbBody.scrollBy({ top: lbBody.clientHeight * 0.9 }), PageUp: () => lbBody.scrollBy({ top: -lbBody.clientHeight * 0.9 }),
    Home: () => lbBody.scrollTo({ top: 0 }), End: () => lbBody.scrollTo({ top: lbBody.scrollHeight }),
  };
  document.addEventListener("keydown", (e) => {
    if (!lb.box.classList.contains("open") || lb.box.classList.contains("behind") || e.metaKey || e.ctrlKey || e.altKey) return;
    const action = lbKeys[e.key];
    if (action) { e.preventDefault(); e.stopPropagation(); action(); }
  }, true);

  // ---------- Shell ----------
  function render() {
    let hash = location.hash || "#/";
    const sectionWanted = /\?section=([^&]+)/.exec(hash)?.[1];
    if (sectionWanted) { hash = hash.split("?")[0]; const d = document.querySelector(`#tree details[data-section="${CSS.escape(decodeURIComponent(sectionWanted))}"]`); if (d) d.open = true; }
    const keep = render.last === hash ? [content.scrollLeft, content.scrollTop] : null;
    if (!keep) state.cmpFull = false;
    render.last = hash;
    document.getElementById("tip").style.display = "none";
    document.body.classList.remove("side-open");
    state.focusSet = connected();
    renderFocusBar();
    document.body.classList.toggle("tinted", state.tint);
    document.body.classList.toggle("comparing", state.compare);
    let active = "graph", current = null;
    if (hash.startsWith("#/page/")) {
      const [id, view] = hash.slice(7).split("/").map(decodeURIComponent);
      current = id; active = null; renderPage(id, view);
    } else if (hash.startsWith("#/snapshot/")) { active = "snapshots"; renderSnapshot(hash.slice(11)); }
    else if (hash === "#/snapshots") { active = "snapshots"; renderSnapshots(); }
    else if (hash === "#/story" || hash.startsWith("#/story/")) { active = "story"; renderStory(hash.startsWith("#/story/") ? Number(hash.slice(8)) : null); }
    else if (hash === "#/runs") { active = "runs"; renderRuns(); }
    else if (hash === "#/timeline") { active = "timeline"; renderTimeline(); }
    else renderGraph();
    document.querySelectorAll("#nav a").forEach((a) => a.dataset.view === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    // The page list only where it helps pick a page; the other views get the full width.
    document.body.classList.toggle("no-side", !(current || active === "graph" || active === "timeline"));
    syncDisplay(current ? "page" : active === "snapshots" && hash.startsWith("#/snapshot/") ? "snapshot" : active);
    renderTree(current);
    if (keep) { content.scrollLeft = keep[0]; content.scrollTop = keep[1]; } else content.scrollTop = 0;
  }
  if (!(H.changelog ?? []).length) document.getElementById("navStory").style.display = "none";
  if (!(H.stats?.commits ?? []).length) document.getElementById("navRuns").style.display = "none";
  document.getElementById("project").textContent = H.project.name;
  document.title = `UI History · ${H.project.name}`;
  document.getElementById("search").addEventListener("input", (e) => { state.search = e.target.value; render(); e.target.focus(); });
  // ---------- Display options ----------
  // Which options each view uses; a view that uses none hides the button.
  const DISPLAY_ROWS = { graph: ["pages"], timeline: ["pages", "frames", "tint"], page: ["frames", "tint"], snapshot: ["pages", "tint"] };
  const displayPop = document.getElementById("displayPop"), displayBtn = document.getElementById("displayBtn");
  function syncDisplay(view = syncDisplay.view) {
    syncDisplay.view = view;
    const rows = DISPLAY_ROWS[view] ?? [];
    document.getElementById("display").hidden = !rows.length;
    if (!rows.length) setDisplayOpen(false);
    displayPop.querySelectorAll("[data-row]").forEach((r) => (r.hidden = !rows.includes(r.dataset.row)));
    displayPop.querySelectorAll("[data-set]").forEach((b) => b.setAttribute("aria-pressed", String(String(state[b.dataset.set]) === b.dataset.value)));
    document.getElementById("tint").checked = state.tint;
    const unchanged = H.pages.filter((p) => p.seen && !everChanged(p)).length;
    document.getElementById("pagesHint").textContent = unchanged ? `${plural(unchanged, "page")} never changed` : "Every page changed at some point";
    const on = [rows.includes("pages") && state.onlyChanged, rows.includes("frames") && state.showSame, rows.includes("tint") && state.tint].filter(Boolean).length;
    const badge = document.getElementById("displayBadge");
    badge.hidden = !on; badge.textContent = on;
  }
  function setDisplayOpen(open) {
    displayPop.hidden = !open;
    displayBtn.setAttribute("aria-expanded", String(open));
    if (open) displayPop.querySelector(".prow:not([hidden]) button, .prow:not([hidden]) input")?.focus();
  }
  displayBtn.addEventListener("click", (e) => { e.stopPropagation(); setDisplayOpen(displayPop.hidden); });
  displayPop.addEventListener("click", (e) => e.stopPropagation());
  document.addEventListener("click", () => setDisplayOpen(false));
  displayPop.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); setDisplayOpen(false); displayBtn.focus(); }
    // Keep Tab inside the popover while it is open.
    if (e.key === "Tab") {
      const items = [...displayPop.querySelectorAll(".prow:not([hidden]) button, .prow:not([hidden]) input, .popfoot button")];
      const at = items.indexOf(document.activeElement);
      const next = e.shiftKey ? (at <= 0 ? items.length - 1 : at - 1) : (at === items.length - 1 ? 0 : at + 1);
      e.preventDefault(); items[next].focus();
    }
  });
  displayPop.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { state[b.dataset.set] = b.dataset.value === "true"; render(); b.focus(); }));
  document.getElementById("tint").addEventListener("change", (e) => { state.tint = e.target.checked; render(); if (lb.box.classList.contains("open")) paintLightbox(); });
  document.getElementById("displayReset").addEventListener("click", () => { state.onlyChanged = false; state.showSame = false; state.tint = false; render(); });
  document.getElementById("collapseAll").addEventListener("click", () => document.querySelectorAll("#tree details[open]").forEach((d) => (d.open = false)));
  document.getElementById("focusClear").addEventListener("click", () => { state.focus.clear(); render(); });
  document.getElementById("helpBtn").addEventListener("click", () => { state.help = !state.help; document.getElementById("help").classList.toggle("open", state.help); document.getElementById("helpBtn").setAttribute("aria-pressed", String(state.help)); });
  const seg = document.getElementById("viewports");
  viewportNames.forEach((name, i) => {
    const b = el(`<button data-viewport="${esc(name)}" aria-pressed="${i === 0}">${esc(name)}</button>`);
    b.addEventListener("click", () => {
      state.viewport = name;
      seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render();
    });
    seg.append(b);
  });
  if (viewportNames.length < 2) seg.style.display = "none";
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
  document.getElementById("menuBtn").addEventListener("click", (e) => { e.stopPropagation(); document.body.classList.toggle("side-open"); });
  content.addEventListener("click", () => document.body.classList.remove("side-open"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && !/input|select|textarea/i.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); document.getElementById("search").focus(); }
    // On a snapshot, the arrow keys step to the one before or after.
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.metaKey && !e.ctrlKey && !e.altKey && location.hash.startsWith("#/snapshot/") && !/input|select|textarea/i.test(document.activeElement?.tagName ?? "")) {
      const at = snapIndex[location.hash.slice(11)], to = at == null ? null : snaps[at + (e.key === "ArrowLeft" ? -1 : 1)];
      if (to) { e.preventDefault(); location.hash = "#/snapshot/" + to.id; }
    }
    // On a page, the arrow keys pick the version before or after; C switches compare on and off.
    if (location.hash.startsWith("#/page/") && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|select|textarea/i.test(document.activeElement?.tagName ?? "") && !document.activeElement?.closest?.(".handle")) {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); stepVersion(e.key === "ArrowLeft" ? -1 : 1); }
      if (e.key === "c") { state.compare = !state.compare; render(); }
    }
  });
  window.addEventListener("hashchange", render);
  let resizeTimer; window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  render();
})();
</script>
</body>
</html>
